.model-switch,.mode-switch,.specs-switch,.quantity-switch{position:relative}
.model-switch-trigger,.mode-switch-trigger,.specs-switch-trigger,.quantity-switch-trigger{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-1);color:var(--ink2);font-size:14px;font-weight:var(--weight-medium);cursor:pointer}
.model-switch-trigger{width:clamp(164px,12vw,180px);min-width:0;justify-content:space-between}
.model-switch-trigger > span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode-switch-trigger{min-width:96px;justify-content:space-between}
.specs-switch-trigger{min-width:154px}
.quantity-switch-trigger{min-width:82px;justify-content:space-between}
.model-switch-trigger .icon,.mode-switch-trigger .icon,.specs-switch-trigger .icon,.quantity-switch-trigger .icon{width:16px;height:16px;color:var(--ink2)}
.model-switch.is-open .model-switch-trigger,.mode-switch.is-open .mode-switch-trigger,.specs-switch.is-open .specs-switch-trigger,.quantity-switch.is-open .quantity-switch-trigger{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold-soft2)}
.model-menu,.mode-menu,.specs-panel,.quantity-menu{position:absolute;left:0;bottom:calc(100% + 10px);z-index:18;border:1px solid var(--gold-line);background:var(--card);box-shadow:var(--shadow-2);opacity:0;visibility:hidden;transform:translateY(6px);pointer-events:none;transition:opacity .16s,transform .16s,visibility .16s}
.model-switch.is-open .model-menu,.mode-switch.is-open .mode-menu,.specs-switch.is-open .specs-panel,.quantity-switch.is-open .quantity-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.model-menu{width:min(620px,calc(100vw - 48px));display:grid;gap:6px;max-height:min(65vh,560px);overflow:auto;padding:8px;border-radius:16px}
.mode-menu{width:168px;display:grid;gap:4px;padding:8px;border-radius:16px}
.mode-menu-item{min-height:42px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:var(--type-body);font-weight:var(--weight-semibold);text-align:left;cursor:pointer}
.mode-menu-item:hover,.mode-menu-item:focus-visible{background:var(--gold-soft);outline:none}
.mode-menu-item.is-active{background:var(--gold-soft);color:var(--gold-deep)}
.model-menu-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);padding:12px 14px;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}
.model-menu-item:hover,.model-menu-item:focus-visible{background:var(--gold-soft);outline:none}
.model-menu-item.is-active{border-color:var(--gold-line);background:var(--gold-soft)}
.model-menu-item-copy{display:grid;gap:5px}
.model-menu-item-copy strong{font-size:16px;line-height:1.35}
.model-menu-item-copy p{color:var(--ink2);font-size:13px;line-height:1.45}
.model-tags{display:flex;gap:5px;flex-wrap:wrap}
.model-tags span{padding:2px 7px;border-radius:var(--radius-full);background:var(--gold-soft2);color:var(--gold-deep);font-size:11px;line-height:1.25}
.model-cost{align-self:start;padding:4px 7px;border-radius:var(--radius-sm);background:var(--gold-soft2);color:var(--gold-deep);font-size:11px;line-height:1.3;white-space:nowrap}
.specs-panel{width:min(500px,calc(100vw - 48px));display:grid;gap:12px;padding:14px;border-radius:16px}
.spec-group{display:grid;gap:6px}
.spec-group > b{font-size:13px}
.spec-options{display:flex;gap:0;overflow:hidden;border-radius:10px;background:var(--card-2)}
.spec-option{min-height:40px;flex:1;display:grid;place-items:center;gap:4px;padding:5px 8px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink2);font-size:13px;cursor:pointer}
.spec-option:hover,.spec-option:focus-visible{background:var(--gold-soft);outline:none}
.spec-option.is-active{border-color:var(--gold-line);background:var(--card);color:var(--ink);font-weight:var(--weight-semibold)}
.spec-option small{font-size:var(--type-meta);color:inherit}
.quantity-menu{width:172px;display:grid;gap:4px;padding:8px;border-radius:16px}
.quantity-menu-title{display:block;padding:4px 12px 6px;color:var(--ink3);font-size:11px;font-weight:var(--weight-semibold)}
.quantity-menu-item{min-height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-size:var(--type-body);font-weight:var(--weight-semibold);text-align:left;cursor:pointer}
.quantity-menu-item:hover,.quantity-menu-item:focus-visible{background:var(--gold-soft);outline:none}
.quantity-menu-item.is-active{background:var(--gold-soft);color:var(--gold-deep)}
.generation-actions{display:flex;align-items:center;gap:var(--space-1);margin-left:auto}
.generation-actions .qj-btn-secondary{min-height:46px;padding-inline:14px;font-size:14px}.generation-submit.qj-btn{min-height:48px;padding:0 17px;border:0;border-radius:var(--radius-full);background:var(--grad-gold);box-shadow:0 8px 18px var(--gold-soft2);color:var(--on-gold);font-size:14px;font-weight:var(--weight-semibold);transition:transform .16s,box-shadow .16s,filter .16s}
.generation-reset.qj-btn{min-height:42px;padding:0 10px;border:1px solid transparent;border-radius:12px;background:transparent;box-shadow:none;color:var(--ink3);font-size:13px;font-weight:var(--weight-medium);gap:5px;transition:color .16s,background .16s,border-color .16s}
.generation-reset.qj-btn > span:first-child{font-size:16px;line-height:1;transform:translateY(-.5px)}
.generation-reset.qj-btn:hover:not(:disabled),.generation-reset.qj-btn:focus-visible:not(:disabled){border-color:var(--line);background:var(--card-2);color:var(--ink);box-shadow:none;outline:none}
.generation-reset.qj-btn:active:not(:disabled){transform:scale(.98)}
.generation-submit.qj-btn:hover:not(:disabled),.generation-submit.qj-btn:focus-visible:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px var(--gold-soft2);filter:saturate(1.05);outline:none}
.generation-submit-content{display:flex;align-items:center;gap:8px;white-space:nowrap}
.generation-submit-points{font-family:var(--mono);font-size:15px;font-weight:var(--weight-semibold)}
.generation-submit-divider{width:1px;height:16px;background:rgba(34,24,42,.2)}
.generation-submit-label{font-size:14px}
.free-task-wrap{width:min(100%,clamp(1040px,72vw,1440px));display:grid;gap:var(--space-2);margin-inline:auto}
.skill-carousel{position:relative;isolation:isolate;min-width:0}
.skill-track{position:relative;z-index:1;width:100%;max-width:100%;display:flex;gap:var(--space-2);overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:var(--space-1) var(--space-1) 22px;margin-bottom:-14px;scrollbar-width:none}
.skill-track::-webkit-scrollbar{display:none}
.skill-track .skill-card{flex:0 0 var(--skill-card-basis,286px);min-height:166px;scroll-snap-align:start}
.skill-card{gap:10px!important;padding:18px!important;cursor:pointer;transition:transform .2s cubic-bezier(.2,.7,.2,1),border-color .2s,box-shadow .2s}
.skill-card h3{font-size:18px!important;line-height:1.3}
.skill-card p{font-size:var(--type-meta)!important;line-height:1.55!important}
.skill-platform-icon{width:42px;height:42px;display:grid;place-items:center;flex:none;border-radius:12px;box-shadow:var(--shadow-1);font-weight:var(--weight-semibold)}
.skill-platform-icon.is-xhs{background:#ff2442;color:#fff;font-size:12px}
.skill-platform-icon.is-wechat{background:#ffa13a;color:#fff}
.skill-platform-icon.is-official{background:#2587e8;color:#fff}
.skill-platform-icon.is-douyin{background:#12131b;color:#fff}
.skill-platform-icon.is-ip{background:var(--grad-gold);color:var(--on-gold)}
.skill-platform-icon.is-ip svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.skill-platform-icon.is-longvideo{background:linear-gradient(145deg,#7773df,#514cae);color:#fff}
.skill-platform-icon svg{width:29px;height:29px;overflow:visible}.skill-platform-icon .video-logo{fill:none!important;stroke:none}.skill-platform-icon .video-logo .video-loop{fill:none!important;stroke:#fff!important;stroke-width:5.7;stroke-linecap:round;stroke-linejoin:round}.skill-platform-icon .official-logo{fill:currentColor;stroke:none}.skill-platform-icon.is-douyin svg{fill:none;stroke-linecap:round;stroke-linejoin:round}.skill-platform-icon .douyin-cyan{stroke:#2cf4ef;stroke-width:3}.skill-platform-icon .douyin-pink{stroke:#ff3a68;stroke-width:3;transform:translate(1.5px,-1.5px)}.skill-platform-icon .douyin-main{stroke:#fff;stroke-width:2.4}
.skill-platform-icon.is-clip{background:linear-gradient(145deg,#39bf79,#168f55);color:#fff;font-size:22px}
.skill-card:hover,.skill-card:focus-visible{transform:translateY(-2px);border-color:var(--gold-line);box-shadow:0 2px 5px rgba(74,53,23,.035),0 12px 26px -10px rgba(74,53,23,.16)}
.skill-card:focus-visible{outline:none}
.skill-card.is-coming-soon{cursor:not-allowed;opacity:.64;filter:saturate(.72)}
.skill-card.is-coming-soon:hover{transform:none;border-color:var(--line);box-shadow:none}
.skill-card.is-coming-soon .qj-badge{background:rgba(194,139,44,.13);color:var(--gold-deep)}
.ip-skill-sheet{width:min(640px,calc(100vw - 32px))}
.ip-skill-placeholder{min-height:min(52vh,420px);display:grid;place-items:center}
.ip-skill-placeholder img{width:128px;height:128px;display:block;border-radius:var(--radius-full);box-shadow:var(--shadow-1)}
.carousel-button{position:absolute;z-index:5;top:50%;width:var(--space-5);height:var(--space-5);display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:var(--radius-full);background:var(--card);box-shadow:var(--shadow-2);color:var(--ink);cursor:pointer;opacity:0;pointer-events:none;transform:translateY(-50%);transition:opacity .16s,transform .16s}
.carousel-button.is-prev{left:var(--space-1)}
.carousel-button.is-next{right:var(--space-1)}
.skill-carousel:hover .carousel-button,.skill-carousel:focus-within .carousel-button{opacity:1;pointer-events:auto}
.carousel-button:hover{transform:translateY(-50%) scale(1.04)}
.replica-top{display:grid;gap:var(--space-2)}
.replica-tabs-host .qj-tabs{padding:4px;border:1px solid rgba(183,140,64,.2);border-radius:12px;background:rgba(248,243,234,.88);box-shadow:inset 0 1px 0 rgba(255,255,255,.82)}
.replica-tabs-host .qj-tab{min-height:36px;padding:0 13px;border-radius:9px;color:var(--ink3);font-size:12px;font-weight:var(--weight-semibold);line-height:1;white-space:nowrap}
.replica-tabs-host .qj-tab.is-active{background:#fffdf9;color:var(--gold-deep);box-shadow:0 2px 6px rgba(93,67,26,.1),inset 0 0 0 1px rgba(194,139,44,.12)}
.replica-toolbar{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-2);padding:4px 0 0;overflow:visible}
.replica-toolbar.qj-card{border:0;background:transparent;box-shadow:none}
.replica-filter-group,.replica-sort-group{display:flex;align-items:flex-end;gap:10px;min-width:0;flex-wrap:wrap}
.replica-toolbar .qj-field{gap:5px;min-width:116px;flex:0 0 116px}
.replica-toolbar .qj-label{font-size:var(--type-meta);font-weight:var(--weight-semibold);color:var(--ink3)}
.replica-toolbar .qj-select{width:116px;min-width:116px;height:38px;padding:0 28px 0 10px;border-radius:10px;font-size:var(--type-meta);background-color:var(--card)}
.replica-sort-group{margin-left:auto;justify-content:flex-end}
.replica-sort-label{align-self:center;font-size:var(--type-meta);color:var(--ink3)}
.replica-sort{position:relative}
.replica-sort-button{height:38px;display:flex;align-items:center;gap:7px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink2);font-size:var(--type-meta);font-weight:var(--weight-semibold);cursor:pointer;transition:border-color .16s,background .16s}
.replica-sort-button:hover,.replica-sort-button:focus-visible{border-color:var(--gold);background:var(--gold-soft);outline:none}
.replica-sort-button.is-active{border-color:var(--line);color:var(--ink2);background:rgba(255,253,249,.88);box-shadow:none}
.replica-sort-button .icon{width:14px;height:14px;transition:transform .16s}
.replica-sort.is-open .replica-sort-button .icon{transform:rotate(180deg)}
.replica-sort-glyph{display:grid;place-items:center;width:16px;height:16px;border-radius:5px;background:transparent;color:var(--gold-deep);font-size:12px;line-height:1}
.replica-sort-menu{position:absolute;right:0;top:calc(100% + 8px);z-index:12;width:146px;display:grid;gap:3px;padding:7px;border:1px solid var(--gold-line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-2);opacity:0;visibility:hidden;transform:translateY(-4px);pointer-events:none;transition:opacity .16s,transform .16s,visibility .16s}
.replica-sort.is-open .replica-sort-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.replica-sort-menu-item{min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 9px;border:0;border-radius:8px;background:transparent;color:var(--ink2);font-size:var(--type-meta);font-weight:var(--weight-semibold);text-align:left;cursor:pointer}
.replica-sort-menu-item:hover,.replica-sort-menu-item:focus-visible{background:var(--gold-soft);color:var(--gold-deep);outline:none}
.replica-sort-menu-item.is-active{background:var(--gold-soft);color:var(--gold-deep)}
.replica-waterfall{position:relative;z-index:1;display:grid;grid-template-columns:repeat(var(--replica-columns,3),minmax(0,1fr));gap:var(--space-2);align-items:start}
.replica-waterfall-column{display:grid;gap:var(--space-2);align-content:start}
.replica-card{width:100%;border-radius:var(--radius-lg)}
.replica-cover{position:relative;overflow:hidden;aspect-ratio:9/16;border-radius:var(--radius-lg);background:var(--grad-navy)}
.replica-card.is-tall .replica-cover,.replica-card.is-short .replica-cover{aspect-ratio:9/16}
.replica-cover img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .36s ease}
.replica-cover-placeholder{position:absolute;inset:0;display:block;overflow:hidden}
.replica-cover-placeholder::before,.replica-cover-placeholder::after,.replica-cover-placeholder span,.replica-cover-placeholder i,.replica-cover-placeholder b{content:"";position:absolute;display:block}
.replica-cover-placeholder.is-tobacco{background:linear-gradient(145deg,#16171e 4%,#40251f 45%,#a34524 100%)}
.replica-cover-placeholder.is-tobacco::before{width:154%;height:28%;left:-24%;top:31%;border-top:2px solid rgba(255,231,181,.82);border-bottom:2px solid rgba(255,231,181,.52);transform:rotate(-22deg)}
.replica-cover-placeholder.is-tobacco::after{width:62%;height:62%;left:18%;top:16%;border:1px solid rgba(255,229,166,.6);border-radius:50%}
.replica-cover-placeholder.is-tobacco span{width:48%;height:12%;right:-8%;bottom:17%;border-radius:999px;background:#f5d493;transform:rotate(-24deg);box-shadow:0 0 0 13px rgba(245,212,147,.12)}
.replica-cover-placeholder.is-tobacco i{width:31%;height:46%;left:28%;bottom:-6%;border:2px solid rgba(245,212,147,.56);border-radius:50% 50% 8px 8px;transform:rotate(-19deg)}
.replica-cover-placeholder.is-tobacco b{width:16px;height:16px;right:18%;top:20%;border-radius:50%;background:#f8d99e;box-shadow:0 0 0 9px rgba(248,217,158,.12)}
.replica-cover-placeholder.is-beverage{background:linear-gradient(155deg,#e9f4ce 0%,#9fd5a5 48%,#38796d 100%)}
.replica-cover-placeholder.is-beverage::before{width:108%;height:46%;left:-4%;bottom:-11%;border-radius:50% 50% 0 0;background:rgba(255,255,236,.36);transform:rotate(-10deg)}
.replica-cover-placeholder.is-beverage::after{width:46%;height:46%;right:14%;top:17%;border:2px solid rgba(255,255,242,.78);border-radius:50%;box-shadow:0 0 0 14px rgba(255,255,242,.17)}
.replica-cover-placeholder.is-beverage span{width:36%;height:58%;left:22%;bottom:10%;border:2px solid rgba(255,255,242,.72);border-radius:44% 44% 30% 30%;transform:rotate(13deg)}
.replica-cover-placeholder.is-beverage i{width:5px;height:48%;left:42%;top:6%;border-radius:999px;background:rgba(255,255,239,.85);transform:rotate(29deg)}
.replica-cover-placeholder.is-beverage b{width:17px;height:17px;right:24%;bottom:19%;border-radius:50%;background:#fffbe1;box-shadow:0 0 0 10px rgba(255,251,225,.18)}
.replica-cover::after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(180deg,transparent,var(--ink));opacity:.88}
.replica-card.is-clean-cover .replica-cover::after{display:none}
.replica-card:hover .replica-cover img,.replica-card:focus-within .replica-cover img{transform:scale(1.035)}
.replica-overlay{position:absolute;z-index:1;left:var(--space-2);right:var(--space-2);bottom:var(--space-2);display:grid;gap:var(--space-1);color:var(--night-ink)}
.replica-overlay h3{font-family:var(--serif);font-size:var(--type-card-title);line-height:1.4}
.replica-author{max-width:100%;overflow:hidden;color:var(--night-ink);font-size:12px;font-weight:var(--weight-semibold);line-height:1.35;text-overflow:ellipsis;white-space:nowrap}.replica-cover-metrics{display:flex;align-items:center;gap:var(--space-2);font-family:var(--mono);font-size:var(--type-meta)}
.replica-hover-action{position:absolute;z-index:3;left:20px;right:20px;bottom:20px;width:calc(100% - 40px);min-height:40px!important;padding:0 14px!important;border-radius:var(--radius-full)!important;font-size:var(--type-meta)!important;opacity:0;pointer-events:none;transform:translateY(var(--space-1));transition:opacity .18s,transform .18s}
.replica-card:hover .replica-hover-action,.replica-card:focus-within .replica-hover-action{opacity:1;pointer-events:auto;transform:none}
.replica-card:hover .replica-overlay,.replica-card:focus-within .replica-overlay{opacity:0}
.replica-cover-tags{position:absolute;z-index:3;left:12px;top:12px;display:flex;gap:var(--space-1);flex-wrap:wrap;max-width:calc(100% - 24px)}
.replica-cover-tags .qj-badge{padding:5px 9px;border:1px solid rgba(216,165,72,.5);border-radius:var(--radius-full);background:rgba(255,250,239,.96);box-shadow:0 2px 10px rgba(27,29,42,.2);color:var(--gold-deep);font-size:11px;font-weight:var(--weight-semibold);letter-spacing:.02em;backdrop-filter:blur(8px)}
.replica-skeleton-card{display:grid;gap:10px;width:100%}
.replica-skeleton-cover{height:auto;aspect-ratio:9/16;border-radius:var(--radius-lg);background:linear-gradient(90deg,var(--card-2),var(--gold-soft),var(--card-2));background-size:200% 100%;animation:skeleton-shift 1.2s linear infinite}
.replica-skeleton-copy{display:grid;gap:7px;padding:0 2px}
.replica-skeleton-copy .skeleton-line{height:10px}
.account-empty-state{min-height:clamp(360px,42vw,520px);display:grid;place-items:center;padding:var(--space-4);overflow:hidden;background:radial-gradient(circle at 50% 24%,var(--gold-soft2),transparent 42%),var(--card)}
.account-empty-content{width:min(100%,540px);display:grid;justify-items:center;gap:var(--space-2);text-align:center}
.account-empty-visual{width:78px;aspect-ratio:9/16;display:grid;place-items:center;border:1px dashed var(--gold-line);border-radius:16px;background:linear-gradient(155deg,var(--card),var(--gold-soft));box-shadow:var(--shadow-1);color:var(--gold-deep);font-family:var(--serif);font-size:32px}
.account-empty-content h3{font-family:var(--serif);font-size:var(--type-zone-title);font-weight:var(--weight-semibold)}
.account-empty-content p{font-size:var(--type-body);line-height:1.6;color:var(--ink3)}
.account-link-form{width:100%;display:flex;gap:var(--space-1);padding:6px;border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card);box-shadow:var(--shadow-1)}
.account-link-form:focus-within{border-color:var(--gold-line);box-shadow:var(--ring)}
.account-link-form .qj-input{min-width:0;flex:1;height:38px;border:0;background:transparent;box-shadow:none}
.account-link-form .qj-input:focus{box-shadow:none}
.account-link-form .qj-btn{min-height:38px;flex:none}
.account-platform-list{display:flex;justify-content:center;gap:var(--space-2);flex-wrap:wrap}
.account-platform{display:inline-flex;align-items:center;gap:6px;color:var(--ink3);font-size:var(--type-meta)}
.account-platform b{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;color:#fff;font-size:10px;line-height:1}
.account-platform.is-xhs b{background:#ff2442}.account-platform.is-wechat b{background:#1aad19}.account-platform.is-douyin b{background:#151515;text-shadow:1px 0 #fb2c6d,-1px 0 #27f4ee}

@media(max-width:1180px){
  .replica-toolbar{align-items:flex-start;flex-direction:column}
  .replica-sort-group{margin-left:0}
}
@media(max-width:896px){
  .replica-waterfall{--replica-columns:2!important}
}
@media(max-width:680px){
  .page-heading{min-height:96px;margin-bottom:var(--space-3)}
  .page-greeting{font-size:30px}
  .workspace-stack{gap:var(--space-4)}
  .studio-body{padding:var(--space-2)}
  .project-dock{padding:var(--space-2)}
  .pinned-project-card{min-width:156px}
  .project-picker{right:var(--space-2);width:calc(100vw - var(--space-4))}

  function renderAllSections() {
    renderReplicaTabs();
    if (['loading', 'empty', 'permission'].includes(state.demo)) {
      renderExceptionalState('free', freeHost);
      renderExceptionalState('skills', skillsHost);
      renderExceptionalState('replica', replicaHost);

    renderFree();
    if (state.demo === 'error') {
      renderExceptionalState('skills', skillsHost);

    renderSkills();

  function renderExceptionalState(view, host) {
    var labels = {
      free: { loading: '正在读取项目与账号…', empty: '当前项目还没有可用账号', permission: '你没有这个项目的创作权限' },
      skills: { loading: '正在加载技能…', empty: '当前租户暂无可用技能', error: '技能库加载失败', permission: '你没有使用技能库的权限' },
      replica: { loading: '正在加载爆款内容…', empty: '没有匹配的爆款内容', error: '爆款内容加载失败', permission: '你没有查看爆款库的权限' }
    };
    var title = labels[view][state.demo];
    if (state.demo === 'loading') {
      if (view === 'replica') {
        host.innerHTML = renderReplicaSkeleton();
        return;
      }
      host.innerHTML = '<section class="qj-card qj-card-section state-panel" aria-busy="true">' +
        '<div class="skeleton-card"><span class="qj-meta">' + title + '</span>' +
        '<div class="skeleton-line is-short"></div><div class="skeleton-line"></div><div class="skeleton-block"></div>' +
        '<div class="skeleton-line"></div><div class="skeleton-line is-short"></div></div></section>';
      return;
    }
    var copy = '';
    var action = '';
    if (state.demo === 'empty' && view === 'free') {
      copy = '先为品牌项目绑定社交账号与唯一人设，再开始创作。';
      action = '<a class="qj-btn qj-btn-secondary" href="奇境-账号工作台-v1.html">去配置账号</a>';
    } else if (state.demo === 'empty') {
      copy = view === 'skills' ? '恢复演示数据后可查看本期的六个技能。' : '筛选条件已保留，可恢复演示数据继续查看。';
      action = '<button class="qj-btn qj-btn-secondary" type="button" data-state-action="restore">恢复演示数据</button>';
    } else if (state.demo === 'permission') {
      copy = '当前角色没有访问该能力的权限，请联系运营管理员调整项目范围。';
      action = '<button class="qj-btn qj-btn-secondary" type="button" data-state-action="restore">返回可用项目</button>';
    } else {
      copy = '暂时无法读取内容，你的筛选条件不会丢失。';
      action = '<button class="qj-btn qj-btn-primary" type="button" data-state-action="restore">重新加载</button>';
    }
    host.innerHTML = '<section class="qj-card qj-card-section state-panel"><div class="qj-empty">' +
      '<div class="qj-empty-title">' + escapeHtml(title) + '</div><p>' + escapeHtml(copy) + '</p>' +
      '<div style="margin-top:var(--space-2)">' + action + '</div></div></section>';

  function renderReplicaSkeleton() {
    var hostWidth = replicaHost.clientWidth || window.innerWidth;
    var columnCount = Math.max(1, Math.floor((hostWidth + 16) / 296));
    var columns = Array.from({ length: columnCount }, function () { return []; });
    var card = '<article class="replica-skeleton-card" aria-hidden="true"><div class="replica-skeleton-cover"></div><div class="replica-skeleton-copy"><div class="skeleton-line"></div><div class="skeleton-line is-short"></div></div></article>';
    columns.forEach(function (column) {
      column.push(card, card);
    });
    return '<div class="replica-waterfall" style="--replica-columns:' + columnCount + '" aria-busy="true" aria-label="正在加载爆款内容">' + columns.map(function (column) {
      return '<div class="replica-waterfall-column">' + column.join('') + '</div>';
    }).join('') + '</div>';
  }

  function renderContextCard() {
    var busy = !!(state.freeTask && ['排队中', '生成中'].includes(state.freeTask.status));
    var pinned = state.pinnedProjects.map(function (id) {
      return PROJECTS.find(function (item) { return item.id === id; });
    }).filter(Boolean);
    var projectCards = pinned.map(function (item) {
      return '<article class="pinned-project-card' + (item.id === state.project ? ' is-active' : '') + '" draggable="true" data-pinned-project="' + item.id + '" tabindex="0" aria-label="' + escapeHtml(item.name) + '，可拖拽调整顺序">' +
        '<span class="project-drag-handle" aria-hidden="true">⠿</span><button class="pinned-project-copy" type="button" data-project-choice="' + item.id + '"' + (busy ? ' disabled' : '') + '><span>' + escapeHtml(item.clientName || item.name) + '</span><b>' + escapeHtml(item.projectName || item.name) + '</b></button>' +
        '<button class="pinned-project-remove" type="button" data-remove-pinned="' + item.id + '" aria-label="移除 ' + escapeHtml(item.name) + '"' + (busy ? ' disabled' : '') + '>×</button></article>';
    }).join('');
    var projectCategories = [
      { id: 'all', name: '全部客户', projectIds: PROJECTS.map(function (item) { return item.id; }) },
      { id: 'hongqi', name: '新华保险', projectIds: ['hongqi'] },
      { id: 'shalan', name: '广州中烟', projectIds: ['shalan'] },
      { id: 'chengye', name: '新曜汽车', projectIds: ['chengye'] },
      { id: 'yunmu', name: '云木家居', projectIds: ['yunmu'] },
      { id: 'qinghe', name: '青禾咖啡', projectIds: ['qinghe'] }
    ];
    var projectQuery = state.projectSearch.trim().toLowerCase();
    var matchesProjectQuery = function (project) {
      if (!projectQuery) return true;
      return [project.clientName, project.projectName, project.name].some(function (value) {
        return String(value || '').toLowerCase().includes(projectQuery);
      });
    };
    var visibleCategories = projectCategories.filter(function (category) {
      return category.id === 'all' || category.projectIds.some(function (id) {
        var project = PROJECTS.find(function (item) { return item.id === id; });
        return project && matchesProjectQuery(project);
      });
    });
    if (!visibleCategories.some(function (category) { return category.id === state.projectPickerCategory; })) state.projectPickerCategory = 'all';
    var selectedCategory = projectCategories.find(function (category) { return category.id === state.projectPickerCategory; }) || projectCategories[0];
    var catalog = PROJECTS.filter(function (item) {
      return selectedCategory.projectIds.includes(item.id) && matchesProjectQuery(item);
    }).map(function (item) {
      var selected = state.pinnedProjects.includes(item.id);
      return '<button class="project-picker-item' + (item.id === state.project ? ' is-active' : '') + (selected ? ' is-selected' : '') + '" type="button" data-picker-project="' + item.id + '" aria-pressed="' + selected + '"' + (busy ? ' disabled' : '') + '><span>' + escapeHtml(item.projectName || item.name) + '</span>' + (selected ? '<span class="project-picker-selection">已选</span>' : '') + '</button>';
    }).join('') || '<p class="project-picker-empty">未找到匹配项目</p>';
    var categoryList = visibleCategories.map(function (category) {
      return '<button class="project-picker-parent' + (category.id === selectedCategory.id ? ' is-active' : '') + '" type="button" data-project-picker-category="' + category.id + '">' + escapeHtml(category.name) + '</button>';
    }).join('');
    return '<div class="project-dock">' +
      '<div class="pinned-project-row"><div class="pinned-project-list" id="pinnedProjectList">' + projectCards + '</div><button class="project-more" type="button" id="moreProjects"' + (busy ? ' disabled' : '') + '>选择项目</button></div>' +
      '<div class="project-picker" id="projectPicker"' + (state.projectPickerOpen ? '' : ' hidden') + '>' +
        '<input class="qj-input" id="projectSearch" type="search" value="' + escapeHtml(state.projectSearch) + '" placeholder="请搜索客户或项目" aria-label="请搜索客户或项目">' +
        '<div class="project-picker-cascade"><div class="project-picker-parents">' + categoryList + '</div><div class="project-picker-children">' + catalog + '</div></div></div></div>';

                  (state.promptTouched && promptInvalid ? '请至少输入 10 个字，再创建生成任务。' : '') +

  function renderFreeTask() {
    var task = state.freeTask;
    if (!task) return '';
    var badgeClass = task.status === '成功' ? 'qj-badge-ok' : task.status === '已取消' ? 'qj-badge-muted' : 'qj-badge-gold';
    var message = task.status === '排队中' ? '任务已进入队列，预计 18 秒后开始。' :
      task.status === '生成中' ? '正在生成内容，离开页面不会中断任务。' :

  function handleReferenceFiles(fileList, slot) {
    var files = Array.prototype.slice.call(fileList || []);
    if (!files.length) return;
    var config = uploadConfig(slot);
    var allowed = config.accept.split(',');
    var slotCount = state.refs.filter(function (file) { return file.slot === slot; }).length;
    if (slotCount >= config.max) {
      qj.toast(config.label + '数量已达上限', 'err');
      return;
    }
    var added = 0;
    files.some(function (file) {
      if (slotCount + added >= config.max) return true;
      if (!file.type || !allowed.includes(file.type)) {
        qj.toast(config.kind === 'video' ? '请上传 MP4 或 MOV 视频' : config.kind === 'audio' ? '请上传 MP3、M4A、AAC 或 WAV 音频' : '请上传 JPEG、PNG、WebP、BMP、TIFF 或 GIF 图片', 'err');
        return false;
      }
      if (file.size > config.maxBytes) {
        qj.toast('单个文件不能超过 ' + (config.maxBytes / 1024 / 1024) + ' MB', 'err');
        return false;
      }
      state.refs.push({
        name: file.name,
        meta: config.label + ' · ' + Math.max(0.1, file.size / 1024 / 1024).toFixed(1) + ' MB',
        kind: config.kind,
        slot: slot,
        preview: config.kind === 'image' ? URL.createObjectURL(file) : ''
      });
      added += 1;
      return false;
    });
    if (!added) return;
    state.materialTouched = true;
    renderFree();
    qj.toast('已添加 ' + added + ' 个' + config.label);
  }

    var track = document.getElementById('skillTrack');
    var prev = document.getElementById('skillPrev');
    var next = document.getElementById('skillNext');
    var gap = 16;
    var cardStep = 302;
    function updateSkillLayout() {
      if (!track) return;
      var visible = Math.max(1, Math.min(SKILLS.length, Math.floor((track.clientWidth + gap) / (280 + gap))));
      var basis = (track.clientWidth - gap * (visible - 1)) / visible;
      track.style.setProperty('--skill-card-basis', basis + 'px');
      cardStep = basis + gap;
      updateSkillButtons();
    }
    function updateSkillButtons() {
      if (!track || !prev || !next) return;
      var maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
      prev.hidden = track.scrollLeft <= gap;
      next.hidden = maxScroll <= gap || track.scrollLeft >= maxScroll - gap;
    }
    function moveSkill(direction) {
      if (track) track.scrollBy({ left: direction * cardStep, behavior: 'smooth' });
    }
    if (prev) prev.addEventListener('click', function () { moveSkill(-1); });
    if (next) next.addEventListener('click', function () { moveSkill(1); });
    if (track) {
      track.addEventListener('scroll', updateSkillButtons, { passive: true });
      track.addEventListener('wheel', function (event) {
        if (Math.abs(event.deltaY) <= Math.abs(event.deltaX)) return;
        event.preventDefault();
        track.scrollLeft += event.deltaY;
      }, { passive: false });
      requestAnimationFrame(updateSkillLayout);
      if ('ResizeObserver' in window) new ResizeObserver(updateSkillLayout).observe(track);
    }
  }

    if (!sortOptions.some(function (item) { return item.value === filters.sort; })) filters.sort = 'latest';
    var filtered = sourceItems.filter(function (item) {
      return (filters.industry === 'all' || item.industry === filters.industry) &&
        (filters.persona === 'all' || item.persona === filters.persona) &&
        (filters.structure === 'all' || item.structure === filters.structure) &&
        (filters.platform === 'all' || item.platform === filters.platform) &&
        (filters.platform !== '小红书爆款' || item.contentType === filters.contentType);
    });
    filtered.sort(function (a, b) {
      if (filters.sort === 'replicated') return (b.replicaCount - a.replicaCount) || (b.publishedAt - a.publishedAt);
      if (filters.sort === 'exposure') return (b.exposure - a.exposure) || (b.publishedAt - a.publishedAt);
      if (filters.sort === 'interactions') return (b.interactions - a.interactions) || (b.publishedAt - a.publishedAt);
      return (b.publishedAt - a.publishedAt) || (b.exposure - a.exposure);
    });

      if (!list.includes(item.structure)) list.push(item.structure);

  function renderReplicaWaterfall(items) {
    var hostWidth = replicaHost.clientWidth || window.innerWidth;
    var columnCount = Math.max(1, Math.min(items.length, Math.floor((hostWidth + 16) / 296)));
    var columnWidth = Math.max(180, (hostWidth - 16 * (columnCount - 1)) / columnCount);
    var cardHeight = columnWidth * 16 / 9;
    var targetRows = Math.max(4, Math.ceil((window.innerHeight * 3) / (cardHeight + 16)));
    var visibleItems = items.slice(0, Math.min(items.length, columnCount * targetRows));
    var columns = Array.from({ length: columnCount }, function () { return []; });
    visibleItems.forEach(function (item, index) {
      columns[index % columns.length].push(renderReplicaCard(item));
    });
    return '<div class="replica-waterfall" data-columns="' + columnCount + '" style="--replica-columns:' + columnCount + '">' + columns.map(function (column) {
      return '<div class="replica-waterfall-column">' + column.join('') + '</div>';
    }).join('') + '</div>';
  }

  function formatMetric(value) {

    return String(value);

      });
    });
    var replicaSort = document.getElementById('replicaSort');
    var replicaSortToggle = document.getElementById('replicaSortToggle');
    if (replicaSort && replicaSortToggle) {
      function setReplicaSortOpen(open) {
        state.replicaSortOpen = open;
        replicaSort.classList.toggle('is-open', open);
        replicaSortToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
        syncPopupScrollLock();
      }
      replicaSortToggle.addEventListener('click', function () {
        setReplicaSortOpen(!state.replicaSortOpen);
      });
      replicaSort.querySelectorAll('[data-replica-sort-option]').forEach(function (button) {
        button.addEventListener('click', function () {
          state.replicaFilters.sort = this.dataset.replicaSortOption;
          state.replicaSortOpen = false;
          renderReplica();
        });
      });
      replicaSort.addEventListener('focusout', function () {
        setTimeout(function () {
          if (state.replicaSortOpen && !replicaSort.contains(document.activeElement)) {
            setReplicaSortOpen(false);
          }
        }, 0);
      });
      replicaSort.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && state.replicaSortOpen) {
          setReplicaSortOpen(false);
          replicaSortToggle.focus();
        }
      });
    }
    replicaHost.querySelectorAll('[data-replica]').forEach(function (button) {
      button.addEventListener('click', function () { openReplica(this.dataset.replica); });

      var number = index + 1;
      var className = number < active ? ' is-done' : number === active ? ' is-active' : '';
      return '<span class="qj-step' + className + '"><span class="qj-step-n">' + number + '</span>' + label + '</span>';
    }).join('');

  function replicaOriginalContent(item) {
    var body = (item.script || []).map(function (line) {

    });
    return [item.hook].concat(body).join('\n');

      if (/医疗|住院|医保/.test(source)) return '百万医疗险';

  function cloneReplicaStoryboard(rows) {
    return (rows || []).map(function (row) {
      return { time: row.time, structure: row.structure, frame: row.frame, spoken: row.spoken };
    });
  }

  function buildReplicaReviewStoryboard(item, form, variantIndex) {
    var rows = cloneReplicaStoryboard(templateStoryboardFor(item, form.productType));
    var version = Number(variantIndex || 0) % 3;
    var spokenLeads = version === 1
      ? ['先说结论：', '放到真实家庭里看，', '判断时别只看表面，', '你可以先做一件事：']
      : version === 2
        ? ['你可能也听过这样的说法：', '真正需要留意的是，', '把这笔账拆开看，', '最后给你一个简单建议：']
        : ['', '', '', ''];
    return rows.map(function (row, index) {
      var frameLead = index === 0
        ? form.scene + '，以' + form.style + '的语气开场；'
        : version === 1
          ? '延续' + form.scene + '的真实感，'
          : version === 2
            ? '用更贴近' + form.character + '的表达，'
            : '';
      var spoken = spokenLeads[index] + row.spoken;
      if (form.contentMode === 'rewrite' && index === rows.length - 1 && form.specialRequirements.trim()) {
        spoken += ' 同时会结合你的补充要求，给出更贴合账号的判断。';
      }
      return {
        time: row.time,
        structure: row.structure,
        frame: frameLead + row.frame,
        spoken: spoken
      };
    });
  }

  var replicaVoicePreviewAudio = null;

  function stopReplicaVoicePreview() {
    if (replicaVoicePreviewAudio) {
      replicaVoicePreviewAudio.pause();
      replicaVoicePreviewAudio.currentTime = 0;
      replicaVoicePreviewAudio = null;
    }
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    if (replicaVoicePreviewTarget) replicaVoicePreviewTarget.classList.remove('is-playing');
    replicaVoicePreviewTarget = null;
  }

  function resetReplicaImagePreviewEdit() {
    if (!state.replicaForm) return;
    state.replicaForm.previewEditOpen = false;
    state.replicaForm.previewEditPrompt = '';
    state.replicaForm.previewEditError = '';
    state.replicaForm.previewVersion = 0;
    state.replicaForm.previewGenerating = false;
  }

  function startReplicaVoicePreview(target) {
    stopReplicaVoicePreview();
    if (!state.replicaForm) return;
    replicaVoicePreviewTarget = target;
    target.classList.add('is-playing');
    if (state.replicaForm.voiceUrl) {
      replicaVoicePreviewAudio = new Audio(state.replicaForm.voiceUrl);
      replicaVoicePreviewAudio.loop = true;
      replicaVoicePreviewAudio.volume = .85;
      replicaVoicePreviewAudio.play().catch(function () {
        replicaVoicePreviewAudio = null;
        if ('speechSynthesis' in window) {
          var fallbackUtterance = new SpeechSynthesisUtterance('已选择上传音频，当前浏览器正在进行音色试听。');
          fallbackUtterance.lang = 'zh-CN';
          window.speechSynthesis.speak(fallbackUtterance);
        }
      });
      return;
    }
    if ('speechSynthesis' in window) {
      var utterance = new SpeechSynthesisUtterance('这是一段当前音色的试听内容，保障规划要从真实需求出发。');
      utterance.lang = 'zh-CN';
      utterance.rate = 1.02;
      utterance.pitch = state.replicaForm.voice.indexOf('男') >= 0 ? .86 : 1.08;
      window.speechSynthesis.speak(utterance);
    }
  }

  function bindReplicaForm() {
    var character = document.getElementById('replicaCharacter');
    var style = document.getElementById('replicaStyle');
    var scene = document.getElementById('replicaScene');
    var productType = document.getElementById('replicaProductType');
    var imageUpload = document.getElementById('replicaImageUpload');
    var voiceUpload = document.getElementById('replicaVoiceUpload');
    var voiceHoverPreview = document.querySelector('[data-replica-voice-hover]');
    var specialRequirements = document.getElementById('replicaSpecialRequirements');
    if (voiceHoverPreview) {
      voiceHoverPreview.addEventListener('mouseenter', function () { startReplicaVoicePreview(this); });
      voiceHoverPreview.addEventListener('mouseleave', stopReplicaVoicePreview);
      voiceHoverPreview.addEventListener('focus', function () { startReplicaVoicePreview(this); });
      voiceHoverPreview.addEventListener('blur', stopReplicaVoicePreview);
    }
    if (character) character.addEventListener('change', function () {
      state.replicaForm.character = this.value;
      this.classList.remove('input-error');
      this.setAttribute('aria-invalid', 'false');
    });
    if (style) style.addEventListener('change', function () { state.replicaForm.style = this.value; });
    if (scene) scene.addEventListener('change', function () {
      state.replicaForm.scene = this.value;
      resetReplicaImagePreviewEdit();
    });
    if (productType) productType.addEventListener('change', function () { state.replicaForm.productType = this.value; });
    document.querySelectorAll('input[name="replicaContentMode"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        if (!this.checked) return;
        state.replicaForm.contentMode = this.value;
        renderReplicaSheet();
      });
    });
    if (imageUpload) imageUpload.addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      if (state.replicaForm.imageUrl.indexOf('blob:') === 0) URL.revokeObjectURL(state.replicaForm.imageUrl);
      state.replicaForm.imageName = file.name;
      state.replicaForm.imageFile = file.name;
      state.replicaForm.imageUrl = URL.createObjectURL(file);
      state.replicaForm.assetPicker = '';
      resetReplicaImagePreviewEdit();
      qj.toast('已载入本地照片：' + file.name);
      renderReplicaSheet();
    });
    if (voiceUpload) voiceUpload.addEventListener('change', function () {
      var file = this.files && this.files[0];
      if (!file) return;
      stopReplicaVoicePreview();
      if (state.replicaForm.voiceUrl && state.replicaForm.voiceUrl.indexOf('blob:') === 0) URL.revokeObjectURL(state.replicaForm.voiceUrl);
      state.replicaForm.voiceFile = file.name;
      state.replicaForm.voiceUrl = URL.createObjectURL(file);
      state.replicaForm.assetPicker = '';
      qj.toast('已载入本地音频：' + file.name);
      renderReplicaSheet();
    });
    if (specialRequirements) specialRequirements.addEventListener('input', function () { state.replicaForm.specialRequirements = this.value; });
  }

    var model = document.getElementById('replicaModel');

    if (model) model.addEventListener('change', function () { state.replicaForm.model = this.value; });

        state.replicaForm.previewEditError = '';
        this.classList.remove('input-error');
        var error = document.getElementById('replicaReviewImageError');
        if (error) error.remove();
      });
      setTimeout(function () {
        imagePrompt.focus();
        imagePrompt.setSelectionRange(imagePrompt.value.length, imagePrompt.value.length);
      }, 0);
    }
    function bindReplicaPopover(rootId, toggleId, itemSelector, onSelect) {
      var root = document.getElementById(rootId);
      var toggle = document.getElementById(toggleId);
      if (!root || !toggle) return;
      toggle.addEventListener('click', function () {
        var open = !root.classList.contains('is-open');
        document.querySelectorAll('.replica-specs-switch.is-open,.replica-quantity-switch.is-open').forEach(function (popover) {
          popover.classList.remove('is-open');
          var popoverToggle = popover.querySelector('[aria-expanded]');
          if (popoverToggle) popoverToggle.setAttribute('aria-expanded', 'false');
        });
        root.classList.toggle('is-open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      root.querySelectorAll(itemSelector).forEach(function (button) {
        button.addEventListener('click', function () { onSelect(this); });
      });
      root.addEventListener('focusout', function () {
        setTimeout(function () {
          if (!root.contains(document.activeElement)) {
            root.classList.remove('is-open');
            toggle.setAttribute('aria-expanded', 'false');
          }
        }, 0);
      });
      root.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        root.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      });
    }
    bindReplicaPopover('replicaSpecsSwitch', 'replicaSpecsToggle', '[data-replica-resolution],[data-replica-ratio]', function (button) {
      if (button.dataset.replicaResolution) state.replicaForm.resolution = button.dataset.replicaResolution;
      if (button.dataset.replicaRatio) state.replicaForm.ratio = button.dataset.replicaRatio;
      renderReplicaSheet();
    });
    bindReplicaPopover('replicaQuantitySwitch', 'replicaQuantityToggle', '[data-replica-variants]', function (button) {
      state.replicaForm.variants = button.dataset.replicaVariants;
      renderReplicaSheet();
    });
    editors.forEach(function (editor) {
      var resize = function () {
        editor.style.height = 'auto';
        editor.style.height = editor.scrollHeight + 'px';
      };
      resize();
      editor.addEventListener('input', function () {
        var index = Number(this.dataset.reviewSpoken);
        state.replicaForm.reviewStoryboard[index].spoken = this.value;
        state.replicaForm.spoken = state.replicaForm.reviewStoryboard.map(function (row) { return row.spoken; }).join('\n');
        this.classList.remove('input-error');
        this.setAttribute('aria-invalid', 'false');
        var helper = document.getElementById('replicaReviewHelp');
        helper.textContent = '口播内容已更新。';
        resize();
      });
    });
  }

  function validateReplica() {
    var character = document.getElementById('replicaCharacter');
    if (character && !state.replicaForm.character.trim()) {
      character.classList.add('input-error');
      character.setAttribute('aria-invalid', 'true');
      qj.toast('请选择账号人设', 'err');
      character.focus();
      return false;
    }
    if (!state.replicaForm.voice.trim() && !state.replicaForm.voiceFile) {
      qj.toast('请选择音色或上传本地音频', 'err');
      return false;
    }
    return true;
  }

  function validateReplicaReview() {
    var rows = state.replicaForm.reviewStoryboard || [];
    var helper = document.getElementById('replicaReviewHelp');
    var invalidIndex = rows.findIndex(function (row) { return !row.spoken.trim(); });
    if (rows.length && invalidIndex < 0) {
      state.replicaForm.spoken = rows.map(function (row) { return row.spoken.trim(); }).join('\n');
      return true;
    }
    var review = document.querySelector('[data-review-spoken="' + Math.max(invalidIndex, 0) + '"]');
    if (review) {
      review.classList.add('input-error');
      review.setAttribute('aria-invalid', 'true');
      review.focus();
    }
    helper.textContent = rows.length ? '请补充空白的口播内容后再生成。' : '脚本生成失败，请返回上一步重试。';
    qj.toast(helper.textContent, 'err');
    return false;
  }

  function showSheet(title, html, sheetClass, subtitle) {
    if (overlay.hidden) state.lastFocus = document.activeElement;
    var sheet = overlay.querySelector('.qj-sheet');
    sheet.className = 'qj-sheet' + (sheetClass ? ' ' + sheetClass : '');
    overlay.classList.toggle('is-centered', sheetClass === 'replica-success-sheet');
    sheetTitle.textContent = title;
    sheetSubtitle.textContent = subtitle || '';
    sheetSubtitle.hidden = !subtitle;
    sheetBody.innerHTML = html;
    overlay.hidden = false;
    sheet.scrollTop = 0;
    syncPopupScrollLock();
    var close = overlay.querySelector('[data-sheet-action="close"]');
    if (close) close.focus();
  }

  function closeSheet() {
    if (overlay.hidden) return;
    stopReplicaVoicePreview();
    overlay.hidden = true;
    sheetBody.innerHTML = '';
    syncPopupScrollLock();
    if (state.lastFocus && typeof state.lastFocus.focus === 'function') state.lastFocus.focus();
    state.lastFocus = null;
  }

  function showTaskDetail(task, source) {
    if (!task) return;
    showSheet('任务详情',
      '<div class="qj-stack"><div class="qj-row-between"><span class="qj-badge qj-badge-ok">' + escapeHtml(task.status || '排队中') + '</span>' +
        '<span class="qj-meta">' + escapeHtml(task.id) + '</span></div>' +
        '<div class="confirm-list"><div class="confirm-row"><span>任务来源</span><span>' + escapeHtml(source) + '</span></div>' +
        '<div class="confirm-row"><span>品牌项目</span><span>' + escapeHtml(currentProject().name) + '</span></div>' +
        '<div class="confirm-row"><span>目标账号</span><span>' + escapeHtml(currentAccount().name) + '</span></div>' +
        '<div class="confirm-row"><span>创建时间</span><span>' + escapeHtml(task.createdAt || '2026-07-30 14:36') + '</span></div></div>' +
        '<p class="qj-copy">这是前端原型模拟任务，未调用真实 AI、平台或扣费服务。</p>' +
        '<div class="sheet-actions"><button class="qj-btn qj-btn-primary" type="button" data-sheet-action="close">完成</button></div></div>');
  }

  function showPointsSheet() {
    var tenantName = state.tenantMode === 'brand' ? '保险品牌' : 'AI 工作室-内部';
    var balance = state.demo === 'points' ? '2' : '778,163';
    var actions = '<button class="qj-btn qj-btn-primary" type="button" data-sheet-action="close">知道了</button>';
    showSheet('租户积分',
      '<div class="qj-stack"><span class="qj-badge qj-badge-gold">' + tenantName + '</span><div class="cost-copy"><span class="qj-meta">当前演示余额</span><b>' + balance + ' 积分</b></div>' +
      '<p class="qj-copy">积分归属租户，成员操作会记录实际操作者。</p>' +
      '<div class="sheet-actions">' + actions + '</div></div>');
  }

  function showTenantSheet() {
    var brandMode = state.tenantMode === 'brand';
    var rows = brandMode
      ? currentProject().accounts.map(function (account) {
          return '<div class="confirm-row"><span>' + escapeHtml(account.platformName) + '</span><span>' + escapeHtml(account.name) + '</span></div>';
        }).join('')
      : PROJECTS.map(function (project) {
          return '<div class="confirm-row"><span>' + escapeHtml(project.name) + '</span><span>' + project.accounts.length + ' 个账号</span></div>';
        }).join('');
    showSheet(brandMode ? '品牌租户' : '运营租户',
      '<div class="qj-stack"><div class="qj-row"><span class="qj-badge qj-badge-gold">' + (brandMode ? '品牌端' : '运营端') + '</span><h3 class="qj-section-title">' + (brandMode ? '保险品牌' : 'AI 工作室-内部') + '</h3></div>' +
      '<p class="qj-copy">' + (brandMode ? '品牌管理员可管理本品牌员工、代理商与多个社交账号。' : '当前租户服务 3 个品牌项目，项目名称即品牌名称。') + '</p>' +
      '<div class="confirm-list">' + rows + '</div><div class="sheet-actions"><button class="qj-btn qj-btn-primary" type="button" data-sheet-action="close">完成</button></div></div>');
  }

  function showQuotaSheet() {
    showSheet('生成额度',
      '<div class="qj-stack"><span class="qj-badge qj-badge-ok">额度无上限</span>' +
      '<h3 class="qj-section-title">当前租户未设置并发额度上限</h3>' +
      '<p class="qj-copy">任务仍会按照模型可用性进入队列；本期原型不接入真实计费与并发控制。</p>' +
      '<div class="confirm-list"><div class="confirm-row"><span>图片生成</span><span>可用</span></div>' +
      '<div class="confirm-row"><span>视频生成</span><span>可用</span></div><div class="confirm-row"><span>真人审核</span><span>按任务选择</span></div></div>' +
      '<div class="sheet-actions"><button class="qj-btn qj-btn-primary" type="button" data-sheet-action="close">知道了</button></div></div>');
  }

  function showUserSheet() {
    showSheet('账号与权限',
      '<div class="qj-stack"><div class="qj-row"><span class="qj-avatar"><img src="avatars/xiaocao.svg" alt=""></span>' +
      '<div><h3 class="qj-section-title">' + (state.tenantMode === 'brand' ? '陈澄' : '一琳') + '</h3><p class="qj-meta">' +
      (state.tenantMode === 'brand' ? '品牌管理员 · 保险品牌' : '运营管理员 · AI 工作室-内部') + '</p></div></div>' +
      '<div class="confirm-list"><div class="confirm-row"><span>账号绑定</span><span>一个账号绑定一个人设</span></div>' +
      '<div class="confirm-row"><span>积分归属</span><span>当前租户</span></div><div class="confirm-row"><span>审核权限</span><span>按任务选择</span></div></div>' +
      '<div class="sheet-actions"><button class="qj-btn qj-btn-primary" type="button" data-sheet-action="close">完成</button></div></div>');
  }

  overlay.addEventListener('click', function (event) {
    if (event.target === overlay) closeSheet();
    var action = event.target.closest('[data-sheet-action]');
    if (!action) return;
    var name = action.dataset.sheetAction;
    if (name === 'close') closeSheet();
    if (name === 'confirm-free') runFreeTask();
    if (name === 'skill-confirm' && validateSkill()) { state.skillStage = 'confirm'; renderSkillSheet(); }
    if (name === 'skill-back') { state.skillStage = 'config'; renderSkillSheet(); }
    if (name === 'skill-create' && state.demo !== 'points') {
      state.skillTask = { id: nextTaskId('SKL'), status: '排队中', createdAt: '2026-07-30 14:35' };
      var skillTaskId = state.skillTask.id;
      state.skillStage = 'creating';
      renderSkillSheet();
      setTimeout(function () {
        if (!state.skillTask || state.skillTask.id !== skillTaskId) return;
        state.skillStage = 'success';
        if (!overlay.hidden && sheetTitle.textContent === state.selectedSkill.name) renderSkillSheet();
        qj.toast('技能任务已创建');
      }, 880);
    }
    if (name === 'skill-view-task') showTaskDetail(state.skillTask, state.selectedSkill.name);
    if (name === 'replica-config') { state.replicaStage = 'config'; renderReplicaSheet(); }
    if (name === 'replica-back-detail') { state.replicaStage = 'detail'; renderReplicaSheet(); }
    if (name === 'replica-open-image-library') {
      qj.toast('形象素材库将通过统一弹框打开');
    }
    if (name === 'replica-open-voice-library') {
      qj.toast('音色素材库将通过统一弹框打开');
    }
    if (name === 'replica-close-library') {
      state.replicaForm.assetPicker = '';
      renderReplicaSheet();
    }
    if (name === 'replica-pick-image') {
      if (state.replicaForm.imageUrl.indexOf('blob:') === 0) URL.revokeObjectURL(state.replicaForm.imageUrl);
      state.replicaForm.imageName = action.dataset.assetName;
      state.replicaForm.imageUrl = action.dataset.assetUrl;
      state.replicaForm.imageFile = '';
      state.replicaForm.assetPicker = '';
      resetReplicaImagePreviewEdit();
      qj.toast('已选择形象：' + state.replicaForm.imageName);
      renderReplicaSheet();
    }
    if (name === 'replica-pick-voice') {
      stopReplicaVoicePreview();
      if (state.replicaForm.voiceUrl && state.replicaForm.voiceUrl.indexOf('blob:') === 0) URL.revokeObjectURL(state.replicaForm.voiceUrl);
      state.replicaForm.voice = action.dataset.assetName;
      state.replicaForm.voiceFile = '';
      state.replicaForm.voiceUrl = '';
      state.replicaForm.assetPicker = '';
      qj.toast('已选择音色：' + state.replicaForm.voice);
      renderReplicaSheet();
    }
    if (name === 'replica-remove-image') {
      if (state.replicaForm.imageUrl.indexOf('blob:') === 0) URL.revokeObjectURL(state.replicaForm.imageUrl);
      state.replicaForm.imageName = '模板默认形象';
      state.replicaForm.imageUrl = state.selectedReplica.cover || '手机端/covers/T05_cover_9_16.png';
      state.replicaForm.imageFile = '';
      resetReplicaImagePreviewEdit();
      qj.toast('已恢复模板默认形象');
      renderReplicaSheet();
    }
    if (name === 'replica-remove-voice') {
      stopReplicaVoicePreview();
      if (state.replicaForm.voiceUrl && state.replicaForm.voiceUrl.indexOf('blob:') === 0) URL.revokeObjectURL(state.replicaForm.voiceUrl);
      state.replicaForm.voiceFile = '';
      state.replicaForm.voiceUrl = '';
      state.replicaForm.voice = state.selectedReplica.voice;
      qj.toast('已删除上传音频，恢复模板音色');
      renderReplicaSheet();
    }
    if (name === 'replica-review' && validateReplica()) {
      state.replicaForm.spoken = replicaContentForMode(state.selectedReplica, state.replicaForm.contentMode, state.replicaForm.productType, state.replicaForm.specialRequirements);
      state.replicaForm.reviewVariantIndex = 0;
      state.replicaForm.reviewHistory = [];
      state.replicaForm.reviewStoryboard = buildReplicaReviewStoryboard(state.selectedReplica, state.replicaForm, 0);
      state.replicaStage = 'variants';
      renderReplicaSheet();
    }
    if (name === 'replica-image-edit-open') {
      state.replicaForm.previewEditOpen = true;
      state.replicaForm.previewEditError = '';
      renderReplicaSheet();
    }
    if (name === 'replica-image-edit-cancel' && !state.replicaForm.previewGenerating) {
      state.replicaForm.previewEditOpen = false;
      state.replicaForm.previewEditError = '';
      renderReplicaSheet();
    }
    if (name === 'replica-image-edit-generate' && !state.replicaForm.previewGenerating) {
      var previewPrompt = state.replicaForm.previewEditPrompt.trim();
      if (!previewPrompt) {
        state.replicaForm.previewEditError = '请输入图片修改要求';
        renderReplicaSheet();
      } else {
        state.replicaForm.previewGenerating = true;
        state.replicaForm.previewEditError = '';
        renderReplicaSheet();
        setTimeout(function () {
          if (!state.replicaForm || state.replicaStage !== 'variants' || !state.replicaForm.previewGenerating) return;
          state.replicaForm.previewGenerating = false;
          state.replicaForm.previewEditOpen = false;
          state.replicaForm.previewVersion += 1;
          renderReplicaSheet();
          qj.toast('口播画面已更新');
        }, 800);
      }
    }
    if (name === 'replica-image-edit-reset') {
      resetReplicaImagePreviewEdit();
      renderReplicaSheet();
      qj.toast('已恢复原始口播画面');
    }
    if (name === 'replica-review-refresh') {
      state.replicaForm.reviewHistory.push({
        variantIndex: state.replicaForm.reviewVariantIndex,
        rows: cloneReplicaStoryboard(state.replicaForm.reviewStoryboard)
      });
      if (state.replicaForm.reviewHistory.length > 8) state.replicaForm.reviewHistory.shift();
      state.replicaForm.reviewVariantIndex += 1;
      state.replicaForm.reviewStoryboard = buildReplicaReviewStoryboard(state.selectedReplica, state.replicaForm, state.replicaForm.reviewVariantIndex);
      state.replicaForm.spoken = state.replicaForm.reviewStoryboard.map(function (row) { return row.spoken; }).join('\n');
      renderReplicaSheet();
      qj.toast('已生成一版新脚本，可撤销返回上一版');
    }
    if (name === 'replica-review-undo' && state.replicaForm.reviewHistory.length) {
      var previousReview = state.replicaForm.reviewHistory.pop();
      state.replicaForm.reviewVariantIndex = previousReview.variantIndex;
      state.replicaForm.reviewStoryboard = cloneReplicaStoryboard(previousReview.rows);
      state.replicaForm.spoken = state.replicaForm.reviewStoryboard.map(function (row) { return row.spoken; }).join('\n');
      renderReplicaSheet();
      qj.toast('已恢复上一版脚本');
    }
    if (name === 'replica-back-config') { state.replicaStage = 'config'; renderReplicaSheet(); }
    if (name === 'replica-create' && state.demo !== 'points' && !state.replicaForm.previewGenerating && validateReplicaReview()) {
      state.replicaTask = { id: nextTaskId('RPL'), status: '排队中', createdAt: '2026-07-30 14:38' };
      state.replicaStage = 'success';
      renderReplicaSheet();
      qj.toast('生成任务已创建');
    }
    if (name === 'replica-view-task') window.location.href = '奇境-历史任务-v0.1.0.html?source=replica';
    if (name === 'show-points') showPointsSheet();
  });

  document.addEventListener('keydown', function (event) {
    if (overlay.hidden) return;
    if (event.key === 'Escape') {
      closeSheet();
      return;
    }
    if (event.key === 'Tab') {
      var focusable = Array.prototype.slice.call(overlay.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'));
      if (!focusable.length) return;
      var first = focusable[0];
      var last = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    }
  });

  document.getElementById('prototypeOptions').addEventListener('click', function (event) {
    var button = event.target.closest('[data-demo]');
    if (button) setDemo(button.dataset.demo);
  });

  document.getElementById('tenantOptions').addEventListener('click', function (event) {
    var button = event.target.closest('[data-tenant]');
    if (button) setTenantMode(button.dataset.tenant);
  });

  window.addEventListener('hashchange', function () {
    var view = location.hash.slice(1);
    if (['free', 'skills', 'replica'].includes(view)) setView(view, false);
  });

  document.addEventListener('DOMContentLoaded', function () {
    var team = document.querySelector('.team');
    var credits = document.querySelector('.credits');
    var quota = document.querySelector('.quota');
    var me = document.querySelector('.me');
    if (team) {
      team.setAttribute('aria-label', '在新窗口查看历史任务');
      team.addEventListener('click', function () {
        window.open('奇境-历史任务-v0.1.0.html', '_blank', 'noopener');
      });
    }
    if (credits) {
      credits.setAttribute('aria-label', '查看租户积分');
      credits.addEventListener('click', showPointsSheet);
    }
    if (quota) {
      quota.setAttribute('aria-label', '查看生成额度');
      quota.addEventListener('click', showQuotaSheet);
    }
    if (me) {
      me.setAttribute('aria-label', '查看账号与权限');
      me.addEventListener('click', showUserSheet);
    }
    applyTenantChrome();
  });

  var initialView = location.hash.slice(1);
  renderAllSections();
  if ('ResizeObserver' in window) {
    new ResizeObserver(function () {
      var flow = replicaHost.querySelector('.replica-waterfall');
      if (!flow || !['normal', 'points'].includes(state.demo)) return;
      var itemCount = replicaHost.querySelectorAll('.replica-card').length;
      var expected = Math.max(1, Math.min(itemCount, Math.floor(((replicaHost.clientWidth || window.innerWidth) + 16) / 296)));
      if (Number(flow.dataset.columns) !== expected) renderReplica();
    }).observe(replicaHost);
  }
  if (['free', 'skills', 'replica'].includes(initialView)) {
    state.view = initialView;
    setTimeout(function () { setView(initialView, false); }, 0);
  }
})();
</script>
