    state.detailTaskId = '';
    taskDetailOverlay.hidden = true;
    taskDetailContent.innerHTML = '';
    syncPopupLock();
    var target = detailReturnFocus;
    detailReturnFocus = null;
    if (restoreFocus !== false && target && document.contains(target)) setTimeout(function () { target.focus(); }, 0);
  }
  function fallbackCopy(value) {
    var field = document.createElement('textarea');
    field.value = value;
    field.setAttribute('readonly', '');
    field.style.position = 'fixed';
    field.style.opacity = '0';
    document.body.appendChild(field);
    field.select();
    document.execCommand('copy');
    field.remove();
  }
  function copyText(value) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(value).catch(function () { fallbackCopy(value); });
    fallbackCopy(value);
    return Promise.resolve();
  }
  function renderTasks() {
    var query = filters.search.value.trim().toLowerCase();
    var visible = tasks.filter(function (task) { return (!query || (task.prompt + task.id + task.model).toLowerCase().includes(query)) && (!state.project || task.project === state.project) && (!filters.source.value || task.source === filters.source.value) && (!filters.type.value || task.type === filters.type.value) && (!filters.status.value || task.status === filters.status.value) && (!filters.member.value || task.member === filters.member.value) && (!dateRange.start || !dateRange.end || dateInRange(task)); });
    taskList.innerHTML = visible.length ? visible.map(renderTask).join('') : '<section class="qj-card task-empty"><div><h2>没有匹配的历史任务</h2><p>请调整关键词或筛选条件后重试。</p></div></section>';
    bindTaskActions();
  }
  function selectSourceTab(value, syncUrl) {
    var selectedValue = value === '爆款复刻' ? '爆款复刻' : '自由创作';
    filters.source.value = selectedValue;
    sourceTabs.forEach(function (item) {
      var isActive = item.dataset.sourceValue === selectedValue;
      item.classList.toggle('is-active', isActive);
      item.setAttribute('aria-pressed', String(isActive));
    });
    if (syncUrl && window.history && window.history.replaceState) {
      var url = new URL(window.location.href);
      if (selectedValue === '爆款复刻') url.searchParams.set('source', 'replica');
      else url.searchParams.delete('source');
      window.history.replaceState(null, '', url.href);
    }
  }
  function notify(message, type) { if (window.qj && qj.toast) qj.toast(message, type); else window.alert(message); }
  function bindTaskActions() {
    taskList.querySelectorAll('[data-detail-task]').forEach(function (button) { button.addEventListener('click', function (event) { event.stopPropagation(); openTaskDetail(this.dataset.detailTask, this.dataset.detailIndex, this); }); });
    taskList.querySelectorAll('[data-cancel-output]').forEach(function (button) { button.addEventListener('click', function (event) { event.stopPropagation(); var task = tasks.find(function (item) { return item.id === button.dataset.cancelOutput; }); var outputIndex = Number(button.dataset.outputIndex); if (!task || !task.outputStates || !task.outputStates[outputIndex]) return; var slot = task.outputStates[outputIndex]; if (slot.status !== 'generating' && slot.status !== 'queued') return; slot.status = 'cancelled'; slot.progress = 0; renderTasks(); notify('已取消第 ' + (outputIndex + 1) + ' 个生成任务'); }); });
    taskList.querySelectorAll('[data-download]').forEach(function (button) { button.addEventListener('click', function (event) { event.stopPropagation(); notify('已开始下载结果（原型演示）'); }); });
    taskList.querySelectorAll('[data-delete]').forEach(function (button) { button.addEventListener('click', function (event) { event.stopPropagation(); var id = this.dataset.delete; var index = tasks.findIndex(function (task) { return task.id === id; }); if (index >= 0) { tasks.splice(index, 1); renderTasks(); notify('任务已删除'); } }); });
    taskList.querySelectorAll('[data-reference]').forEach(function (button) { button.addEventListener('click', function (event) { event.stopPropagation(); var task = tasks.find(function (item) { return item.id === button.dataset.reference; }); if (task) notify('第 ' + (Number(button.dataset.referenceIndex || 0) + 1) + ' 个结果已设为' + taskReferenceSuccessLabel(task)); }); });
    taskList.querySelectorAll('[data-review]').forEach(function (button) { button.addEventListener('click', function () { notify('已创建审核草稿'); }); });
    taskList.querySelectorAll('[data-edit]').forEach(function (button) { button.addEventListener('click', function () { notify('已带入原配置，可继续编辑'); }); });
    taskList.querySelectorAll('[data-copy]').forEach(function (button) { button.addEventListener('click', function () { var task = tasks.find(function (item) { return item.id === button.dataset.copy; }); if (task) copyText(task.prompt).then(function () { notify('提示词已复制'); }); }); });
  }
  taskDetailClose.addEventListener('click', function () { closeTaskDetail(); });
  taskDetailOverlay.addEventListener('click', function (event) { if (event.target === taskDetailOverlay) closeTaskDetail(); });
  taskDetailContent.addEventListener('click', function (event) {
    var outputButton = event.target.closest('[data-detail-output]');
    if (outputButton) { state.detailOutputIndex = Number(outputButton.dataset.detailOutput); renderTaskDetail(); return; }
    var actionButton = event.target.closest('[data-detail-action]');
    if (!actionButton) return;
    var task = tasks.find(function (item) { return item.id === state.detailTaskId; });
    if (!task) return;
    var action = actionButton.dataset.detailAction;
    if (action === 'download') { notify('已开始下载第 ' + (state.detailOutputIndex + 1) + ' 个' + (task.kind === 'video' ? '视频' : (task.kind === 'audio' ? '音频' : '图片')) + '结果（原型演示）'); return; }
    if (action === 'reference') { notify('第 ' + (state.detailOutputIndex + 1) + ' 个结果已设为' + taskReferenceSuccessLabel(task)); return; }
    if (action === 'copy') { copyText(task.prompt).then(function () { notify('提示词已复制'); }); return; }
    if (action === 'edit') { notify('已带入原配置，可继续编辑'); return; }
    if (action === 'cancel-output') { var slot = task.outputStates && task.outputStates[state.detailOutputIndex]; if (!slot || (slot.status !== 'generating' && slot.status !== 'queued')) return; slot.status = 'cancelled'; slot.progress = 0; renderTasks(); renderTaskDetail(); notify('已取消第 ' + (state.detailOutputIndex + 1) + ' 个生成任务'); return; }
    if (action === 'delete') {
      if (actionButton.dataset.confirming !== 'true') {
        actionButton.dataset.confirming = 'true';
        actionButton.classList.add('is-confirming');
        actionButton.dataset.tooltip = '再次点击确认删除';
        actionButton.setAttribute('aria-label', '再次点击确认删除任务');
        var hint = taskDetailContent.querySelector('[data-detail-delete-hint]');
        if (hint) hint.hidden = false;
        clearTimeout(detailDeleteTimer);
        detailDeleteTimer = setTimeout(function () { if (state.detailOpen) renderTaskDetail(); }, 5000);
        return;
      }
      var taskIndex = tasks.findIndex(function (item) { return item.id === task.id; });
      if (taskIndex >= 0) tasks.splice(taskIndex, 1);
      closeTaskDetail(false);
      renderTasks();
      var nextResult = taskList.querySelector('[data-detail-task]');
      if (nextResult) nextResult.focus(); else filters.search.focus();
      notify('创作任务已删除');
    }
  });
  document.addEventListener('keydown', function (event) {
    if (!state.detailOpen) return;
    if (event.key === 'Escape') { event.preventDefault(); closeTaskDetail(); return; }
    if (event.key !== 'Tab') return;
    var focusable = Array.from(taskDetailOverlay.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')).filter(function (item) { return !item.hidden && item.offsetParent !== null; });
    if (!focusable.length) return;
    var first = focusable[0];
    var last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  });
  projectToggle.addEventListener('click', function () { state.projectPanelOpen = !state.projectPanelOpen; updateProjectPanel(); if (state.projectPanelOpen) { renderProjectPicker(); projectSearch.focus(); } });
  projectSearch.addEventListener('input', function () { state.query = this.value; renderProjectPicker(); });
  projectFilter.addEventListener('focusout', function () { setTimeout(function () { if (!projectFilter.contains(document.activeElement)) { state.projectPanelOpen = false; updateProjectPanel(); } }, 0); });
  projectFilter.addEventListener('keydown', function (event) { if (event.key === 'Escape') { state.projectPanelOpen = false; updateProjectPanel(); projectToggle.focus(); } });
  dateRangeToggle.addEventListener('click', function () { dateRange.isOpen = !dateRange.isOpen; updateDatePanel(); if (dateRange.isOpen) renderDatePicker(); });
  document.querySelectorAll('[data-date-shift]').forEach(function (button) { button.addEventListener('click', function () { dateRange.view = new Date(dateRange.view.getFullYear(), dateRange.view.getMonth() + Number(this.dataset.dateShift), 1); renderDatePicker(); }); });
  dateMonths.addEventListener('click', function (event) { var button = event.target.closest('[data-date-day]'); if (button) selectDate(button.dataset.dateDay); });
  document.querySelectorAll('[data-date-shortcut]').forEach(function (button) { button.addEventListener('click', function () { selectShortcut(Number(this.dataset.dateShortcut)); }); });
  document.getElementById('dateRangeClear').addEventListener('click', function () { dateRange.start = ''; dateRange.end = ''; dateRange.shortcut = ''; renderDatePicker(); renderTasks(); });
  document.getElementById('dateRangeConfirm').addEventListener('click', function () { dateRange.isOpen = false; updateDatePanel(); });
  dateRangeFilter.addEventListener('focusout', function () { setTimeout(function () { if (!dateRangeFilter.contains(document.activeElement)) { dateRange.isOpen = false; updateDatePanel(); } }, 0); });
  dateRangeFilter.addEventListener('keydown', function (event) { if (event.key === 'Escape') { dateRange.isOpen = false; updateDatePanel(); dateRangeToggle.focus(); } });
  sourceTabs.forEach(function (tab) { tab.addEventListener('click', function () { selectSourceTab(this.dataset.sourceValue, true); renderTasks(); }); });
  Object.keys(filters).forEach(function (key) { filters[key].addEventListener(key === 'search' ? 'input' : 'change', renderTasks); });
  selectSourceTab(new URLSearchParams(window.location.search).get('source') === 'replica' ? '爆款复刻' : '自由创作', false);
  updateProjectLabel(); renderProjectPicker(); renderDatePicker(); renderTasks();
})();
</script>
