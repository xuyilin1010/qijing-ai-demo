<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇境AI · 小红书图文</title>
<link rel="stylesheet" href="奇境-字体.css">
<link rel="stylesheet" href="qj-shell.css">
<style>
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
.inner.xhs-page{width:100%;max-width:96rem;padding-inline:clamp(var(--space-3),4vw,var(--space-8));padding-bottom:var(--space-8)}
.xhs-page{display:grid;gap:var(--space-3)}
.xhs-pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap}
.xhs-heading{display:grid;gap:var(--space-1)}
.xhs-workspace{display:grid;grid-template-columns:minmax(17rem,19rem) minmax(0,1fr);gap:var(--space-3);align-items:start}
.workspace-main{min-width:0;align-self:stretch}
.task-sidebar{position:sticky;top:var(--space-2);display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:var(--space-2);max-height:calc(100vh - 8rem);padding:var(--space-2);overflow:hidden}
.task-sidebar-head{display:grid}
.task-sidebar-head .qj-btn{width:100%;justify-content:center}
.task-search{width:100%;box-shadow:none}
.task-list{min-height:0;display:grid;align-content:start;gap:var(--space-1);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding-right:calc(var(--space-1) / 2);scrollbar-width:thin}
.task-item{width:100%;min-width:0;display:grid;gap:var(--space-1);padding:var(--space-2);border:thin solid transparent;border-radius:var(--radius-md);background:transparent;color:var(--ink);text-align:left;cursor:pointer;transition:border-color .16s,background .16s}
.task-item:hover,.task-item:focus-visible{border-color:var(--line);background:var(--card-2);outline:none}
.task-item.is-active{border-color:var(--gold-line);background:var(--gold-soft)}
.task-item-top,.task-item-meta{display:flex;align-items:center;justify-content:space-between;gap:var(--space-1);min-width:0}
.task-item-top{align-items:flex-start}
.task-item-title{min-width:0;flex:1;display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:var(--type-body);font-weight:var(--weight-regular);line-height:1.5}
.task-item-meta{font-size:var(--type-meta);color:var(--ink3)}
.task-status{display:inline-flex;align-items:center;gap:calc(var(--space-1) / 2);flex:none;font-size:var(--type-meta);white-space:nowrap}
.task-status::before{content:"";width:calc(var(--space-1) * .75);height:calc(var(--space-1) * .75);border-radius:var(--radius-full);background:currentColor}
.task-status.is-ready,.task-status.is-published{color:var(--ok)}
.task-status.is-generating,.task-status.is-partial{color:var(--gold-deep)}
.task-status.is-failed{color:var(--err)}
.task-status.is-queued{color:var(--ink3)}
.task-progress{height:calc(var(--space-1) / 2);overflow:hidden;border-radius:var(--radius-full);background:var(--line)}
.task-progress span{display:block;height:100%;border-radius:inherit;background:var(--gold)}
.task-empty{padding:var(--space-3) var(--space-1);color:var(--ink4);font-size:var(--type-meta);line-height:1.6;text-align:center}
.stage-one{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--space-3);align-items:start}
.brief-panel{position:static;display:grid;grid-template-columns:minmax(16rem,.75fr) minmax(20rem,1.25fr);grid-template-areas:"title title" "product theme" "persona theme" "note action";gap:var(--space-2) var(--space-3);align-items:start}
.stage-one.is-pristine{height:100%}
.stage-one.is-pristine .brief-panel{min-height:0;height:100%;grid-template-rows:auto auto minmax(0,1fr) auto}
.stage-one.is-pristine .result-column{display:none}
.brief-head{grid-area:title;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.brief-summary{display:none;grid-area:summary;grid-template-columns:minmax(8rem,.6fr) minmax(0,1fr) minmax(0,1.25fr);gap:var(--space-2);min-width:0}
.brief-summary-item{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:baseline;gap:var(--space-1)}
.brief-summary-item b{color:var(--ink4);font-size:var(--type-meta);font-weight:var(--weight-semibold)}
.brief-summary-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2);font-size:var(--type-meta)}
.brief-panel.is-collapsed{position:static;z-index:auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"title" "summary";gap:var(--space-1);padding-block:var(--space-2)}
.brief-panel.is-collapsed>.qj-field,.brief-panel.is-collapsed>.search-button,.brief-panel.is-collapsed>.field-note{display:none}
.brief-panel.is-collapsed .brief-summary{display:grid}
.brief-panel label:nth-of-type(1){grid-area:product}
.brief-panel label:nth-of-type(2){grid-area:persona}
.brief-panel label:nth-of-type(3){grid-area:theme;grid-template-rows:auto minmax(calc(var(--space-8) * 2),1fr) auto;height:100%}
.brief-panel .qj-textarea{min-height:calc(var(--space-8) + var(--space-2));resize:vertical}
.brief-panel label:nth-of-type(3) .qj-textarea{min-height:0;height:100%}
.field-note{display:flex;align-items:center;justify-content:space-between;gap:var(--space-1);font-size:var(--type-meta);color:var(--ink4)}
.input-error{border-color:var(--err)!important}
.field-error{color:var(--err)}
.search-button{grid-area:action;width:max-content;justify-self:end;align-self:center;margin-top:var(--space-1)}
.brief-panel .field-note{grid-area:note;justify-content:flex-start;align-self:center;margin-top:var(--space-1)}
.result-column{min-width:0;display:grid;gap:var(--space-2)}
.result-heading{min-height:var(--space-6);display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.result-count{display:flex;align-items:center;gap:var(--space-1);color:var(--ink3);font-size:var(--type-meta)}
.result-count b{color:var(--gold-deep);font-family:var(--mono);font-weight:var(--weight-semibold)}
.result-state{min-height:calc(var(--space-8) * 3);display:grid;place-items:center}
.result-state .qj-empty{max-width:32rem}
.search-progress{width:100%;display:grid;gap:var(--space-2);padding:var(--space-2) var(--space-1)}
.search-progress-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2)}
.search-progress-head b{font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold)}
.search-progress-list{display:grid;gap:var(--space-1)}
.search-progress-row{display:flex;align-items:center;gap:var(--space-1);min-height:var(--space-3);color:var(--ink3);font-size:var(--type-meta)}
.search-progress-row .status-dot{width:var(--space-1);height:var(--space-1);border-radius:var(--radius-full);background:var(--line2);flex:none}
.search-progress-row.is-done{color:var(--ink2)}
.search-progress-row.is-done .status-dot{background:var(--ok)}
.search-progress-row.is-active{color:var(--gold-deep)}
.search-progress-row.is-active .status-dot{background:var(--gold);box-shadow:0 0 0 var(--space-1) var(--gold-soft)}
.progress-25{width:25%}.progress-50{width:50%}.progress-75{width:75%}.progress-100{width:100%}
.skeleton-line{height:var(--space-2);border-radius:var(--radius-full);background:linear-gradient(90deg,var(--card-2),var(--gold-soft),var(--card-2));background-size:200% 100%;animation:skeleton-shift 1.2s linear infinite}
.skeleton-line.is-short{width:42%}
.skeleton-block{height:calc(var(--space-8) * 2);border-radius:var(--radius-md);background:linear-gradient(90deg,var(--card-2),var(--gold-soft),var(--card-2));background-size:200% 100%;animation:skeleton-shift 1.2s linear infinite}
@keyframes skeleton-shift{from{background-position:200% 0}to{background-position:-200% 0}}
.retrieval-summary{display:grid;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:thin solid var(--gold-line);border-radius:var(--radius-md);background:var(--gold-soft)}
.retrieval-top{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.retrieval-copy{display:grid;gap:var(--space-1)}
.retrieval-copy b{font-size:var(--type-body);font-weight:var(--weight-semibold)}
.retrieval-copy span{font-size:var(--type-meta);color:var(--ink3);line-height:1.6}
.retrieval-keywords{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap}
.keyword-label{color:var(--ink3);font-size:var(--type-meta);font-weight:var(--weight-semibold)}
.retrieval-metric{display:inline-flex;align-items:center;min-height:var(--space-3);padding-inline:var(--space-1);border-left:thin solid var(--gold-line);color:var(--gold-deep);font-family:var(--mono);font-size:var(--type-meta);font-weight:var(--weight-semibold);white-space:nowrap}
.keyword-row{display:flex;gap:var(--space-1);flex-wrap:wrap}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:var(--space-2)}
.topic-card{position:relative;min-width:0;display:grid;gap:var(--space-1);padding:var(--space-2);border:thin solid var(--line);border-radius:var(--radius-md);background:var(--card);color:var(--ink);text-align:left;cursor:pointer;box-shadow:var(--shadow-1);transition:border-color .16s,background .16s,box-shadow .16s,transform .16s}
.topic-card:hover{border-color:var(--gold-line);transform:translateY(calc(var(--space-1) / -8))}
.topic-card:focus-visible{outline:none;border-color:var(--gold-line);box-shadow:var(--ring)}
.topic-card.is-selected{border-color:var(--gold);background:var(--gold-soft)}
.topic-card-index{font-family:var(--mono);font-size:var(--type-meta);color:var(--ink4)}
.topic-card h3{padding-right:var(--space-3);font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold);line-height:1.45}
.topic-card p{font-size:var(--type-meta);color:var(--ink3);line-height:1.65}
.topic-card-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-1);margin-top:var(--space-1);padding-top:var(--space-1);border-top:thin solid var(--line);font-size:var(--type-meta);color:var(--ink4)}
.topic-benchmark{flex:none}
.topic-check{position:absolute;right:var(--space-2);top:var(--space-2);display:grid;place-items:center;width:var(--space-3);height:var(--space-3);border:thin solid var(--line2);border-radius:var(--radius-full);background:var(--card);color:transparent}
.topic-card.is-selected .topic-check{border-color:var(--gold);background:var(--gold);color:var(--on-gold)}
.topic-check svg{width:var(--space-2);height:var(--space-2);fill:none;stroke:currentColor;stroke-width:2.5}
.result-column{padding-bottom:var(--space-4)}
.selection-bar{position:fixed;bottom:var(--space-2);z-index:12;display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);padding:var(--space-2);border:thin solid var(--gold-line);border-radius:var(--radius-md);background:color-mix(in srgb,var(--gold) 12%,var(--card));box-shadow:0 1px 0 var(--card) inset,var(--shadow-2);backdrop-filter:blur(var(--space-1))}
.selection-copy{display:grid;gap:calc(var(--space-1) / 4)}
.selection-copy b{font-size:var(--type-body);font-weight:var(--weight-semibold)}
.selection-copy span{font-size:var(--type-meta);color:var(--ink3)}
.stage-two{display:grid;gap:var(--space-2)}
.batch-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.batch-title{display:flex;align-items:baseline;gap:var(--space-1)}
.batch-title .qj-meta{color:var(--ink3)}
.batch-actions{display:flex;gap:var(--space-1);flex-wrap:wrap}
.batch-progress{display:grid;gap:var(--space-1);padding:var(--space-2);border:thin solid var(--gold-line);border-radius:var(--radius-md);background:var(--gold-soft)}
.batch-progress-copy{display:flex;justify-content:space-between;gap:var(--space-2);font-size:var(--type-meta);color:var(--ink3)}
.note-list{display:grid;gap:var(--space-3)}
.note-card{display:grid;gap:var(--space-2)}
.note-card-head{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap}
.note-card-head .spacer{flex:1}
.autosave{font-size:var(--type-meta);color:var(--ink4)}
.note-card-actions{display:flex;align-items:center;gap:var(--space-1)}
.note-workspace{display:grid;grid-template-columns:minmax(15rem,18rem) minmax(0,1fr);gap:var(--space-3);align-items:start}
.media-column{min-width:0;display:grid;gap:var(--space-1)}
.media-main{position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:var(--radius-md);background:var(--card-2)}
.media-main img{width:100%;height:100%;display:block;object-fit:cover}
.media-main::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(28,32,70,.72))}
.media-caption{position:absolute;z-index:1;left:var(--space-2);right:var(--space-2);bottom:var(--space-2);display:grid;gap:var(--space-1);color:var(--night-ink)}
.media-caption b{font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold);line-height:1.35}
.media-caption span{font-size:var(--type-meta);opacity:.86}
.media-edit{position:absolute;z-index:2;right:var(--space-1);top:var(--space-1);opacity:0;transition:opacity .16s}
.media-main:hover .media-edit,.media-main:focus-within .media-edit{opacity:1}
.media-thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-1)}
.media-thumb{position:relative;overflow:hidden;aspect-ratio:3/4;padding:0;border:thin solid transparent;border-radius:var(--radius-sm);background:var(--card-2);cursor:pointer}
.media-thumb img{width:100%;height:100%;display:block;object-fit:cover}
.media-thumb.is-active{border-color:var(--gold);box-shadow:var(--ring)}
.media-thumb:focus-visible{outline:none;box-shadow:var(--ring)}
.media-feedback{display:none;gap:var(--space-1);padding-top:var(--space-1)}
.media-feedback.is-open{display:grid}
.media-feedback .qj-textarea{min-height:var(--space-8)}
.mini-actions{display:flex;justify-content:flex-end;gap:var(--space-1)}
.copy-column{min-width:0;display:grid;gap:var(--space-2)}
.copy-field{display:grid;gap:var(--space-1)}
.copy-title{width:100%;padding:var(--space-1);border:thin solid transparent;border-radius:var(--radius-sm);background:transparent;color:var(--ink);font-family:var(--serif);font-size:var(--type-title);font-weight:var(--weight-semibold);line-height:1.35}
.copy-title:hover,.copy-body:hover{background:var(--card-2)}
.copy-title:focus{outline:none;border-color:var(--gold-line);background:var(--card);box-shadow:var(--ring)}
.copy-body{min-height:calc(var(--space-8) * 3);overflow-y:hidden;resize:none;line-height:1.85}
.copy-body[readonly]{border-color:transparent;background:transparent}
.copy-body:focus{border-color:var(--gold-line);background:var(--card);box-shadow:var(--ring)}
.tag-editor{display:flex;gap:var(--space-1);flex-wrap:wrap;align-items:center}
.tag-chip{border:0;color:var(--gold-deep);background:var(--gold-soft)}
.tag-remove{margin-left:var(--space-1);border:0;background:none;color:inherit;cursor:pointer;opacity:.65}
.tag-remove:hover{opacity:1}
.tag-add-row{display:none;align-items:center;gap:var(--space-1)}
.tag-add-row.is-open{display:flex}
.tag-add-row .qj-input{width:min(100%,16rem)}
.ai-rewrite-entry{display:flex;justify-content:flex-end;padding-top:var(--space-2);border-top:thin solid var(--line)}
.ai-feedback{display:none;grid-template-columns:minmax(0,1fr);gap:var(--space-1);padding-top:var(--space-2);border-top:thin solid var(--line)}
.ai-feedback.is-open{display:grid}
.ai-feedback .qj-textarea{min-height:var(--space-8)}
.failed-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--space-2);min-height:calc(var(--space-8) * 2)}
.failed-mark{display:grid;place-items:center;width:var(--space-5);height:var(--space-5);border-radius:var(--radius-full);background:var(--err-soft,var(--card-2));color:var(--err);font-size:var(--type-card-title)}
.failed-copy{display:grid;gap:var(--space-1)}
.failed-copy b{font-size:var(--type-body);font-weight:var(--weight-semibold)}
.failed-copy span{font-size:var(--type-meta);color:var(--ink3)}
.history-view{display:grid;gap:var(--space-2)}
.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
.history-heading{display:grid;gap:var(--space-1)}
.history-heading h2{font-family:var(--serif);font-size:var(--type-title);font-weight:var(--weight-semibold)}
.history-meta{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;color:var(--ink3);font-size:var(--type-meta)}
.history-context-item{display:flex;align-items:baseline;gap:var(--space-1);min-width:0;font-size:var(--type-meta)}
.history-context-item b{flex:none;color:var(--ink4);font-weight:var(--weight-semibold)}
.history-context-item span{color:var(--ink2);line-height:1.55}
.history-actions{display:flex;align-items:center;gap:var(--space-1)}
.history-progress{display:grid;gap:var(--space-1);padding:var(--space-2);border:thin solid var(--gold-line);border-radius:var(--radius-md);background:var(--gold-soft)}
.history-progress-copy{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);font-size:var(--type-meta);color:var(--ink3)}
.history-note-list{display:grid;gap:var(--space-3);padding-bottom:var(--space-4)}
.history-empty{min-height:calc(var(--space-8) * 4);display:grid;place-items:center}
.history-empty .qj-empty{max-width:28rem}
.xhs-overlay{z-index:140;padding:var(--space-2)}
.xhs-overlay .qj-sheet{max-height:calc(100vh - var(--space-4))}
.search-overlay{z-index:160}
.search-sheet{width:min(42rem,100%);align-self:center}
.search-sheet:focus{outline:none}
.confirm-sheet{width:min(30rem,100%);align-self:center}
.confirm-copy{display:grid;gap:var(--space-2)}
.confirm-copy p{color:var(--ink3);font-size:var(--type-body);line-height:1.65}
.confirm-subject{padding:var(--space-2);border:thin solid var(--line);border-radius:var(--radius-md);background:var(--card)}
.confirm-subject b{display:block;font-size:var(--type-body);font-weight:var(--weight-semibold)}
.confirm-subject span{display:block;margin-top:var(--space-1);color:var(--ink4);font-size:var(--type-meta)}
.confirm-actions{display:flex;justify-content:flex-end;gap:var(--space-1)}
.sheet-spacer{flex:1}
.skeleton-cover{height:auto;aspect-ratio:3/4}
.benchmark-overlay{justify-content:flex-end;padding:0}
.benchmark-sheet{width:min(32rem,100%);max-width:32rem;height:100dvh;max-height:none!important;border-radius:0}
.benchmark-topic{display:grid;gap:var(--space-1);padding-bottom:var(--space-2);border-bottom:thin solid var(--line)}
.benchmark-topic b{font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold);line-height:1.45}
.benchmark-topic span{font-size:var(--type-meta);color:var(--ink3);line-height:1.6}
.benchmark-list{display:grid;gap:var(--space-2);margin-top:var(--space-2)}
.benchmark-card{min-width:0;display:grid;grid-template-columns:calc(var(--space-8) + var(--space-6)) minmax(0,1fr);align-items:start;gap:var(--space-2);padding:var(--space-2);overflow:hidden;border:thin solid var(--line);border-radius:var(--radius-md);background:var(--card)}
.benchmark-card img{width:100%;height:auto;aspect-ratio:3/4;display:block;align-self:start;object-fit:cover;border-radius:var(--radius-sm);background:var(--card-2)}
.benchmark-body{min-width:0;display:grid;align-content:start;gap:var(--space-1)}
.benchmark-head{min-width:0;display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-1)}
.benchmark-byline{min-width:0;display:grid;justify-items:end;gap:calc(var(--space-1) / 2);color:var(--ink3);font-size:var(--type-meta);line-height:1.4}
.benchmark-byline span,.benchmark-byline time{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.benchmark-body h3{font-size:var(--type-body);font-weight:var(--weight-semibold);line-height:1.5}
.benchmark-body h3 a{color:inherit;text-decoration-line:underline;text-decoration-color:transparent;text-underline-offset:calc(var(--space-1) / 2);transition:color .18s ease,text-decoration-color .18s ease}
.benchmark-body h3 a:hover{color:var(--gold-deep);text-decoration-color:currentColor}
.benchmark-body h3 a:focus-visible{outline:none;border-radius:var(--radius-xs);box-shadow:var(--ring);color:var(--gold-deep);text-decoration-color:currentColor}
.benchmark-body p{font-size:var(--type-meta);line-height:1.6;color:var(--ink3)}
.benchmark-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-1);padding-top:var(--space-1);border-top:thin solid var(--line);font-family:var(--mono);font-size:var(--type-meta);color:var(--ink3)}

  function createNotes(){if(!state.selected.size)return;var brief=getBrief(),stamp=Date.now(),task=state.modifyingTaskId&&findTask(state.modifyingTaskId),isModify=Boolean(task);if(isModify&&state.batchTimers[task.id]){clearInterval(state.batchTimers[task.id]);delete state.batchTimers[task.id];}if(!task){task={id:'xhs-'+stamp,notes:[]};state.tasks.unshift(task);}task.title=brief.theme;task.product=brief.product;task.persona=brief.persona;task.created='刚刚';task.status='queued';task.progress=0;task.notes=Array.from(state.selected).sort(function(a,b){return a-b;}).map(function(i,n){var note=makeDraft(TOPICS[i],i);note.id=task.id+'-'+stamp+'-'+(n+1);note.taskId=task.id;note.status=n===0?'generating':'queued';return note;});state.modifyingTaskId=null;state.notes=task.notes;state.currentTaskId=task.id;state.activeTaskId=task.id;state.editingHistoryTaskId=null;document.getElementById('noteCount').textContent=state.notes.length+' 篇';setStage('2');renderNotes();renderTaskSidebar();runBatchProgress(task);toast(isModify?'任务已更新，正在重新生成内容':'任务已创建，正在生成内容');}
  function runBatchProgress(task){var box=document.getElementById('batchProgress'),progress=8;if(state.currentTaskId===task.id&&state.stage==='2'){box.hidden=false;}function syncProgress(){var current=state.currentTaskId===task.id&&state.stage==='2'&&!state.editingHistoryTaskId;if(current){box.hidden=false;document.getElementById('batchProgressFill').style.width=progress+'%';document.getElementById('batchProgressNumber').textContent=progress+'%';document.getElementById('batchProgressText').textContent=progress<45?'正在生成标题与正文…':progress<82?'正在生成多图与标签…':'正在整理笔记…';renderNotes();}renderTaskSidebar();if(state.stage==='history'&&state.activeTaskId===task.id)renderHistoryTask(task.id);}syncProgress();state.batchTimers[task.id]=setInterval(function(){progress=Math.min(100,progress+18);task.progress=progress;var activeCount=Math.max(1,Math.ceil(task.notes.length*progress/100));task.notes.forEach(function(note,i){if(i<activeCount&&note.status==='queued')note.status='generating';if(note.status==='generating')note.progress=progress;});task.status='generating';if(progress<100){syncProgress();return;}clearInterval(state.batchTimers[task.id]);delete state.batchTimers[task.id];task.notes.forEach(function(note,i){note.status=(state.demo==='error'&&i===task.notes.length-1)?'failed':'ready';note.progress=100;note.summary=note.status==='failed'?'图片生成超时，可重新生成。':'标题、正文、Tag 词与 4 张配图已生成。';});recalcTask(task);syncProgress();setTimeout(function(){if(state.currentTaskId===task.id&&state.stage==='2'&&!state.editingHistoryTaskId){box.hidden=true;renderNotes();}renderTaskSidebar();if(state.stage==='history'&&state.activeTaskId===task.id)renderHistoryTask(task.id);var failed=task.notes.filter(function(note){return note.status==='failed';}).length;toast(failed?'部分笔记生成失败，可单篇重试':'图文笔记已批量生成',failed?'err':undefined);},260);},280);}
  function renderNotes(){var list=document.getElementById('noteList');list.innerHTML='';document.getElementById('noteCount').textContent=(state.editingHistoryTaskId?'编辑 ':'')+state.notes.length+' 篇';if(!state.notes.length){list.innerHTML='<div class="qj-empty"><div class="qj-empty-title">没有可编辑的内容</div>这篇内容可能已被删除，请返回历史任务。</div>';return;}state.notes.forEach(function(note,index){if(note.status==='failed')list.appendChild(renderFailed(note,index));else if(note.status==='generating'||note.status==='queued')list.appendChild(renderSkeleton(note,index));else list.appendChild(renderReady(note,index));});}
  function renderSkeleton(note,index){var card=document.createElement('article'),queued=note.status==='queued';card.className='qj-card qj-card-section note-card';card.innerHTML='<div class="note-card-head"><span class="qj-badge '+(queued?'qj-badge-muted':'qj-badge-gold')+'">'+(queued?'排队中':'生成中 · '+(note.progress||0)+'%')+'</span><span class="qj-meta">#'+String(index+1).padStart(2,'0')+' '+esc(TOPICS[note.topicIndex].title)+'</span><span class="spacer"></span><button class="qj-btn qj-btn-ghost qj-btn-sm" type="button" data-note-delete>删除</button></div><div class="note-workspace"><div class="skeleton-block skeleton-cover"></div><div class="qj-stack"><div class="skeleton-line is-short"></div><div class="skeleton-line"></div><div class="skeleton-line"></div><div class="skeleton-block"></div></div></div>';card.querySelector('[data-note-delete]').addEventListener('click',function(){var task=taskForNote(note);openDelete({type:'note',taskId:task&&task.id,noteId:note.id},this);});return card;}
  function renderFailed(note,index){var card=document.createElement('article');card.className='qj-card qj-card-section failed-card';card.innerHTML='<span class="failed-mark">!</span><div class="failed-copy"><b>'+esc(TOPICS[note.topicIndex].title)+'</b><span>生成服务暂时没有返回结果，已保留内容方向。</span></div><div class="note-card-actions"><button class="qj-btn qj-btn-primary qj-btn-sm" type="button" data-note-retry>重新生成</button><button class="qj-btn qj-btn-ghost qj-btn-sm" type="button" data-note-delete>删除</button></div>';card.querySelector('[data-note-retry]').addEventListener('click',function(){var task=taskForNote(note);if(task){retryHistoryNote(task,note);}else{note.status='generating';renderNotes();setTimeout(function(){note.status='ready';renderNotes();toast('这篇笔记已重新生成');},720);}});card.querySelector('[data-note-delete]').addEventListener('click',function(){var task=taskForNote(note);openDelete({type:'note',taskId:task&&task.id,noteId:note.id},this);});return card;}
  function renderReady(note,index){var topic=TOPICS[note.topicIndex],card=document.createElement('article'),task=taskForNote(note);card.className='qj-card qj-card-section note-card';card.innerHTML='<div class="note-card-head"><span class="qj-badge qj-badge-ok">已生成</span><span class="qj-badge qj-badge-muted">'+esc(topic.type)+'</span><span class="qj-meta">4 张图 · 3:4</span><span class="spacer"></span><span class="autosave">手动修改自动保存</span><div class="note-card-actions"><button class="qj-btn qj-btn-ghost qj-btn-sm" type="button" data-note-delete>删除</button><button class="qj-btn qj-btn-primary qj-btn-sm" type="button" data-note-publish>去发布</button></div></div><div class="note-workspace"><div class="media-column"><div><div class="media-main" tabindex="-1"><img src="'+note.images[note.activeImage]+'" alt="第 '+(note.activeImage+1)+' 张配图"><button class="qj-btn qj-btn-secondary qj-btn-sm media-edit" type="button">修改这张图</button><div class="media-caption"><b>'+esc(note.activeImage===0?topic.title:note.shots[note.activeImage])+'</b><span>'+esc(note.shots[note.activeImage])+'</span></div></div><div class="media-thumbs">'+note.images.map(function(src,i){return '<button class="media-thumb'+(i===note.activeImage?' is-active':'')+'" type="button" data-image="'+i+'" aria-label="查看第 '+(i+1)+' 张图"><img src="'+src+'" alt=""></button>';}).join('')+'</div></div><div class="media-feedback"><label class="qj-field"><span class="qj-label">告诉 AI 这张图怎么改</span><textarea class="qj-textarea" placeholder="例：换成父子在车边自然聊天，减少广告感"></textarea></label><div class="mini-actions"><button class="qj-btn qj-btn-ghost qj-btn-sm" type="button" data-image-cancel>取消</button><button class="qj-btn qj-btn-primary qj-btn-sm" type="button" data-image-submit>AI 改图</button></div></div></div><div class="copy-column"><label class="copy-field"><span class="qj-label">标题</span><input class="copy-title" value="'+esc(note.title)+'" maxlength="40" readonly></label><label class="copy-field"><span class="qj-label">正文</span><textarea class="qj-textarea copy-body" readonly>'+esc(note.body)+'</textarea></label><div class="copy-field"><div class="tag-editor">'+renderTags(note)+'<button class="qj-btn qj-btn-secondary qj-btn-sm" type="button" data-add-tag>添加标签</button></div><div class="tag-add-row"><input class="qj-input" placeholder="输入标签，不含 #"><button class="qj-btn qj-btn-primary qj-btn-sm" type="button" data-tag-confirm>添加</button><button class="qj-btn qj-btn-ghost qj-btn-sm" type="button" data-tag-cancel>取消</button></div></div><div class="ai-rewrite-entry"><button class="qj-btn qj-btn-secondary qj-btn-sm" type="button" data-ai-open>AI 修改</button></div><div class="ai-feedback"><label class="qj-field"><span class="qj-label">对这篇笔记提意见</span><textarea class="qj-textarea" placeholder="例：太像广告了，保留父子细节，整体更像真人随手记录"></textarea></label><div class="mini-actions"><button class="qj-btn qj-btn-ghost qj-btn-sm" type="button" data-ai-cancel>取消</button><button class="qj-btn qj-btn-primary qj-btn-sm" type="button" data-ai-rewrite>AI 按意见修改</button></div></div></div></div>';bindNote(card,note,index);card.querySelector('[data-note-delete]').addEventListener('click',function(){openDelete({type:'note',taskId:task&&task.id,noteId:note.id},this);});card.querySelector('[data-note-publish]').addEventListener('click',function(){goPublish(task&&task.id||'',note.id,false);});return card;}
  function prepareHistoryCard(task,note,index){var card=renderReady(note,index);card.classList.add('history-note-card');if(note.status!=='published')return card;card.querySelector('.note-card-head .qj-badge-ok').textContent='已发布';card.querySelector('.autosave').textContent='已发布，可继续修改并自动保存';var publish=card.querySelector('[data-note-publish]'),viewButton=publish.cloneNode(true);viewButton.textContent='查看发布';publish.replaceWith(viewButton);viewButton.addEventListener('click',function(){goPublish(task.id,note.id,true);});return card;}
  function renderTags(note){return note.tags.map(function(tag,i){return '<span class="qj-chip tag-chip">#'+esc(tag)+'<button class="tag-remove" type="button" data-remove-tag="'+i+'" aria-label="删除标签 '+esc(tag)+'">×</button></span>';}).join('');}
  function bindInlineEdit(control){control.readOnly=true;control.addEventListener('mouseenter',function(){this.readOnly=false;});control.addEventListener('mouseleave',function(){if(document.activeElement!==this)this.readOnly=true;});control.addEventListener('focus',function(){this.readOnly=false;});control.addEventListener('blur',function(){this.readOnly=true;});}

  function bindNote(card,note,index){var title=card.querySelector('.copy-title'),body=card.querySelector('.copy-body');bindInlineEdit(title);bindInlineEdit(body);autoGrowTextArea(body);title.addEventListener('input',function(){note.title=this.value;note.summary='内容已手动修改并自动保存。';});body.addEventListener('input',function(){note.body=this.value;note.summary='内容已手动修改并自动保存。';autoGrowTextArea(this);});card.querySelectorAll('[data-image]').forEach(function(btn){btn.addEventListener('click',function(){note.activeImage=+this.dataset.image;replaceCard(card,note,index);});});var feedback=card.querySelector('.media-feedback'),feedbackText=feedback.querySelector('textarea');card.querySelector('.media-edit').addEventListener('click',function(){feedback.classList.add('is-open');feedbackText.focus();});card.querySelector('[data-image-cancel]').addEventListener('click',function(){feedback.classList.remove('is-open');});card.querySelector('[data-image-submit]').addEventListener('click',function(){var instruction=feedbackText.value.trim();if(!instruction){feedbackText.classList.add('input-error');feedbackText.focus();return;}this.disabled=true;this.textContent='修改中…';var btn=this;setTimeout(function(){note.images[note.activeImage]=note.images[(note.activeImage+1)%note.images.length];feedback.classList.remove('is-open');feedbackText.value='';btn.disabled=false;btn.textContent='AI 改图';note.summary='配图已按意见修改并自动保存。';replaceCard(card,note,index);toast('第 '+(note.activeImage+1)+' 张图已按意见修改');},680);});card.querySelectorAll('[data-remove-tag]').forEach(function(btn){btn.addEventListener('click',function(){note.tags.splice(+this.dataset.removeTag,1);replaceCard(card,note,index);});});var addRow=card.querySelector('.tag-add-row'),addInput=addRow.querySelector('input');card.querySelector('[data-add-tag]').addEventListener('click',function(){addRow.classList.add('is-open');addInput.focus();});card.querySelector('[data-tag-cancel]').addEventListener('click',function(){addRow.classList.remove('is-open');addInput.value='';});card.querySelector('[data-tag-confirm]').addEventListener('click',function(){var value=addInput.value.trim().replace(/^#/,'');if(!value){addInput.focus();return;}note.tags.push(value);replaceCard(card,note,index);});var aiFeedback=card.querySelector('.ai-feedback'),aiEntry=card.querySelector('.ai-rewrite-entry'),aiText=aiFeedback.querySelector('textarea'),aiButton=card.querySelector('[data-ai-rewrite]');card.querySelector('[data-ai-open]').addEventListener('click',function(){aiEntry.hidden=true;aiFeedback.classList.add('is-open');aiText.focus();});card.querySelector('[data-ai-cancel]').addEventListener('click',function(){aiFeedback.classList.remove('is-open');aiEntry.hidden=false;aiText.value='';aiText.classList.remove('input-error');card.querySelector('[data-ai-open]').focus();});aiText.addEventListener('input',function(){this.classList.remove('input-error');});aiButton.addEventListener('click',function(){var instruction=aiText.value.trim();if(!instruction){aiText.classList.add('input-error');aiText.focus();return;}aiButton.disabled=true;aiButton.textContent='修改中…';setTimeout(function(){note.title=note.title.replace(/｜.*/,'')+'｜陪家人选车后，我终于懂了';note.body=note.body.replace('我没有急着替他做决定','后来我干脆把参数表收了起来，没有急着替他做决定')+'\n\n这不是一篇标准答案，只是我们家这次真实的选车记录。';note.summary='AI 已按意见改写并自动保存。';aiText.value='';aiButton.disabled=false;aiButton.textContent='AI 按意见修改';replaceCard(card,note,index);toast('已按意见修改整篇笔记');},720);});}
  function replaceCard(oldCard,note,index){var task=taskForNote(note),next=state.stage==='history'&&task?prepareHistoryCard(task,note,index):renderReady(note,index);oldCard.replaceWith(next);}
  function openDelete(target,trigger){var task=findTask(target.taskId),note=task&&task.notes.find(function(item){return item.id===target.noteId;});state.deleteTarget=target;state.deleteTrigger=trigger;document.getElementById('deleteSubject').textContent=target.type==='task'?(task&&task.title||'该任务'):(note&&note.title||'该篇内容');document.getElementById('deleteMessage').textContent=target.type==='task'?'确认删除整个历史任务？':'确认删除这篇图文内容？';document.getElementById('deleteImpact').textContent=target.type==='task'?'任务内 '+(task?task.notes.length:0)+' 篇内容也会一并删除，且无法恢复。':'标题、正文、Tag 词与全部配图将被删除，且无法恢复。';var overlay=document.getElementById('deleteOverlay');overlay.hidden=false;overlay.querySelector('[data-delete-cancel]').focus();}
  function closeDelete(){document.getElementById('deleteOverlay').hidden=true;state.deleteTarget=null;if(state.deleteTrigger&&document.body.contains(state.deleteTrigger))state.deleteTrigger.focus();state.deleteTrigger=null;}
  function confirmDelete(){var target=state.deleteTarget;if(!target)return;var task=findTask(target.taskId);if(target.type==='task'){if(state.batchTimers[target.taskId]){clearInterval(state.batchTimers[target.taskId]);delete state.batchTimers[target.taskId];}state.tasks=state.tasks.filter(function(item){return item.id!==target.taskId;});var wasCurrent=state.currentTaskId===target.taskId,wasActive=state.activeTaskId===target.taskId;state.activeTaskId=null;if(wasCurrent){state.currentTaskId=null;state.editingHistoryTaskId=null;state.notes=[];}closeDelete();renderTaskSidebar();if(wasCurrent&&state.stage==='2'){startNewTask();}else if(wasActive&&state.stage==='history'){var next=state.tasks.find(taskMatchesSearch);if(next)openHistoryTask(next.id);else startNewTask();}toast('历史任务已删除');return;}if(task){task.notes=task.notes.filter(function(note){return note.id!==target.noteId;});recalcTask(task);}state.notes=state.notes.filter(function(note){return note.id!==target.noteId;});closeDelete();renderTaskSidebar();if(state.stage==='history'&&task)renderHistoryTask(task.id);if(state.stage==='2')renderNotes();toast('图文内容已删除');}
  function startNewTask(){state.activeTaskId=null;state.currentTaskId=null;state.editingHistoryTaskId=null;state.modifyingTaskId=null;state.selected.clear();state.notes=[];state.generated=false;state.taskSearch='';state.lastBrief=null;document.getElementById('taskSearch').value='';selectionBar.hidden=true;searchOverlay.hidden=true;briefPanel.classList.remove('is-collapsed');briefSummary.hidden=true;briefToggle.hidden=true;briefToggle.textContent='修改需求';briefToggle.setAttribute('aria-expanded','false');document.querySelector('.stage-one').classList.add('is-pristine');resultHost.className='result-state';resultHost.innerHTML='';document.getElementById('resultCount').innerHTML='';searchButton.disabled=false;searchButton.textContent='生成 10 个选题';setStage('1');renderTaskSidebar();document.getElementById('productInput').focus();}
  searchButton.addEventListener('click',runSearch);briefToggle.addEventListener('click',function(){if(briefPanel.classList.contains('is-collapsed'))expandBrief();else cancelBriefEdit();});document.getElementById('createNotes').addEventListener('click',createNotes);document.getElementById('backToTopics').addEventListener('click',function(){if(state.editingHistoryTaskId){openHistoryTask(state.editingHistoryTaskId);}else{setStage('1');}});document.getElementById('newTask').addEventListener('click',startNewTask);document.getElementById('taskSearch').addEventListener('input',function(){state.taskSearch=this.value;renderTaskSidebar();});window.addEventListener('resize',positionSelectionBar);document.querySelector('.page').addEventListener('scroll',positionSelectionBar,{passive:true});document.querySelectorAll('[data-delete-cancel]').forEach(function(btn){btn.addEventListener('click',closeDelete);});document.getElementById('confirmDelete').addEventListener('click',confirmDelete);document.getElementById('deleteOverlay').addEventListener('click',function(e){if(e.target===this)closeDelete();});document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!document.getElementById('deleteOverlay').hidden)closeDelete();});
  renderTaskSidebar();setStage('1');
