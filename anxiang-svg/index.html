<script>
const cover=document.getElementById('cover'),rest=document.getElementById('rest'),badge=document.getElementById('badge');let opened=false;
function openStory(){if(opened)return;opened=true;cover.classList.add('opened');badge.classList.add('show');[...rest.querySelectorAll('.page')].forEach((page,index)=>setTimeout(()=>page.classList.add('unfolded'),140+index*360));}
cover.addEventListener('click',openStory,{passive:true});cover.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openStory()}});cover.tabIndex=0;
const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.played){e.target.dataset.played='1';e.target.classList.add('played');io.unobserve(e.target)}}),{threshold:0,rootMargin:'-45% 0px -35% 0px'});document.querySelectorAll('.observe').forEach(el=>io.observe(el));
