<script>
const cover=document.getElementById('cover'),rest=document.getElementById('rest'),badge=document.getElementById('badge');let opened=false;
function openStory(){if(opened)return;opened=true;cover.classList.add('opened');rest.style.height=rest.scrollHeight+'px';badge.classList.add('show');rest.addEventListener('transitionend',()=>{rest.style.height='auto';rest.classList.add('opened')},{once:true});}

const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting&&!e.target.dataset.played){e.target.dataset.played='1';e.target.classList.add('played');io.unobserve(e.target)}}),{threshold:.28,rootMargin:'0px 0px -8% 0px'});document.querySelectorAll('.observe').forEach(el=>io.observe(el));
