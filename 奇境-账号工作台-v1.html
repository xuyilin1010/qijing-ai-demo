<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇境.ai · 账号工作台</title>
<!-- 账号工作台 · 奇境皮 · 套 qj-shell · 号→定位/受众→内容板块→每板块对标(一一对应,可改)
     只管配置,不出选题；选题在 奇境-选题-v1.html 出 -->
<link rel="stylesheet" href="奇境-字体.css">
<link rel="stylesheet" href="qj-shell.css">
<style>
  .zone-h{display:flex;align-items:baseline;gap:14px;margin-bottom:6px}
  .zone-h h3{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .zone-h h3 .spark{width:14px;height:14px;fill:var(--gold);flex:none;transform:translateY(1px)}
  .zone-h .rule{flex:1;height:1px;background:var(--line)}
  .zone-h .more{font-size:12.5px;color:var(--ink3);font-weight:500} .zone-h .more:hover{color:var(--gold-deep)}
  .cap-sub{font-size:12px;color:var(--ink3);margin-bottom:18px;line-height:1.5} .cap-sub b{color:var(--gold-deep)}

  .acctbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
  .atab{display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:all .12s}
  .atab:hover{border-color:var(--line2)}
  .atab.on{border-color:transparent;box-shadow:var(--shadow-2)}
  .atab.on.t-mc{background:var(--navy)} .atab.on.t-xy{background:#6d4f76} .atab.on.t-car{background:#2a6e6b}
  .atab .av{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:12px;color:#fff;flex:none}
  .atab.t-mc .av{background:var(--navy)} .atab.t-xy .av{background:#6d4f76} .atab.t-car .av{background:#2a6e6b}
  .atab.on .av{background:rgba(255,255,255,.22)}
  .atab .nm{font-family:var(--serif);font-weight:600;font-size:13.5px;color:var(--ink)}
  .atab .ro{font-size:10.5px;color:var(--ink3)}
  .atab.on .nm,.atab.on .ro{color:var(--night-ink)} .atab.on .ro{opacity:.85}
  .atab-add{border-style:dashed;color:var(--ink3)} .atab-add:hover{color:var(--gold-deep);border-color:var(--gold-line)}

  .acct-head{margin:18px 0 6px;padding:16px 20px;border-radius:16px;background:linear-gradient(135deg,var(--card),#fdf6ea);border:1px solid var(--line);box-shadow:var(--shadow-1);border-left:4px solid var(--gold)}
  .acct-head.h-mc{border-left-color:var(--navy)} .acct-head.h-xy{border-left-color:#6d4f76} .acct-head.h-car{border-left-color:#2a6e6b}
  .acct-head .nm{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink)}
  .acct-head .nm .pr{font-family:var(--mono);font-size:11px;color:var(--ink3);font-weight:400;margin-left:8px}
  .acct-head .nm .mng-this{float:right;font-size:11px;font-weight:600;color:var(--ink3);background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:4px 11px;cursor:pointer}
  .acct-head .nm .mng-this:hover{color:var(--gold-deep);border-color:var(--gold-line)}
  .acct-head .row{display:flex;gap:8px;margin-top:8px;font-size:12.5px;line-height:1.6}
  .acct-head .row .k{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;padding:2px 7px;border-radius:5px;flex:none;height:fit-content;margin-top:1px;letter-spacing:.3px}
  .acct-head .row .k.pos{background:var(--navy)} .acct-head .row .k.aud{background:var(--gold)}
  .acct-head .row .v{color:var(--ink)} .acct-head .row .v b{color:var(--gold-deep)}
  .acct-head .row .ed{margin-left:8px;font-size:10px;font-weight:600;color:var(--gold-deep);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:6px;padding:1px 8px;cursor:pointer;white-space:nowrap;height:fit-content}
  .acct-head .row .ed:hover{background:var(--gold);color:#fff}

  .pillars-h{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--ink2);letter-spacing:.5px;text-transform:uppercase;margin:22px 2px 4px}
  .pillars-h b{color:var(--gold-deep)}
  .pillars-h .link-note{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--ink3);text-transform:none;letter-spacing:0;margin-top:5px;line-height:1.55}
  .pillars-h .link-note b{color:var(--gold-deep)}

  .pillar{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden;box-shadow:var(--shadow-1)}
  .pillar-h{display:flex;align-items:center;gap:11px;padding:13px 18px;background:var(--card-2);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pillar-h .pnm{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--ink)}
  .pillar-h .psub{font-size:11px;color:var(--ink3)}
  .pillar-h .src{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:5px}
  .src-xlsx{background:var(--gold-soft);color:var(--gold-deep)} .src-guan{background:rgba(42,110,107,.12);color:#2a6e6b} .src-ai{background:rgba(28,32,70,.08);color:var(--navy)}
  .pillar-body{padding:14px 18px 16px}
  .bench-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .bench-lbl{font-family:var(--mono);font-size:9.5px;font-weight:700;color:var(--ink3);letter-spacing:.4px;padding-top:6px;width:64px;flex:none}
  .bench-lbl .tip{display:block;font-weight:400;color:var(--ink4);font-size:8.5px;margin-top:2px}
  .bchip{display:inline-flex;flex-direction:column;gap:1px;padding:6px 11px;border-radius:9px;background:var(--bg-top);border:1px solid var(--line)}
  .bchip .ba{font-family:var(--serif);font-weight:600;font-size:12.5px;color:var(--ink)}
  .bchip .ba .f{font-family:var(--mono);font-size:9px;color:var(--ink4);font-weight:400;margin-left:4px}
  .bchip .ba .bx{margin-left:6px;color:var(--ink4);cursor:pointer;font-weight:700} .bchip .ba .bx:hover{color:var(--err)}
  .bchip .bv{font-size:10.5px;color:var(--ink3)}
  .bchip .bv .lk{font-family:var(--mono);color:#cf6d7e;font-weight:700} .bchip .bv a{color:var(--gold-deep);text-decoration:none;font-family:var(--mono);font-size:9.5px}
  .bench-add{align-self:center;font-size:11.5px;font-weight:600;color:var(--ink3);border:1px dashed var(--line2);border-radius:9px;padding:6px 11px;cursor:pointer;background:transparent}
  .bench-add:hover{color:var(--gold-deep);border-color:var(--gold-line)}
  .bench-note{font-size:10.5px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px;align-self:center}

  .edit-input{flex:1;min-width:220px;height:30px;padding:0 11px;border:1px solid var(--gold-line);border-radius:8px;font-size:12.5px;outline:none;box-shadow:0 0 0 3px var(--gold-soft);font-family:inherit;background:var(--card);color:var(--ink)}

  .pillar-add{margin-top:12px;padding:15px;border:1px dashed var(--line2);border-radius:16px;text-align:center;font-size:13px;font-weight:600;color:var(--ink3);cursor:pointer;transition:all .12s}
  .pillar-add:hover{border-color:var(--gold-line);color:var(--gold-deep);background:var(--gold-soft)}
  .pillar-add-form{margin-top:12px;padding:14px;border:1px solid var(--gold-line);border-radius:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft)}
  .pillar-add-form .edit-input{flex:none;width:200px;min-width:130px} .pillar-add-form .pa-sub{width:240px}
  .pillar-add-form .pa-ok{height:32px;padding:0 16px;background:var(--navy);color:var(--night-ink);border:0;border-radius:8px;font-size:12.5px;font-weight:600;cursor:pointer}
  .pillar-add-form .pa-cancel{height:32px;padding:0 12px;background:transparent;border:1px solid var(--line);border-radius:8px;font-size:12px;color:var(--ink3);cursor:pointer}

  .mask{position:fixed;inset:0;background:rgba(28,32,70,.4);z-index:90;display:flex;align-items:center;justify-content:center}
  .mbox{background:var(--card);border-radius:18px;width:460px;max-width:92vw;max-height:86vh;overflow:auto;box-shadow:var(--shadow-2)}
  .mbox .mh{padding:16px 20px;font-family:var(--serif);font-weight:600;font-size:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;color:var(--ink)}
  .mbox .mh .mx{margin-left:auto;cursor:pointer;color:var(--ink3);font-size:20px}
  .mbox .mb{padding:16px 20px 20px}
  .mnote{font-size:11.5px;color:var(--ink2);background:var(--gold-soft);border:1px solid var(--gold-line);border-radius:9px;padding:9px 12px;line-height:1.6;margin-bottom:14px}.mnote b{color:var(--gold-deep)}
  .mlbl{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:8px}
  .mrow{display:flex;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:12.5px}.mrow:first-of-type{border-top:0}
  .mrow .mrl b{color:var(--ink)}.mrow .mrt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--ok);background:var(--ok-soft);padding:2px 7px;border-radius:5px}
  .mseg{display:flex;gap:8px;margin-bottom:12px}.mseg .ms{flex:1;padding:9px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:11.5px;font-weight:600;color:var(--ink3);cursor:pointer}.mseg .ms.on{border-color:var(--gold-line);background:var(--gold-soft);color:var(--gold-deep)}
  .minput{width:100%;height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:9px;font-size:13px;outline:none;font-family:inherit;background:var(--card);color:var(--ink)}.minput:focus{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
  .mhint{font-size:11px;color:var(--ink3);margin:7px 0 14px;line-height:1.5}
  .mgo{width:100%;height:42px;background:var(--navy);color:var(--night-ink);border:0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer}.mgo:hover{background:#262c5e}.mgo:disabled{opacity:.5}
  .mf-h{font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:700;display:flex;align-items:center;gap:8px;margin:14px 0 8px}
  .mf-h .mf-sp{width:11px;height:11px;border:2px solid var(--gold-line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .mf-row{display:flex;gap:9px;padding:5px 0;font-size:12px;color:var(--ink2);opacity:0;transform:translateY(4px);transition:.25s}.mf-row.show{opacity:1;transform:translateY(0)}.mf-row b{color:var(--ink)}

  .toast-host{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{background:var(--navy);color:var(--night-ink);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-2);display:inline-flex;align-items:center;gap:9px;animation:tin .25s}
  .toast .ck{width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body data-active="topic">
<div class="layout">
  <main class="page"><div class="inner">
    <div class="zone-h">
      <h3><svg class="spark"><use href="#i-spark"/></svg>账号工作台</h3>
      <span class="rule"></span>
      <a class="more" href="奇境-选题-v1.html">← 回选题脑暴</a>
    </div>
    <div class="cap-sub">这页只<b>管理账号</b>：定位 / 受众 / 内容板块 / 每个板块对标 —— <b>不出选题</b>，配好了去「选题」出。</div>
    <div class="acctbar" id="acctbar"></div>
    <div id="body"></div>
  </div></main>
</div>
<div class="toast-host" id="toastHost"></div>

<script src="qj-shell.js"></script>
<script src="qj-accounts.js"></script>
<script>
// 账号档案不再写死在这页——读共享数据 qj-accounts.js（localStorage qijing_accounts）。
// 这页每次改动（改定位/受众、加删对标、加板块、建号）都 qjSaveAccounts(ACCT) 落盘，选题页读同一份。
let ACCT = qjLoadAccounts();

const $=id=>document.getElementById(id);
let cur='mc';
function toast(m){const e=document.createElement('div');e.className='toast';e.innerHTML='<span class="ck">✦</span>'+m;$('toastHost').appendChild(e);setTimeout(()=>{e.style.transition='opacity .25s';e.style.opacity='0';},2000);setTimeout(()=>e.remove(),2400);}

function renderTabs(){
  $('acctbar').innerHTML=ACCT.map(a=>{
    const t=a.cls==='mc'?'t-mc':a.cls==='xy'?'t-xy':'t-car';
    return `<div class="atab ${t}${a.key===cur?' on':''}" data-k="${a.key}"><span class="av">${a.nm.replace('天工 ','').slice(0,2)}</span><span><span class="nm">${a.nm}</span><br><span class="ro">${a.role}</span></span></div>`;
  }).join('') + '<div class="atab atab-add" id="addAcct"><span style="font-size:20px;font-weight:300;margin-right:6px;">＋</span><span><span class="nm" style="font-size:13px;">加号 / 建号</span><br><span class="ro">账号管理入口</span></span></div>';
  $('acctbar').querySelectorAll('.atab[data-k]').forEach(el=>el.onclick=()=>{cur=el.dataset.k;renderTabs();renderBody();});
  $('addAcct').onclick=openAcctMgr;
}
const SRCMAP={xlsx:['src-xlsx','xlsx栏目'],'xlsx+ai':['src-ai','xlsx栏目·AI校正'],guan:['src-guan','官网真栏目'],'guan+ai':['src-ai','官网栏目·AI补'],ai:['src-ai','AI 从历史聚类']};
function renderBody(){
  const a=ACCT.find(x=>x.key===cur);
  const h=a.cls==='mc'?'h-mc':a.cls==='xy'?'h-xy':'h-car';
  let html='<div class="acct-head '+h+'">'
    +'<div class="nm">'+a.nm+(a.price?'<span class="pr">'+a.price+'</span>':'')+'<button class="mng-this" onclick="openAcctMgr()">⚙ 管理这个号</button></div>'
    +'<div class="row"><span class="k pos">定位</span><span class="v">'+a.pos+'<button class="ed" onclick="startEdit(\'pos\',this)">✎ 改</button></span></div>'
    +'<div class="row"><span class="k aud">受众·要输出</span><span class="v">'+a.aud+'<button class="ed" onclick="startEdit(\'aud\',this)">✎ 改</button></span></div>'
    +'</div>'
    +'<div class="pillars-h">内容板块 · 每个板块各自配对标（<b>一一对应</b>）<span class="link-note">在这儿配好 <b>定位 / 受众 / 每板块对标</b> → 去「选题」按这份档案出选题。<b>这页只管配置，不出选题。</b></span></div>';
  a.pillars.forEach((p,pi)=>{
    const sm=SRCMAP[p.src]||['src-ai','AI'];
    const benchH=p.bench.map((b,bi)=>'<span class="bchip"><span class="ba">'+b.a+'<span class="f">'+b.f+'</span><span class="bx" onclick="rmBench('+pi+','+bi+')" title="移除">×</span></span><span class="bv"><span class="lk">❤'+b.l+'</span> '+b.v+(b.link&&b.link!=='#'?' <a href="'+b.link+'" target="_blank">↗</a>':'')+'</span></span>').join('');
    html+='<div class="pillar"><div class="pillar-h"><span class="pnm">'+p.nm+'</span><span class="psub">'+p.sub+'</span><span class="src '+sm[0]+'">'+sm[1]+'</span></div>'
      +'<div class="pillar-body"><div class="bench-row"><span class="bench-lbl">这个板块<br>对标<span class="tip">只对标<br>这类内容</span></span>'
      +benchH+(p.note?'<span class="bench-note">⚠ '+p.note+'</span>':'')
      +'<button class="bench-add" onclick="addBench('+pi+',this)">＋ 加对标</button></div>'
      +'</div></div>';
  });
  html+='<div class="pillar-add" onclick="addPillar(this)">＋ 新增内容板块（栏目）</div>';
  $('body').innerHTML=html;
}
let nextAcctN=1;
function addPillar(btn){
  const wrap=document.createElement('div');wrap.className='pillar-add-form';
  wrap.innerHTML='<input class="edit-input pa-nm" placeholder="栏目名，如：车间日记"><input class="edit-input pa-sub" placeholder="一句说明，如：车间稀缺花絮"><button class="pa-ok">确定</button><button class="pa-cancel">取消</button>';
  btn.replaceWith(wrap);wrap.querySelector('.pa-nm').focus();
  wrap.querySelector('.pa-ok').onclick=()=>{
    const nm=wrap.querySelector('.pa-nm').value.trim();
    if(!nm){wrap.querySelector('.pa-nm').focus();return;}
    const sub=wrap.querySelector('.pa-sub').value.trim()||'自定义板块';
    const a=ACCT.find(x=>x.key===cur);
    a.pillars.push({nm:nm,sub:sub,src:'ai',bench:[],note:'新栏目 · 去给这个板块加对标'});
    qjSaveAccounts(ACCT);renderBody();toast('已加内容板块「'+nm+'」· 给它加对标 →');
  };
  wrap.querySelector('.pa-cancel').onclick=()=>renderBody();
}
function startEdit(field,btn){
  const a=ACCT.find(x=>x.key===cur);const span=btn.closest('.v');
  const plain=(a[field]||'').replace(/<\/?b>/g,'');
  const inp=document.createElement('input');inp.className='edit-input';inp.value=plain;
  span.replaceWith(inp);inp.focus();inp.select();let done=false;
  const save=()=>{if(done)return;done=true;const v=inp.value.trim();if(v){a[field]=v;qjSaveAccounts(ACCT);}renderBody();if(v)toast('已更新账号档案 ✓');};
  inp.onkeydown=e=>{if(e.key==='Enter')save();else if(e.key==='Escape'){done=true;renderBody();}};
  inp.onblur=save;
}
function rmBench(pi,bi){
  const a=ACCT.find(x=>x.key===cur);const b=a.pillars[pi].bench[bi];
  a.pillars[pi].bench.splice(bi,1);qjSaveAccounts(ACCT);renderBody();
  toast('已移除对标 @'+(b?b.a:'')+' · 这个板块的选题来源已更新');
}
function addBench(pi,btn){
  const a=ACCT.find(x=>x.key===cur);
  const inp=document.createElement('input');inp.className='edit-input';inp.style.minWidth='180px';inp.placeholder='对标账号名 / 抖音链接 + Enter';
  btn.replaceWith(inp);inp.focus();let done=false;
  const add=(commit)=>{if(done)return;done=true;const v=inp.value.trim();
    if(commit&&v){a.pillars[pi].bench.push({a:v,f:'抓取中',v:'AI 正在抓它的爆款',l:'?',link:'#'});qjSaveAccounts(ACCT);toast('🔍 AI 正在抓 @'+v+' 的爆款，给「'+a.nm+'·'+a.pillars[pi].nm+'」建对标 <span style="opacity:.6">(demo)</span>');}
    renderBody();};
  inp.onkeydown=e=>{if(e.key==='Enter')add(true);else if(e.key==='Escape')add(false);};
  inp.onblur=()=>add(true);
}
function openAcctMgr(){
  const m=document.createElement('div');m.className='mask';
  const list=ACCT.map(a=>'<div class="mrow"><span class="mrl"><b>'+a.nm+'</b> · '+a.role+'</span><span class="mrt">已建号</span></div>').join('');
  m.innerHTML='<div class="mbox"><div class="mh">账号管理 · 加号 / 建号<span class="mx">×</span></div><div class="mb">'
    +'<div class="mnote">这是<b>入口</b>——进来配号、配好就关，不是常驻页。日常选题在「选题」做。</div>'
    +'<div class="mlbl">你运营的号（'+ACCT.length+'）</div>'+list
    +'<div class="mlbl" style="margin-top:16px">建一个新号</div>'
    +'<div class="mseg"><button class="ms on" data-t="car">车型/官号（绑已有抖音号）</button><button class="ms" data-t="ip">数字人IP（从0造）</button></div>'
    +'<input class="minput" id="mbIn" placeholder="粘贴抖音主页链接 / 输入抖音号">'
    +'<div class="mhint">建号 = 绑定真实抖音号 → AI 抓它历史建档 → 定人设 → 给每个内容板块配对标</div>'
    +'<button class="mgo" id="mbGo">让 AI 建档 →</button><div id="mbFlow"></div></div></div>';
  document.body.appendChild(m);
  let type='car';
  m.querySelectorAll('.ms').forEach(b=>b.onclick=()=>{m.querySelectorAll('.ms').forEach(x=>x.classList.remove('on'));b.classList.add('on');type=b.dataset.t;});
  m.querySelector('.mx').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove();};
  m.querySelector('#mbGo').onclick=()=>buildAcct(m,type,m.querySelector('#mbIn').value.trim());
}
function buildAcct(m,type,val){
  if(!val){m.querySelector('#mbIn').focus();return;}
  const isLink=val.startsWith('http');
  const steps=type==='ip'?[['🆕','新建数字人IP <b>「'+val+'」</b>（无历史）'],['📖','读品牌手册找调性'],['🎭','按红旗基因搭人设草稿'],['🗂️','给它每个内容板块配该对标谁'],['✅','入库 → 进矩阵']]
    :[['🔗','绑定 <b>'+(isLink?'你粘贴的号':('@'+val))+'</b>'],['🔍','抓粉丝 / 认证 / 简介'],['📖','读它发过的近30条内容，提炼调性+已覆盖板块'],['🗂️','给每个内容板块配对标'],['✅','入库 → 进矩阵']];
  const fl=m.querySelector('#mbFlow');m.querySelector('#mbGo').disabled=true;
  fl.innerHTML='<div class="mf-h"><span class="mf-sp"></span>AI 正在建档…</div>'+steps.map(x=>'<div class="mf-row"><span>'+x[0]+'</span><span>'+x[1]+'</span></div>').join('');
  const rows=fl.querySelectorAll('.mf-row');let i2=0;
  const tick=()=>{ if(i2<rows.length){rows[i2].classList.add('show');i2++;setTimeout(tick,500);} else setTimeout(()=>{
    const key='new'+(nextAcctN++);const nm=type==='ip'?val:(isLink?'新绑定的号':val);
    ACCT.push({key:key,nm:nm,role:(type==='ip'?'数字人IP':'已绑定官号'),cls:(type==='ip'?'mc':'car'),pos:nm+(type==='ip'?' · 待完善人设':' · AI已建档(demo)'),aud:'AI 建档后待你确认「受众·要输出什么」',pillars:[{nm:'待配内容板块',sub:'建号时在这配',src:'ai',bench:[],note:'板块和对标建号时配'}]});
    qjSaveAccounts(ACCT);cur=key;m.remove();renderTabs();renderBody();
    toast('✓ 已建档入矩阵：'+nm+' <span style="opacity:.6">(demo)</span>');
  },450); };
  setTimeout(tick,200);
}
window.toast=toast;window.openAcctMgr=openAcctMgr;window.startEdit=startEdit;window.rmBench=rmBench;window.addBench=addBench;window.addPillar=addPillar;
renderTabs();renderBody();
</script>
</body>
</html>
