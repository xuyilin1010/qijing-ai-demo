    <text x="60" y="970" fill="#F6F2EA" font-size="31" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >以好奇感知世界，以行动回应向往。</text>
    <text x="60" y="1022" fill="#A9BDD0" font-size="31" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >在星空、山野与海岸之间，发现方向。</text>
  </svg></section>
<section style="margin:0;padding:0;line-height:0;background:#061323;"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1100" width="100%" role="img" aria-label="抬头，看见无垠的可能。" style="display:block;width:100%;height:auto;margin:0;padding:0;background:#061323;">

    <text x="60" y="104" fill="#E8BE79" font-size="26" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" letter-spacing="3">02 / UNDER THE STARS</text>

    <text x="60" y="238" fill="#F6F2EA" font-size="71" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >抬头，看见</text>

    <text x="60" y="984" fill="#F6F2EA" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >把目光交给星空，把答案留给自己。</text>
    <text x="60" y="1034" fill="#A9BDD0" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >在辽阔之中，为好奇留一片空白。</text>
  </svg></section>
<section style="margin:0;padding:0;line-height:0;background:#061323;"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1100" width="100%" role="img" aria-label="向上，让世界多一种视角。" style="display:block;width:100%;height:auto;margin:0;padding:0;background:#061323;">

    <text x="60" y="330" fill="#F6F2EA" font-size="71" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >多一种视角。</text>

  </svg></section>

    <text x="60" y="984" fill="#F6F2EA" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >让脚步回应心里的热望。</text>

<section style="margin:0;padding:0;line-height:0;background:#061323;"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1430" width="100%" role="img" aria-label="品质创造者人物故事" style="display:block;width:100%;height:auto;margin:0;padding:0;background:#061323;">
    <rect width="900" height="1430" fill="#061323"/>
    <text x="60" y="91" fill="#E8BE79" font-size="25" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" letter-spacing="3">02 / FIELD NOTES</text>
    <line x1="60" y1="126" x2="840" y2="126" stroke="#E8BE79" stroke-opacity=".58" stroke-width="2"/>
    <text x="60" y="226" fill="#F6F2EA" font-size="67" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >认真之处</text>
    <text x="60" y="310" fill="#F6F2EA" font-size="67" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >自有光芒。</text>
    <rect x="88" y="390" width="724" height="844" fill="#0C2135" stroke="#E8BE79" stroke-opacity=".35" stroke-width="2"/>
    <image x="90" y="392" width="720" height="840" preserveAspectRatio="xMidYMid slice" xlink:href="{{WECHAT_IMAGE:story-design.jpg}}"/>
    <text x="60" y="1298" fill="#F6F2EA" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >一张图纸，一次推敲。</text>
    <text x="60" y="1345" fill="#A9BDD0" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >那些不易被看见的耐心，</text>
    <text x="60" y="1392" fill="#A9BDD0" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >最终会留在作品的细节里。</text>
  </svg></section>
<section style="margin:0;padding:0;line-height:0;background:#061323;"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 1430" width="100%" role="img" aria-label="生活创作者人物故事" style="display:block;width:100%;height:auto;margin:0;padding:0;background:#061323;">
    <rect width="900" height="1430" fill="#061323"/>
    <text x="60" y="91" fill="#E8BE79" font-size="25" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" letter-spacing="3">03 / FIELD NOTES</text>
    <line x1="60" y1="126" x2="840" y2="126" stroke="#E8BE79" stroke-opacity=".58" stroke-width="2"/>
    <text x="60" y="226" fill="#F6F2EA" font-size="67" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >日常一刻</text>
    <text x="60" y="310" fill="#F6F2EA" font-size="67" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >也有新意。</text>
    <rect x="88" y="390" width="724" height="844" fill="#0C2135" stroke="#E8BE79" stroke-opacity=".35" stroke-width="2"/>
    <image x="90" y="392" width="720" height="840" preserveAspectRatio="xMidYMid slice" xlink:href="{{WECHAT_IMAGE:story-coffee.jpg}}"/>
    <text x="60" y="1298" fill="#F6F2EA" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >留出一点时间，认真做一杯咖啡。</text>
    <text x="60" y="1345" fill="#A9BDD0" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >把喜欢的细节慢慢积攒，</text>
    <text x="60" y="1392" fill="#A9BDD0" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >日常也能成为自己的创作。</text>
  </svg></section>
<section style="margin:0;padding:0;line-height:0;background:#061323;"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 900" width="100%" role="img" aria-label="探索长卷结尾" style="display:block;width:100%;height:auto;margin:0;padding:0;background:#061323;">
    <rect width="900" height="900" fill="#061323"/>
    <image x="0" y="300" width="900" height="600" preserveAspectRatio="xMidYMid slice" xlink:href="{{WECHAT_IMAGE:ending-light-trails.jpg}}"/>
    <text x="60" y="104" fill="#E8BE79" font-size="25" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="700" letter-spacing="4">BEYOND THE KNOWN</text>
    <line x1="60" y1="136" x2="840" y2="136" stroke="#E8BE79" stroke-opacity=".58" stroke-width="2"/>
    <text x="60" y="266" fill="#F6F2EA" font-size="72" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >追逐梦想</text>
    <text x="60" y="358" fill="#F6F2EA" font-size="72" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >敢于探索</text>
    <text x="60" y="450" fill="#F6F2EA" font-size="72" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="800" >向往自由</text>
    <text x="60" y="705" fill="#F6F2EA" font-size="40" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="600" >知行合一，便是自由。</text>
    <text x="60" y="798" fill="#A9BDD0" font-size="30" font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif" font-weight="400" >下一段旅程，仍在前方。</text>
  </svg></section>
