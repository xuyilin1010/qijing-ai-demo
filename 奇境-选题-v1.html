<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇境.ai · 选题</title>
<!-- 选题脑暴 · 奇境皮 · 套 qj-shell · 真抖音对标(超哥超车/车哥测评/意公子/水星)
     加入备用池 → localStorage(qijing_topic_pool) → 排期页待排期列 -->
<link rel="stylesheet" href="奇境-字体.css">
<link rel="stylesheet" href="qj-shell.css">
<style>
  .zone-h{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
  .zone-h h3{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .zone-h h3 .spark{width:14px;height:14px;fill:var(--gold);flex:none;transform:translateY(1px)}
  .zone-h .rule{flex:1;height:1px;background:var(--line)}
  .zone-h .more{font-size:12.5px;color:var(--ink3);font-weight:500}
  .zone-h .more:hover{color:var(--gold-deep)}

  /* 账号 tab */
  .acct-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .at{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;color:var(--ink2);transition:all .14s}
  .at:hover{border-color:var(--line2);color:var(--ink)}
  .at.on{background:var(--navy);border-color:var(--navy);color:var(--night-ink);font-weight:600}
  .at .d{width:7px;height:7px;border-radius:50%;background:var(--gold)}
  .at-add{border-style:dashed;color:var(--ink3);font-weight:600}
  .at-add:hover{color:var(--gold-deep);border-color:var(--gold-line)}

  /* 发起区：三个起点（节点 / 想法 / 对标） */
  .start-zone{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-1);padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
  .sz-head{font-family:var(--mono);font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3)}
  .sz-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .sz-tag{font-size:12px;color:var(--ink2);font-weight:600;flex:none;width:78px}
  .sz-nodes{display:flex;gap:7px;flex-wrap:wrap;flex:1}
  .sz-node{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold-deep);font-size:12px;font-weight:600;cursor:pointer}
  .sz-node:hover{background:var(--gold-soft2)}
  .sz-node .nd{font-family:var(--mono);font-size:9px;color:var(--ink4);font-weight:400}
  .sz-ask{flex:1;min-width:200px;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:9px;font-size:13px;outline:none;font-family:inherit;background:var(--bg-top);color:var(--ink)}
  .sz-ask:focus{border-color:var(--gold-line);box-shadow:0 0 0 3px var(--gold-soft)}
  .sz-go{height:34px;padding:0 16px;border:0;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;color:#22182a;background:linear-gradient(150deg,#e9bf5f,#cf9a3b);flex:none}
  .sz-go:hover{filter:brightness(1.03)}

  .grid2{display:grid;grid-template-columns:minmax(360px,5fr) 7fr;gap:16px;align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

  /* feed */
  .feed{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);overflow:hidden}
  .feed-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);padding:13px 16px;border-bottom:1px solid var(--line)}
  .feed-h b{color:var(--gold-deep)}
  .frow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;border-left:2.5px solid transparent;transition:background .12s}
  .frow:last-child{border-bottom:0}
  .frow:hover{background:var(--card-2)}
  .frow.on{background:var(--gold-soft);border-left-color:var(--gold)}
  .frow .acct{font-family:var(--mono);font-size:10px;color:var(--ink3)}
  .frow .tt{font-size:13px;color:var(--ink);line-height:1.45;margin-top:2px;font-weight:500}
  .frow .pdg{font-size:11px;color:var(--ink3);margin-top:3px}
  .frow .end{text-align:right;white-space:nowrap}
  .frow .lk{font-family:var(--mono);font-size:13.5px;font-weight:600;color:var(--ink)}
  .frow .lk::before{content:"❤";color:#cf6d7e;font-size:10px;margin-right:2px}
  .frow .dt{font-family:var(--mono);font-size:9.5px;color:var(--ink4);margin-top:2px}

  /* work pane */
  .work{display:flex;flex-direction:column;gap:14px}
  .src{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);padding:18px 20px}
  .src .cap{font-family:var(--mono);font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);background:var(--card-2);border-radius:7px;padding:4px 10px;display:inline-block;margin-bottom:11px}
  .src .meta{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-bottom:6px}
  .src .meta .a{font-family:var(--serif);font-size:13px;color:var(--ink);font-weight:600}
  .src .stt{font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.35;color:var(--ink);margin-bottom:10px}
  .src .pdg{display:flex;gap:9px;padding:9px 12px;background:var(--gold-soft);border-radius:0 9px 9px 0;border-left:3px solid var(--gold);font-size:12px;color:var(--gold-deep);font-weight:600}
  .src a.link{color:var(--gold-deep);font-family:var(--mono);font-size:11px}
  .btn-gen{height:40px;padding:0 20px;border:0;border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer;color:#22182a;background:linear-gradient(150deg,#e9bf5f,#cf9a3b);box-shadow:0 4px 14px rgba(190,140,50,.3);align-self:flex-start}
  .btn-gen:hover{filter:brightness(1.03)}

  .think{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
  .think .th{font-family:var(--mono);font-size:10px;color:var(--ink3);font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .think .th .sp{width:11px;height:11px;border:2px solid var(--gold-line);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .think .tk{display:flex;gap:9px;padding:4px 0;font-size:12.5px;color:var(--ink2);line-height:1.5;opacity:0;transform:translateY(4px);transition:.25s}
  .think .tk.show{opacity:1;transform:translateY(0)}
  .think .tk .ic{width:16px;text-align:center;flex:none} .think .tk b{color:var(--ink)} .think .tk .em{color:var(--gold-deep);font-weight:600}

  .res-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink3);margin:2px 0 2px}
  .res-h b{color:var(--gold-deep)}
  .gcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:1180px){.gcards{grid-template-columns:1fr}}
  .gc{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-1);padding:14px 15px;display:flex;flex-direction:column;gap:8px}
  .gc .role{display:flex;align-items:center;gap:7px;padding-bottom:9px;border-bottom:1px dashed var(--line)}
  .gc .role .dot{width:7px;height:7px;border-radius:50%}
  .gc.cat-mc .role .dot{background:var(--navy)} .gc.cat-xy .role .dot{background:#8a5a86} .gc.cat-car .role .dot{background:var(--gold)}
  .gc .role .rn{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink2)}
  .gc .role .col{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:600;color:var(--gold-deep);background:var(--gold-soft);padding:2px 7px;border-radius:6px}
  .gc .gt{font-family:var(--serif);font-size:14.5px;font-weight:600;line-height:1.4;color:var(--ink)}
  .gc .gg{font-size:12px;color:var(--ink2);line-height:1.55}
  .gc .add{margin-top:auto;height:32px;border:1px solid var(--gold-line);border-radius:9px;background:var(--gold-soft);color:var(--gold-deep);font-size:12.5px;font-weight:600;cursor:pointer}
  .gc .add:hover{background:var(--gold-soft2)}
  .gc .add.added{background:var(--ok-soft);color:var(--ok);border-color:rgba(58,115,80,.3);cursor:default}

  .empty{padding:54px 20px;text-align:center;color:var(--ink3);font-size:13px}
  .empty .es{font-family:var(--serif);font-size:15px;color:var(--ink2);margin-bottom:6px}

  .toast-host{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{background:var(--navy);color:var(--night-ink);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-2);display:inline-flex;align-items:center;gap:9px;animation:tin .25s}
  .toast .ck{width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body data-active="topic">
<div class="layout">
  <main class="page"><div class="inner">

    <div class="zone-h">
      <h3><svg class="spark"><use href="#i-spark"/></svg>选题</h3>
      <span class="rule"></span>
      <a class="more" href="奇境-排期-v1.html">看中的去排期 ›</a>
    </div>

    <div class="acct-tabs" id="acctTabs"></div>

    <div class="start-zone">
      <div class="sz-head">从哪起做选题 · 三选一</div>
      <div class="sz-row"><span class="sz-tag">① 近期节点</span><div class="sz-nodes" id="szNodes"></div></div>
      <div class="sz-row"><span class="sz-tag">② 我有想法</span>
        <input class="sz-ask" id="szAsk" placeholder="直接说：想做什么？比如「端午」「父亲节」「618」">
        <button class="sz-go" id="szGo">想选题 ›</button></div>
    </div>

    <div class="grid2">
      <section class="feed">
        <div class="feed-h" id="feedH">对标爆款 · 近30天</div>
        <div id="feedList"></div>
      </section>
      <section class="work" id="work">
        <div class="empty"><div class="es">左边选一条对标爆款</div>看 AI 想出我们号能拍的选题</div>
      </section>
    </div>

  </div></main>
</div>
<div class="toast-host" id="toastHost"></div>

<script src="qj-shell.js"></script>
<script src="qj-accounts.js"></script>
<script>
// 选题不再自带写死的对标——全部来自账号工作台的档案（共享数据 qj-accounts.js）。
// 账号 tab、左侧对标列表 = 工作台里每个号每个板块配的对标。配置真驱动选题。
const POOL_KEY='qijing_topic_pool';
const $=id=>document.getElementById(id);
const accounts=qjLoadAccounts();
let curAcct='all', curSeed=null; // curSeed: {type:'bench',rowId} | {type:'node',label} | {type:'ask',text}

function toast(m){const e=document.createElement('div');e.className='toast';e.innerHTML='<span class="ck">✦</span>'+m;$('toastHost').appendChild(e);setTimeout(()=>{e.style.transition='opacity .25s';e.style.opacity='0';},2000);setTimeout(()=>e.remove(),2400);}
function loadPool(){try{return JSON.parse(localStorage.getItem(POOL_KEY)||'[]')}catch(e){return[]}}
function savePool(p){localStorage.setItem(POOL_KEY,JSON.stringify(p))}
// 排期页的账号泳道用无空格名（天工05），档案里是带空格的展示名（天工 05），过桥时归一化，避免多出一条重复泳道
function schedName(nm){return (nm||'').replace(/\s+/g,'');}

// 账号 tab：全部号 + 工作台里每个号（工作台加号，这里立刻多一个）
function renderTabs(){
  const tabs=[{key:'all',label:'全部号'}].concat(accounts.map(a=>({key:a.key,label:a.nm})));
  $('acctTabs').innerHTML=tabs.map(t=>`<span class="at${t.key===curAcct?' on':''}" data-k="${t.key}">${t.key!=='all'?'<span class="d"></span>':''}${t.label}</span>`).join('')
    +'<a class="at at-add" href="奇境-账号工作台-v1.html">＋ 管理账号 / 配对标</a>';
  $('acctTabs').querySelectorAll('.at[data-k]').forEach(el=>el.onclick=()=>{curAcct=el.dataset.k;curSeed=null;render();});
}
function acctByKey(k){return accounts.find(a=>a.key===k);}

// ① 近期节点：从共享数据 QJ_NODES 取未来 ~14 天、去重标签
function upcomingNodes(){
  const NODES=window.QJ_NODES||{},seen={},out=[];
  for(let off=0;off<14;off++){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);
    const k=(d.getMonth()+1)+'/'+d.getDate(),label=NODES[k];
    if(label&&!seen[label]){seen[label]=1;out.push({label,md:k});}}
  return out;
}
function renderNodes(){
  const ns=upcomingNodes();
  $('szNodes').innerHTML=ns.length?ns.map(n=>`<span class="sz-node" data-label="${n.label}">${n.label}<span class="nd">${n.md}</span></span>`).join('')
    :'<span style="font-size:12px;color:var(--ink3)">近两周没有标记的节点</span>';
  $('szNodes').querySelectorAll('.sz-node').forEach(el=>el.onclick=()=>{curSeed={type:'node',label:el.dataset.label};render();});
}
// ③ 跟对标：把每个号每个板块配的对标摊平成行
function benchRows(){
  const rows=[];
  accounts.forEach(a=>{
    if(curAcct!=='all'&&a.key!==curAcct)return;
    (a.pillars||[]).forEach((p,pi)=>{(p.bench||[]).forEach((b,bi)=>{rows.push({id:a.key+'|'+pi+'|'+bi,acct:a,pillar:p,b:b});});});
  });
  return rows;
}
function findRow(id){return benchRows().find(r=>r.id===id);}
function renderFeed(){
  const rows=benchRows();
  $('feedH').innerHTML='③ 跟一条对标起 · 来自工作台配的板块对标 · <b>'+rows.length+'</b> 条';
  if(!rows.length){
    $('feedList').innerHTML='<div class="empty"><div class="es">这个号还没配对标</div>去 <a href="奇境-账号工作台-v1.html" style="color:var(--gold-deep);font-weight:600">账号工作台</a> 给它的内容板块配对标 →</div>';
    return;
  }
  $('feedList').innerHTML=rows.map(r=>{
    const tag=(curAcct==='all'?r.acct.nm+' · ':'')+r.pillar.nm;
    const on=curSeed&&curSeed.type==='bench'&&curSeed.rowId===r.id;
    return `<div class="frow${on?' on':''}" data-id="${r.id}">
      <div><div class="acct">${tag} · @${r.b.a}${r.b.f?' · '+r.b.f:''}</div>
        <div class="tt">${r.b.v}</div>${r.b.pdg?`<div class="pdg">${r.b.pdg}</div>`:''}</div>
      <div class="end"><div class="lk">${r.b.l||'—'}</div><div class="dt">对标</div></div></div>`;
  }).join('');
  $('feedList').querySelectorAll('.frow').forEach(el=>el.onclick=()=>{curSeed={type:'bench',rowId:el.dataset.id};render();});
}

// 工作区：按当前起点渲染来源卡 + 生成按钮
function renderWork(){
  if(!curSeed){$('work').innerHTML='<div class="empty"><div class="es">选个起点</div>点上面的节点、说句想法，或左边跟一条对标——AI 按这个号的定位想选题</div>';return;}
  let cap,metaH,titleH,extra='';
  if(curSeed.type==='bench'){
    const r=findRow(curSeed.rowId);if(!r){curSeed=null;return renderWork();}
    const b=r.b;
    cap=`📥 ${r.acct.nm} · ${r.pillar.nm} 的对标 · 看能学什么`;metaH=`<span class="a">@${b.a}</span>${b.f?' · '+b.f:''}`;titleH=b.v;
    if(b.pdg)extra+=`<div class="pdg"><span>它火的套路</span><span style="color:var(--ink2);font-weight:500">${b.pdg}</span></div>`;
    if(b.link&&b.link!=='#')extra+=`<div style="margin-top:10px"><a class="link" href="${b.link}" target="_blank">↗ 抖音看 @${b.a} 主页</a></div>`;
  }else if(curSeed.type==='node'){
    cap='📅 按节点起 · 看这个号能借什么势';metaH='<span class="a">内容节点</span>';titleH=curSeed.label;
  }else{
    cap='💡 你说 · AI 按这个号想';metaH='<span class="a">我的想法</span>';titleH=curSeed.text;
  }
  $('work').innerHTML=`<div class="src">
    <span class="cap">${cap}</span>
    <div class="meta">${metaH}</div>
    <div class="stt">${titleH}</div>${extra}
  </div>
  <button class="btn-gen" id="genBtn">AI 帮我想几条 ›</button>
  <div id="gen"></div>`;
  $('genBtn').onclick=()=>genTopics();
}
function render(){renderTabs();renderNodes();renderFeed();renderWork();}

// 解析当前起点 → 选题种子 picks + 思考动画文案 + 入池来源标签
function matchNodeTopics(s){
  const NT=window.QJ_NODE_TOPICS||{},out=[];
  Object.keys(NT).forEach(k=>{if(s&&s.indexOf(k)>=0)out.push.apply(out,NT[k]);});
  return out;
}
function seedContext(){
  if(curSeed.type==='bench'){
    const r=findRow(curSeed.rowId),a=r.acct,b=r.b;
    const picks=b.pick?[{acctKey:a.key,col:b.pick.col,t:b.pick.t,g:b.pick.g}]:[];
    return {picks,who:a.nm,lead:`拆「@${b.a}」为什么火：<b>${b.pdg||b.v}</b>`,source:'对标·'+b.a};
  }
  if(curSeed.type==='node'){
    const matched=matchNodeTopics(curSeed.label);
    const picks=curAcct==='all'?matched:matched.filter(p=>p.acctKey===curAcct);
    return {picks,who:curAcct==='all'?'相关号':(acctByKey(curAcct)||{}).nm,lead:`扣住节点 <b>${curSeed.label}</b>，挑能借势的号`,source:'节点·'+curSeed.label};
  }
  const matched=matchNodeTopics(curSeed.text);
  const picks=curAcct==='all'?matched:matched.filter(p=>p.acctKey===curAcct);
  return {picks,who:curAcct==='all'?'合适的号':(acctByKey(curAcct)||{}).nm,lead:`理解你说的「<b>${curSeed.text}</b>」`,source:'想法·'+curSeed.text};
}
function genTopics(){
  const ctx=seedContext();
  const steps=[
    {ic:'🔍',t:ctx.lead},
    {ic:'🎭',t:`对齐 <b>${ctx.who}</b> 的定位口径`},
    {ic:'🛡️',t:'过护栏：<b>不编参数、不踩品牌禁区</b>'},
    {ic:'✍️',t:'落成能拍的选题…'}
  ];
  $('genBtn').disabled=true;$('genBtn').style.opacity=.5;
  const g=$('gen');
  g.innerHTML='<div class="think"><div class="th"><span class="sp"></span>AI 正在想…</div>'+steps.map(s=>`<div class="tk"><span class="ic">${s.ic}</span><span>${s.t}</span></div>`).join('')+'</div>';
  const rows=g.querySelectorAll('.tk');let i=0;
  const tick=()=>{if(i<rows.length){rows[i].classList.add('show');i++;setTimeout(tick,400);}else setTimeout(showCards,420);};
  setTimeout(tick,160);
}
function showCards(){
  const ctx=seedContext(),g=$('gen');
  if(!ctx.picks.length){
    const whoTxt=curAcct==='all'?'合适的号':('「'+((acctByKey(curAcct)||{}).nm)+'」');
    g.innerHTML=`<div class="res-h">📤 AI 的建议</div>
      <div class="empty" style="padding:30px 16px"><div class="es">这个起点还没接 AI 选题生成</div>
      正式版会按${whoTxt}的定位现想几条。<br><span style="opacity:.55">(demo · 待接生成)</span></div>`;
    return;
  }
  const pool=loadPool();
  g.innerHTML=`<div class="res-h">📤 AI 想了 <b>${ctx.picks.length}</b> 条</div>
  <div class="gcards">${ctx.picks.map((pk,pi)=>{
    const a=acctByKey(pk.acctKey)||{nm:pk.acctKey,cls:'car'};
    const inpool=pool.some(x=>x.title===pk.t);
    return `<div class="gc cat-${a.cls}">
      <div class="role"><span class="dot"></span><span class="rn">${a.nm}</span><span class="col">${pk.col}</span></div>
      <div class="gt">${pk.t}</div><div class="gg">${pk.g}</div>
      <button class="add${inpool?' added':''}" data-pi="${pi}">${inpool?'✓ 已入备用池':'＋ 加入备用池'}</button>
    </div>`;}).join('')}</div>`;
  g.querySelectorAll('.add').forEach(btn=>btn.onclick=()=>{
    if(btn.classList.contains('added'))return;
    const pk=ctx.picks[+btn.dataset.pi],a=acctByKey(pk.acctKey)||{nm:pk.acctKey,cls:'car',role:''};
    const pool=loadPool();if(pool.some(x=>x.title===pk.t))return;
    pool.push({key:'t'+Date.now()+Math.floor(Math.random()*99),cat:a.cls,nm:schedName(a.nm),who:a.role||a.nm,column:pk.col,title:pk.t,account:ctx.source,sched:null});
    savePool(pool);btn.classList.add('added');btn.textContent='✓ 已入备用池';
    toast('已加入备用池 · 去「排期」排进日历');
  });
}
