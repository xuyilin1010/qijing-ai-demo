<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公众号三项最小测试</title><style>body{font:16px/1.7 sans-serif;max-width:480px;margin:24px auto;padding:16px}button{padding:14px;margin:10px}</style><h2>只测试这三个小块</h2><p>A、B 使用相同图片地址；C 不依赖图片。先在此处点圆形测试，再复制到公众号，保存并预览。</p><button id="copyProbe">复制最小测试</button><p id="status"></p><div id="probe"><section style="padding:16px;background:#07172c;color:#ffffff"><p style="color:#ffffff">A 普通图片（应显示星空）</p><img src="https://xuyilin1010.github.io/qijing-ai-demo/%E5%85%AC%E4%BC%97%E5%8F%B7demo1/wechat/night.jpg" style="display:block;width:100%;max-width:300px"/><p style="color:#ffffff">B SVG 图片（应显示同一张星空）</p><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 300 160" width="300" height="160"><rect width="300" height="160" fill="#204666"/><image href="https://xuyilin1010.github.io/qijing-ai-demo/%E5%85%AC%E4%BC%97%E5%8F%B7demo1/wechat/night.jpg" xlink:href="https://xuyilin1010.github.io/qijing-ai-demo/%E5%85%AC%E4%BC%97%E5%8F%B7demo1/wechat/night.jpg" width="300" height="160" preserveAspectRatio="xMidYMid slice"/></svg><p style="color:#ffffff">C 点击金色圆形，应变成蓝色；不依赖图片</p><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130" width="300" height="130"><circle id="wx_probe_button" cx="150" cy="65" r="48" fill="#e5bc76"><set attributeName="fill" to="#38aeea" begin="wx_probe_button.click" fill="freeze"/></circle><text x="150" y="71" text-anchor="middle" font-size="18" fill="#07172c" pointer-events="none">点击变蓝</text></svg></section></div><script>
document.getElementById('copyProbe').onclick=async()=>{try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([document.getElementById('probe').innerHTML],{type:'text/html'}),'text/plain':new Blob(['公众号 ABC 兼容性测试'],{type:'text/plain'})})]);document.getElementById('status').textContent='已复制，只粘贴这三个小块即可。'}catch(e){document.getElementById('status').textContent='复制失败，请手动选中三个测试块复制。'}};
</script>
