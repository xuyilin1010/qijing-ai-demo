<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>奇境AI · 资产</title>
<link rel="stylesheet" href="奇境-字体.css">
<link rel="stylesheet" href="qj-shell.css">
<style>
  button,input,select,textarea{font:inherit}
  button{border:0}
  .asset-page-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-3)}
  .asset-title-wrap{display:flex;align-items:center;gap:var(--space-2)}
  .asset-title-icon{width:var(--space-5);height:var(--space-5);display:grid;place-items:center;border-radius:var(--radius-md);background:var(--grad-navy);color:var(--gold-on-navy);box-shadow:var(--shadow-logo)}
  .asset-title-icon svg{width:var(--space-3);height:var(--space-3)}
  .asset-tabs{margin-bottom:var(--space-3)}
  .asset-tabs .qj-tab{min-width:112px}
  .asset-stage{min-height:520px}

  .brand-layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:var(--space-3);align-items:start}
  .brand-sidebar{padding:var(--space-2);position:sticky;top:0}
  .sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-1);padding-bottom:var(--space-2)}
  .sidebar-head h2{font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold)}
  .brand-tree{display:grid;gap:var(--space-1)}
  .brand-node{border:1px solid transparent;border-radius:var(--radius-md)}
  .brand-node.is-active{border-color:var(--gold-line);background:var(--gold-soft)}
  .brand-row{width:100%;display:flex;align-items:center;gap:var(--space-1);padding:var(--space-1);border-radius:var(--radius-sm);background:transparent;color:var(--ink);text-align:left;cursor:pointer}
  .brand-row:hover{background:var(--card-2)}
  .brand-mark{width:var(--space-5);height:var(--space-5);display:grid;place-items:center;flex:none;border-radius:var(--radius-sm);background:var(--grad-navy);color:var(--on-navy-warm);font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold)}
  .brand-row-text{min-width:0;flex:1}
  .brand-row-name{display:block;font-size:var(--type-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-row-count{display:block;margin-top:2px;font-family:var(--mono);font-size:var(--type-meta);color:var(--ink3)}
  .brand-chevron{width:var(--space-2);height:var(--space-2);fill:none;stroke:var(--ink3);stroke-width:2;transition:transform .16s}
  .brand-node.is-active .brand-chevron{transform:rotate(180deg)}
  .project-tree{display:grid;gap:4px;padding:0 var(--space-1) var(--space-1) calc(var(--space-5) + var(--space-1))}
  .project-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px;min-width:0}
  .project-main{min-width:0;min-height:var(--space-4);padding:0 var(--space-1);border-radius:var(--radius-sm);background:transparent;color:var(--ink2);font-size:var(--type-meta);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .project-main:hover,.project-row.is-active .project-main{background:var(--card);color:var(--gold-deep)}
  .project-tools{display:flex;align-items:center;opacity:0;transition:opacity .16s}
  .project-row:hover .project-tools,.project-row.is-active .project-tools{opacity:1}
  .mini-action{min-height:var(--space-4);padding:0 5px;background:transparent;color:var(--ink3);font-size:var(--type-meta);cursor:pointer}
  .mini-action:hover{color:var(--gold-deep)}
  .mini-action.is-danger:hover{color:var(--err)}
  .new-project-button{width:100%;min-height:var(--space-4);padding:0 var(--space-1);border-radius:var(--radius-sm);background:transparent;color:var(--gold-deep);font-size:var(--type-meta);text-align:left;cursor:pointer}
  .new-project-button:hover{background:var(--card)}

  .brand-workspace{display:grid;gap:var(--space-3);min-width:0}
  .brand-hero{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3)}
  .brand-hero .brand-mark{width:var(--space-8);height:var(--space-8);border-radius:var(--radius-lg);font-size:var(--type-zone-title)}
  .brand-hero-copy{min-width:0;flex:1}
  .brand-hero-copy h2{font-family:var(--serif);font-size:var(--type-zone-title);font-weight:var(--weight-semibold)}
  .brand-hero-copy p{margin-top:4px;font-family:var(--mono);font-size:var(--type-meta);color:var(--ink3)}
  .hero-actions{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-1);flex-wrap:wrap}
  .library-switch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
  .library-tile{display:flex;align-items:center;gap:var(--space-2);min-height:88px;padding:var(--space-2);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card);box-shadow:var(--shadow-1);color:var(--ink);text-align:left;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
  .library-tile:hover{transform:translateY(-1px);border-color:var(--line2);box-shadow:var(--shadow-2)}
  .library-tile.is-active{border-color:var(--gold-line);background:var(--gold-soft)}
  .library-icon{width:var(--space-5);height:var(--space-5);display:grid;place-items:center;flex:none;border-radius:var(--radius-sm);background:var(--grad-navy);color:var(--gold-on-navy)}
  .library-icon svg{width:var(--space-3);height:var(--space-3)}
  .library-tile strong{display:block;font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold)}
  .library-tile span{display:block;margin-top:4px;font-family:var(--mono);font-size:var(--type-meta);color:var(--ink3)}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
  .section-title{font-family:var(--serif);font-size:var(--type-zone-title);font-weight:var(--weight-semibold)}
  .section-meta{font-family:var(--mono);font-size:var(--type-meta);color:var(--ink3)}
  .brand-assets-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
  .brand-asset-card{display:grid;gap:var(--space-2);min-width:0}
  .brand-asset-top{display:flex;align-items:flex-start;gap:var(--space-2);min-width:0}
  .brand-asset-icon{width:var(--space-6);height:var(--space-6);display:grid;place-items:center;flex:none;border-radius:var(--radius-md);background:var(--card-2);color:var(--navy)}
  .brand-asset-icon svg{width:var(--space-3);height:var(--space-3)}
  .brand-asset-copy{min-width:0;flex:1}
  .brand-asset-copy h3{min-width:0;font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold);line-height:1.35}
  .brand-asset-copy p{margin-top:4px;overflow:hidden;color:var(--ink3);font-size:var(--type-meta);line-height:1.5;white-space:nowrap;text-overflow:ellipsis}
  .asset-name-link,.media-card-title-link{display:block;min-width:0;max-width:100%;overflow:hidden;padding:0;border:0;background:transparent;color:inherit;font:inherit;font-weight:inherit;line-height:inherit;text-align:left;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
  .asset-name-link:hover,.media-card-title-link:hover{color:var(--gold-deep);text-decoration:underline;text-underline-offset:3px}
  .association-row{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap;min-height:var(--space-4)}
  .brand-card-actions,.media-actions{display:flex;align-items:center;gap:4px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:var(--space-1)}

  .collection-view{display:grid;gap:var(--space-3)}
  .collection-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);flex-wrap:wrap}
  .collection-tools{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap}
  .filter-panel{display:grid;gap:var(--space-2)}
  .filter-row{display:flex;align-items:center;gap:var(--space-1);flex-wrap:wrap}
  .filter-row .qj-search{margin-left:auto;width:min(280px,100%)}
  .batch-row{display:flex;align-items:center;gap:var(--space-1);min-height:var(--space-5);padding:var(--space-1) var(--space-2);border-radius:var(--radius-md);background:var(--card-2);flex-wrap:wrap}
  .select-all{display:inline-flex;align-items:center;gap:var(--space-1);font-size:var(--type-meta);color:var(--ink2);cursor:pointer}
  .select-all input,.select-box input,.check-option input{accent-color:var(--gold)}
  .batch-count{margin-right:auto;font-family:var(--mono);font-size:var(--type-meta);color:var(--ink3)}
  .batch-delete-button{border-color:color-mix(in srgb,var(--err) 30%,var(--line));color:var(--err)}
  .batch-delete-button:hover{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 48%,var(--line));color:var(--err)}
  .media-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2)}
  .media-card{position:relative;min-width:0;padding:0;overflow:visible;transition:transform .16s,border-color .16s,box-shadow .16s}
  .media-card:hover{transform:translateY(-1px);border-color:var(--line2);box-shadow:var(--shadow-2)}
  .media-card.is-selected{border-color:var(--gold-line);box-shadow:var(--ring)}
  .select-box{position:absolute;z-index:4;top:var(--space-1);left:var(--space-1);width:var(--space-4);height:var(--space-4);display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--card);box-shadow:var(--shadow-1);cursor:pointer}
  .media-preview{position:relative;height:170px;overflow:hidden;border-radius:var(--radius-md) var(--radius-md) 0 0;display:flex;align-items:flex-end;padding:var(--space-2);background:var(--grad-navy);color:var(--night-ink)}
  .media-preview::before{content:"";position:absolute;inset:0;background-image:var(--grain);mix-blend-mode:soft-light;opacity:.36}
  .media-preview::after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,var(--navy))}
  .media-preview.tone-gold{background:linear-gradient(145deg,var(--gold-2),var(--navy))}
  .media-preview.tone-green{background:var(--grad-green)}
  .media-preview.tone-plum{background:var(--grad-plum)}
  .media-preview.tone-paper{background:linear-gradient(145deg,var(--card-2),var(--gold-soft2));color:var(--ink)}
  .media-preview.tone-paper::before{display:none}
  .media-preview.tone-paper::after{display:none}
  .preview-kind{position:absolute;z-index:3;top:var(--space-1);right:var(--space-1)}
  .preview-kind .qj-badge{border:1px solid color-mix(in srgb,var(--gold-deep) 20%,transparent);background:rgba(255,251,244,.94);box-shadow:0 3px 10px rgba(31,38,71,.12);color:#765116;font-weight:var(--weight-semibold);backdrop-filter:blur(6px)}
  .preview-center{position:absolute;z-index:2;inset:0;display:grid;place-items:center}
  .preview-center svg{width:var(--space-6);height:var(--space-6)}
  .play-button{width:var(--space-6);height:var(--space-6);display:grid;place-items:center;border:1px solid var(--night-ink2);border-radius:var(--radius-full);background:color-mix(in srgb,var(--navy) 72%,transparent);color:var(--night-ink)}
  .play-button svg{width:var(--space-3);height:var(--space-3)}
  .waveform{position:absolute;z-index:2;left:var(--space-3);right:var(--space-3);top:50%;height:var(--space-6);display:flex;align-items:center;justify-content:center;gap:5px;transform:translateY(-50%)}
  .waveform span{width:4px;border-radius:var(--radius-full);background:var(--gold-2)}
  .waveform span:nth-child(5n+1){height:22%}.waveform span:nth-child(5n+2){height:54%}.waveform span:nth-child(5n+3){height:88%}.waveform span:nth-child(5n+4){height:65%}.waveform span:nth-child(5n){height:38%}
  .doc-preview{--doc-brand:var(--navy);--doc-soft:var(--card);position:absolute;z-index:2;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
  .doc-preview.doc-app-pdf{--doc-brand:#e4473c;--doc-soft:#fcebea}
  .doc-preview.doc-app-word{--doc-brand:#185abd;--doc-soft:#eaf2fc}
  .doc-preview.doc-app-excel{--doc-brand:#217346;--doc-soft:#e9f4ee}
  .doc-preview.doc-app-powerpoint{--doc-brand:#d24726;--doc-soft:#fbece7}
  .doc-preview-icon{position:relative;width:72px;height:72px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--doc-brand) 32%,transparent);border-radius:18px;background:var(--doc-soft);box-shadow:0 8px 22px rgba(31,38,71,.08);color:var(--doc-brand)}
  .doc-preview-icon svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transform:translate(5px,-4px)}
  .doc-app-mark{position:absolute;left:10px;bottom:9px;min-width:25px;height:22px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;border-radius:5px;background:var(--doc-brand);box-shadow:0 3px 8px color-mix(in srgb,var(--doc-brand) 24%,transparent);color:#fff;font-family:Arial,sans-serif;font-size:11px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .doc-preview strong{display:inline-flex;min-height:24px;align-items:center;padding:0 10px;border-radius:var(--radius-full);background:var(--doc-soft);font-family:var(--mono);font-size:var(--type-meta);font-weight:var(--weight-semibold);letter-spacing:.04em;color:var(--doc-brand);box-shadow:var(--shadow-1)}
  .media-card-body{display:grid;min-width:0;gap:var(--space-1);padding:var(--space-2)}
  .media-card-title{display:block;min-width:0;max-width:100%;overflow:hidden;font-family:var(--serif);font-size:var(--type-card-title);font-weight:var(--weight-semibold);line-height:1.4;white-space:nowrap;text-overflow:ellipsis}
  .preview-duration{position:absolute;z-index:3;right:8px;bottom:8px;display:inline-flex;min-height:24px;align-items:center;padding:0 8px;border:1px solid rgba(255,255,255,.22);border-radius:7px;background:rgba(24,29,54,.76);box-shadow:0 3px 10px rgba(15,19,37,.18);color:#fff;font-family:var(--mono);font-size:var(--type-meta);font-weight:var(--weight-semibold);line-height:1;backdrop-filter:blur(6px)}
  .media-actions{position:relative;min-height:var(--space-5)}
  .media-actions .qj-btn,.brand-card-actions .qj-btn{width:auto}
  .more-menu{position:absolute;z-index:8;right:0;bottom:calc(100% + var(--space-1));display:none;min-width:132px;padding:var(--space-1);border:1px solid var(--line);border-radius:var(--radius-md);background:var(--card);box-shadow:var(--shadow-2)}
  .more-menu.is-open{display:grid}
  .more-menu button{min-height:var(--space-4);padding:0 var(--space-1);border-radius:var(--radius-sm);background:transparent;color:var(--ink2);font-size:var(--type-meta);text-align:left;cursor:pointer}
  .more-menu button:hover{background:var(--gold-soft);color:var(--gold-deep)}
  .more-menu button.is-danger:hover{background:var(--err-soft);color:var(--err)}
  .empty-card,.error-card{grid-column:1/-1}
  .skeleton-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-2)}
  .skeleton-card{height:310px;border-radius:var(--radius-md);background:linear-gradient(90deg,var(--card-2),var(--card),var(--card-2));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
  @keyframes shimmer{to{background-position:-200% 0}}

  .dialog-form{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
  .dialog-form .is-full{grid-column:1/-1}
  .field-error{display:none;font-size:var(--type-meta);color:var(--err);line-height:1.5}
  .qj-field.is-invalid .field-error{display:block}
  .qj-field.is-invalid .qj-input,.qj-field.is-invalid .qj-select{border-color:var(--err)}
  .check-list{display:grid;gap:var(--space-1)}
  .check-option{display:flex;align-items:center;gap:var(--space-1);min-height:var(--space-5);padding:0 var(--space-1);border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);font-size:var(--type-body);cursor:pointer}
  .check-option span{margin-left:auto;font-family:var(--mono);font-size:var(--type-meta);color:var(--ink3)}
  .dialog-foot{display:flex;justify-content:flex-end;gap:var(--space-1);padding-top:var(--space-3)}
  .detail-list{display:grid;grid-template-columns:120px minmax(0,1fr);font-size:var(--type-body)}
  .detail-list dt,.detail-list dd{padding:var(--space-1) 0;border-bottom:1px solid var(--line)}
  .detail-list dt{color:var(--ink3)}.detail-list dd{color:var(--ink2)}
  .reference-success{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2);border-radius:var(--radius-md);background:var(--ok-soft);color:var(--ok);font-size:var(--type-body)}

  @media(max-width:1100px){
    .brand-assets-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .media-grid,.skeleton-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  }
  @media(max-width:900px){
    .brand-layout{grid-template-columns:1fr}
    .brand-sidebar{position:static}
    .brand-tree{grid-template-columns:repeat(2,minmax(0,1fr))}
    .brand-node.is-active{grid-column:1/-1}
    .project-tree{grid-template-columns:repeat(2,minmax(0,1fr))}
    .media-grid,.skeleton-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .library-switch{grid-template-columns:1fr}
  }
  @media(max-width:680px){
    .bar{padding:0 var(--space-2);gap:var(--space-1)}
    .brand .brand-name,.team,.quota,.me .mt,.me .caret{display:none}
    .bar .credits{margin-left:0;border:1px solid var(--line);border-radius:var(--radius-md)}
    .me{padding:3px}
    .layout{display:block;height:calc(100dvh - 62px)}
    .layout > .page{height:100%}
    .nav{display:none}
    .inner{padding:var(--space-3) var(--space-2) var(--space-page-b)}
    .asset-page-head{align-items:flex-start}
    .asset-title-icon{display:none}
    .asset-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
    .asset-tabs .qj-tab{min-width:0;padding:0 var(--space-1)}
    .brand-tree,.project-tree,.brand-assets-grid,.media-grid,.skeleton-grid,.dialog-form{grid-template-columns:1fr}
    .brand-node.is-active{grid-column:auto}
    .brand-hero{align-items:flex-start;flex-wrap:wrap}
    .brand-hero .brand-mark{width:var(--space-6);height:var(--space-6)}
    .brand-hero-copy{width:calc(100% - var(--space-8))}
    .hero-actions{width:100%;justify-content:stretch}
    .hero-actions .qj-btn,.collection-tools .qj-btn{flex:1;width:auto}
    .filter-row{align-items:stretch}
    .filter-row .qj-search{margin-left:0;width:100%}
    .batch-count{width:100%;order:3}
    .media-preview{height:210px}
    .dialog-form .is-full{grid-column:auto}
    .detail-list{grid-template-columns:1fr}
    .detail-list dt{padding-bottom:0;border-bottom:0}
  }
</style>
<style>
  /* 视觉回归：沿用旧资产页与洞察页的紧凑工作台语言 */
  .inner{width:100%;max-width:none;padding:24px clamp(26px,4%,60px) 82px}
  .asset-page-head{justify-content:flex-start;margin-bottom:4px}
  .asset-title-wrap{gap:var(--space-1)}
  .asset-title-icon{width:22px;height:22px;border-radius:0;background:transparent;color:var(--gold-deep);box-shadow:none}
  .asset-title-icon svg{width:20px;height:20px}
  .asset-tabs-row{display:flex;align-items:stretch;width:100%;margin-bottom:18px;border-bottom:1px solid var(--line)}
  .asset-tabs{display:flex;min-width:0;flex:1;gap:4px;padding:0;margin-bottom:0;border:0;border-radius:0;background:transparent}
  .asset-tabs .qj-tab{position:relative;min-width:0;height:auto;padding:10px 16px 12px;border-radius:0;background:transparent;color:var(--ink3);box-shadow:none;white-space:nowrap}
  .asset-tabs .qj-tab:hover{color:var(--ink)}
  .asset-tabs .qj-tab.is-active{background:transparent;color:var(--gold-deep);box-shadow:none}
  .asset-tabs .qj-tab.is-active::after{content:"";position:absolute;right:15px;bottom:-1px;left:15px;height:2px;border-radius:var(--radius-full);background:var(--gold)}
  .asset-tab-upload{width:auto;min-height:36px;margin:0 0 6px auto;padding:0 14px;align-self:center}
  .asset-tab-upload[hidden]{display:none}
  .collection-head-mobile{display:none}
  .asset-stage{min-height:460px}

  @media(min-width:681px){
    .nav{position:fixed;z-index:90;top:62px;bottom:0;left:0;width:80px;height:auto;background:var(--bg)}
  }

  .brand-layout{grid-template-columns:248px minmax(0,1fr);gap:var(--space-2);align-items:stretch}
  .brand-sidebar{position:sticky;top:0;min-height:calc(100dvh - 224px);max-height:calc(100dvh - 224px);padding:10px;overflow-y:auto;border-radius:15px}
  .sidebar-head{padding:6px 6px 10px}
  .sidebar-head h2{flex:none;font-size:var(--type-card-title)}
  .sidebar-head .qj-btn{width:auto;min-height:var(--space-4);padding:0 10px}
  .brand-list-search{width:100%;height:36px;margin-bottom:8px}
  .brand-tree{gap:4px}
  .brand-node,.brand-node.is-active{border:0;background:transparent}
  .brand-row-wrap{position:relative;display:flex;align-items:center;border:1px solid transparent;border-radius:9px}

  function productNameFromAsset(asset,brand){
    var raw=stripFileExtension(asset.fileName||asset.name).replace(brand.name,"").replace(/产品信息总表|产品信息|产品责任表|责任表|参数表|配置表|规格书|说明书|手册|产品/gi,"").replace(/[·_\-]+/g," ").trim();
    return (brand.name+" "+(raw||"产品")).replace(/\s+/g," ").trim();
  }

  function productFromKnowledgeAsset(asset,brand){

      source:"知识库识别",

      sourceName:asset.name,

      needsReview:!isS7

  function brandPlanSourceSummary(brand){
    var assets=data.brandAssets.filter(function(asset){return asset.brandId===brand.id});
    var knowledge=assets.filter(function(asset){return asset.category==="product"}).length;
    var media=assets.filter(function(asset){return asset.category==="campaign"}).length;
    if(!knowledge&&!media){return "暂未检测到品牌知识库或品牌素材库，当前为品牌信息初始草案"}
    var parts=[];
    if(knowledge){parts.push(knowledge+" 项品牌知识库")}
    if(media){parts.push(media+" 项品牌素材库")}
    return "根据 "+parts.join("、")+"自动分析生成";
  }

      title:"我的素材",

      groupKey:"materialGroup",
      dateKey:null,
      searchKey:"materialSearch",
      tagKey:"materialTagFilters",
      expandedKey:"materialFiltersExpanded",
      selected:state.selectedMaterials,
      groups:data.materialGroups
    }:{
      title:"我生成的",

      typeKey:"generatedType",

      tagKey:"generatedTagFilters",
      expandedKey:"generatedFiltersExpanded",

  function matchesGeneratedDate(item,range){
    if(range==="all"){return true}
    var latest=data.generated.reduce(function(max,entry){return Math.max(max,Date.parse(entry.time.replace(" ","T")))},0);
    var current=Date.parse(item.time.replace(" ","T"));
    var ageDays=(latest-current)/(24*60*60*1000);
    if(range==="today"){return ageDays<1&&new Date(current).toDateString()===new Date(latest).toDateString()}
    if(range==="7d"){return ageDays<7}
    if(range==="30d"){return ageDays<30}
    return true;
  }

  function filteredItems(kind){
    var config=collectionConfig(kind);
    var type=state[config.typeKey];
    var group=state[config.groupKey];
    var query=state[config.searchKey].trim().toLowerCase();
    var selectedTags=state[config.tagKey];
    return config.items.filter(function(item){
      var typeMatch=type==="all"||item.type===type;
      var groupMatch=group==="all"||item.group===group;
      var dateMatch=kind!=="generated"||matchesGeneratedDate(item,state.generatedDate);
      var searchText=String(item.name||"").toLowerCase();
      var itemTags=item.filterTags||[];
      var tagMatch=tagFacets.every(function(facet){
        var selectedInFacet=facet.options.filter(function(option){return selectedTags.has(option)});
        return !selectedInFacet.length||selectedInFacet.some(function(option){return itemTags.indexOf(option)>-1});
      });
      return typeMatch&&groupMatch&&dateMatch&&tagMatch&&(!query||searchText.indexOf(query)>-1);
    });
  }

      var count=all?config.items.length:config.items.filter(function(item){return item.group===group}).length;

    return '<aside class="qj-card material-group-sidebar"><div class="material-group-head"><h2>分组</h2><button class="qj-btn qj-btn-primary qj-btn-sm" type="button" data-action="create-group" data-kind="'+kind+'">新建分组</button></div><nav class="material-group-list" aria-label="'+config.title+'分组">'+rows+'</nav></aside>';
  }

  function renderTagFilterPanel(kind,config){
    if(!state[config.expandedKey]){return ""}

    var rows=tagFacets.map(function(facet){
      var options=facet.options.map(function(option){
        var active=selected.has(option);
        return '<button class="qj-chip '+(active?"is-active":"")+'" type="button" data-action="filter-tag" data-kind="'+kind+'" data-id="'+option+'" aria-pressed="'+(active?"true":"false")+'">'+option+'</button>';
      }).join("");

    }).join("");
    return '<div class="tag-filter-panel" role="group" aria-label="标签筛选">'+rows+'</div>';

  function renderPreview(item,kind){
    var kindBadge=badge(typeNames[item.type],"gold");
    var previewAction=(item.type==="image"||item.type==="video")?' role="button" tabindex="0" data-action="'+(kind==="brand"?"open-brand-asset":"preview-media")+'" '+(kind==="brand"?'':'data-kind="'+kind+'" ')+'data-id="'+item.id+'" aria-label="全屏预览 '+esc(item.name)+'"':"";
    if(item.type==="video"){
      return '<div class="media-preview tone-'+esc(item.tone)+'"'+previewAction+'>'+(item.cover?'<img class="preview-image" src="'+esc(item.cover)+'" alt="">':"")+'<span class="preview-kind">'+kindBadge+'</span><span class="preview-center"><span class="play-button">'+icon("i-video")+'</span></span><span class="preview-duration" aria-label="时长 '+esc(item.duration||"00:00")+'">'+esc(item.duration||"00:00")+'</span></div>';
    }
    if(item.type==="audio"){
      return '<div class="media-preview tone-'+esc(item.tone)+'"><span class="preview-kind">'+kindBadge+'</span><span class="waveform"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><span class="preview-duration" aria-label="时长 '+esc(item.duration||"00:00")+'">'+esc(item.duration||"00:00")+'</span></div>';
    }
    if(item.type==="document"){
      var extMatch=String(item.fileName||item.name).match(/\.([a-z0-9]+)$/i);
      var ext=extMatch?extMatch[1].toUpperCase():"DOC";
      var app=ext==="PDF"?"pdf":ext==="DOC"||ext==="DOCX"?"word":ext==="XLS"||ext==="XLSX"?"excel":ext==="PPT"||ext==="PPTX"?"powerpoint":"generic";
      var mark=app==="pdf"?"PDF":app==="word"?"W":app==="excel"?"X":app==="powerpoint"?"P":"DOC";
      return '<div class="media-preview tone-paper" role="button" tabindex="0" data-action="'+(kind==="brand"?"open-brand-asset":"open-document")+'" '+(kind==="brand"?'':'data-kind="'+kind+'" ')+'data-id="'+item.id+'" aria-label="打开文档 '+esc(item.name)+'"><span class="preview-kind">'+kindBadge+'</span><span class="doc-preview doc-app-'+app+'"><span class="doc-preview-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M13.5 5.5h13l8 8v29h-21z"/><path d="M26.5 5.5v8h8"/><path d="M19 24h10M19 31h8"/></svg><span class="doc-app-mark">'+mark+'</span></span><strong>'+esc(ext)+'</strong></span></div>';
    }
    return '<div class="media-preview tone-'+esc(item.tone)+'"'+previewAction+'>'+(item.cover?'<img class="preview-image" src="'+esc(item.cover)+'" alt="">':"")+'<span class="preview-kind">'+kindBadge+'</span></div>';
  }

  function openDialog(title,body,confirmText,onConfirm,options){
    options=options||{};
    releaseDialogPreviewUrl();
    var sheet=overlay.querySelector(".qj-sheet");
    if(sheet){
      sheet.classList.toggle("is-project-manager",options.variant==="project-manager");
      sheet.classList.toggle("is-upload-dialog",options.variant==="upload-dialog");
      sheet.classList.toggle("is-brand-info",options.variant==="brand-info");
    }
    dialogTitle.textContent=title;
    dialogBody.innerHTML=body;
    dialogFoot.innerHTML='<button class="qj-btn qj-btn-secondary" type="button" data-dialog-cancel>'+esc(options.cancelText||"取消")+'</button>'+(confirmText?'<button class="qj-btn '+(options.danger?"qj-btn-secondary":"qj-btn-primary")+'" type="button" id="dialogConfirm">'+esc(confirmText)+'</button>':"");
    dialogConfirmHandler=onConfirm||null;
    overlay.hidden=false;
    document.body.style.overflow="hidden";
    dialogFoot.querySelector("[data-dialog-cancel]").addEventListener("click",options.onCancel||closeDialog);
    var confirm=document.getElementById("dialogConfirm");
    if(confirm){confirm.addEventListener("click",function(){if(dialogConfirmHandler){dialogConfirmHandler()}})}
    setTimeout(function(){
      var first=dialogBody.querySelector("input:not([type=checkbox]),select,textarea,button");
      if(first){first.focus()}else{dialogClose.focus()}
    },20);
  }
  function closeDialog(){
    releaseDialogPreviewUrl();

  function materialFileExtension(file){
    var name=file&&file.name?file.name:"";
    return name.indexOf(".")>-1?name.split(".").pop().toLowerCase():"";
  }
  function inferMaterialType(file){
    var mime=(file&&file.type||"").toLowerCase();
    var ext=materialFileExtension(file);
    if(mime.indexOf("image/")===0||["jpg","jpeg","png","gif","webp","bmp","svg","avif","heic"].indexOf(ext)>-1){return "image"}
    if(mime.indexOf("video/")===0||["mp4","mov","m4v","webm","avi","mkv"].indexOf(ext)>-1){return "video"}
    if(mime.indexOf("audio/")===0||["mp3","wav","aac","m4a","flac","ogg","wma"].indexOf(ext)>-1){return "audio"}
    return "document";
  }
  function materialDocumentInfo(file){
    var ext=materialFileExtension(file);
    if(ext==="pdf"){return {app:"pdf",mark:"PDF",label:"PDF 文档"}}
    if(ext==="doc"||ext==="docx"){return {app:"word",mark:"W",label:"Word 文档"}}
    if(ext==="xls"||ext==="xlsx"){return {app:"excel",mark:"X",label:"Excel 表格"}}
    if(ext==="ppt"||ext==="pptx"){return {app:"powerpoint",mark:"P",label:"PowerPoint 演示文稿"}}
    return {app:"generic",mark:(ext||"DOC").toUpperCase(),label:"文档"};
  }
  function stripFileExtension(name){return String(name||"").replace(/\.[^.]+$/,"")}
  function isOpaqueUploadFileName(name){
    var raw=stripFileExtension(name);
    var base=raw.replace(/[-_\s]/g,"");
    if(base.length<24){return false}
    if(/^[a-f0-9]+$/i.test(base)){return true}
    if(/[-_\s]/.test(raw)&&/[a-z]{3,}/i.test(raw)){return false}
    return base.length>=40&&/^[a-z0-9]+$/i.test(base)&&(/\d/g.test(base));
  }
  function uploadNameStamp(){
    var now=new Date();
    function two(value){return String(value).padStart(2,"0")}
    return now.getFullYear()+two(now.getMonth()+1)+two(now.getDate())+"-"+two(now.getHours())+two(now.getMinutes());
  }
  function friendlyUploadName(file,type,index,kind){
    var original=file&&file.name?file.name:"文件";
    if(!isOpaqueUploadFileName(original)){return kind==="brand"?stripFileExtension(original):original}
    var ext=materialFileExtension(file);
    var base=(typeNames[type]||"文件")+(kind==="brand"?"资产 ":"素材 ")+uploadNameStamp()+"-"+String(index+1).padStart(2,"0");
    return kind==="brand"||!ext?base:base+"."+ext;
  }
  function compactUploadFileName(name,limit){
    name=String(name||"");limit=limit||38;
    if(name.length<=limit){return name}
    var dot=name.lastIndexOf(".");
    var suffix=dot>0&&name.length-dot<=8?name.slice(dot):"";
    var headLength=Math.max(12,limit-suffix.length-1);
    return name.slice(0,headLength)+"…"+suffix;
  }

    }else if(entry.type==="audio"){

  function syncBatchUploadName(session){
    var field=session.nameFieldId?document.getElementById(session.nameFieldId):null;
    var input=session.nameInputId?document.getElementById(session.nameInputId):null;
    var companion=session.companionFieldId?document.getElementById(session.companionFieldId):null;
    var single=session.entries.length===1;
    if(field){field.hidden=!session.alwaysShowName&&!single}
    if(companion){companion.classList.toggle("is-full",!single)}
    if(!input){return}
    input.disabled=!!session.alwaysShowName&&session.entries.length>1;
    input.placeholder=input.disabled?"批量上传时按文件名自动识别":"例如：星澜 S7";
    if(single){
      if(input.dataset.userEdited!=="true"){
        input.value=friendlyUploadName(session.entries[0].file,session.entries[0].type,0,session.kind);
      }
    }else{
      input.value="";
      input.dataset.userEdited="false";
    }
  }
  function renderBatchUploadSession(session){
    if(activeDialogUpload!==session){return}
    var items=document.getElementById(session.prefix+"Items");
    var toolbar=document.getElementById(session.prefix+"Toolbar");
    var count=document.getElementById(session.prefix+"Count");
    var tileLabel=document.querySelector("#"+session.prefix+'Upload [data-batch-tile-label]');
    if(items){items.innerHTML=session.entries.map(batchUploadPreviewMarkup).join("")}
    if(toolbar){toolbar.hidden=!session.entries.length}
    if(count){count.textContent="已选择 "+session.entries.length+" 个文件"}
    if(tileLabel){tileLabel.textContent=session.entries.length?"继续添加":session.tileLabel}
    syncBatchUploadName(session);
  }
  function updateBatchDuration(session,entry){
    if(activeDialogUpload!==session){return}
    var badge=document.querySelector('[data-upload-duration="'+entry.id+'"]');
    if(badge){badge.textContent=entry.duration;badge.hidden=!entry.duration}

  function readBatchMediaDuration(session,entry){
    var media=document.createElement(entry.type);
    media.preload="metadata";
    media.onloadedmetadata=function(){
      if(activeDialogUpload===session&&session.entries.indexOf(entry)>-1){entry.duration=formatDuration(media.duration);updateBatchDuration(session,entry)}
    };
    media.onerror=function(){
      if(activeDialogUpload===session&&session.entries.indexOf(entry)>-1){entry.duration="00:00";updateBatchDuration(session,entry)}
    };
    media.src=entry.url;
  }
  function setupBatchUploader(options){
    var input=document.getElementById(options.prefix+"File");
    var items=document.getElementById(options.prefix+"Items");
    var clear=document.getElementById(options.prefix+"Clear");
    var label=document.querySelector("#"+options.prefix+'Upload [data-batch-tile-label]');
    var session={kind:options.kind,prefix:options.prefix,tileLabel:label?label.textContent:"文件",entries:[],nameInputId:options.nameInputId||"",nameFieldId:options.nameFieldId||"",companionFieldId:options.companionFieldId||"",alwaysShowName:!!options.alwaysShowName};
    activeDialogUpload=session;
    if(options.nameInputId){
      document.getElementById(options.nameInputId).addEventListener("input",function(event){event.target.dataset.userEdited="true"});
    }
    input.addEventListener("change",function(){
      var incoming=Array.from(input.files||[]);
      var existing=new Set(session.entries.map(function(entry){return entry.file.name+"|"+entry.file.size+"|"+entry.file.lastModified}));
      var added=[];
      incoming.forEach(function(file){
        var key=file.name+"|"+file.size+"|"+file.lastModified;
        if(existing.has(key)){return}
        existing.add(key);
        var entry={id:uid("upload"),file:file,type:inferMaterialType(file),url:URL.createObjectURL(file),duration:""};
        session.entries.push(entry);added.push(entry);
      });
      input.value="";
      document.getElementById(options.prefix+"Upload").classList.remove("is-invalid");
      renderBatchUploadSession(session);
      added.forEach(function(entry){if(entry.type==="video"||entry.type==="audio"){readBatchMediaDuration(session,entry)}});
    });
    items.addEventListener("click",function(event){
      var remove=event.target.closest("[data-remove-upload]");
      if(!remove){return}
      var id=remove.getAttribute("data-remove-upload");
      var entry=session.entries.find(function(item){return item.id===id});
      if(entry&&entry.url.indexOf("blob:")===0){URL.revokeObjectURL(entry.url)}
      session.entries=session.entries.filter(function(item){return item.id!==id});
      renderBatchUploadSession(session);
    });
    clear.addEventListener("click",function(){
      session.entries.forEach(function(entry){if(entry.url.indexOf("blob:")===0){URL.revokeObjectURL(entry.url)}});
      session.entries=[];renderBatchUploadSession(session);
    });
    renderBatchUploadSession(session);
    return session;
  }

      mediaLightboxStage.innerHTML='<div class="media-lightbox-fallback">'+icon(item.type==="video"?"i-video":"i-image")+'<p>该素材暂无可用预览图</p></div>';
    }
    mediaLightbox.hidden=false;
    document.body.style.overflow="hidden";
    mediaLightboxClose.focus();
  }
  function closeMediaPreview(){
    if(mediaLightbox.hidden){return}
    mediaLightbox.hidden=true;
    mediaLightboxStage.innerHTML="";
    if(mediaPreviewTemporaryUrl){URL.revokeObjectURL(mediaPreviewTemporaryUrl);mediaPreviewTemporaryUrl=""}
    document.body.style.overflow="";
    if(mediaPreviewTrigger&&document.contains(mediaPreviewTrigger)){mediaPreviewTrigger.focus()}
    mediaPreviewTrigger=null;
  }
  function downloadItem(kind,id){
    var item=findItem(kind,id);
    if(!item){return}
    if(item.fileUrl){
      var sourceLink=document.createElement("a");sourceLink.href=item.fileUrl;sourceLink.download=item.fileName||item.name;document.body.appendChild(sourceLink);sourceLink.click();sourceLink.remove();toast("下载已开始");return;
    }
    var content="奇境AI 资产原型下载信息\n名称："+item.name+"\n类型："+typeNames[item.type]+"\n分组："+item.group;
    var blob=new Blob([content],{type:"text/plain;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var link=document.createElement("a");
    link.href=url;link.download=item.name+".txt";document.body.appendChild(link);link.click();link.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
    toast("下载已开始");
  }
  function openDeleteItem(kind,id){
    var item=findItem(kind,id);
    if(!item){return}
    openDialog("删除素材",
      '<p class="qj-copy">确认删除“'+esc(item.name)+'”？此操作不可撤销。</p>',
      "确认删除",function(){
        releaseItemFile(item);
        if(kind==="materials"){data.materials=data.materials.filter(function(entry){return entry.id!==id});state.selectedMaterials.delete(id)}
        else{data.generated=data.generated.filter(function(entry){return entry.id!==id});state.selectedGenerated.delete(id)}
        closeDialog();render();toast("素材已删除");
      },{danger:true}
    );
  }
  function openReference(kind,id){
    var item=findItem(kind,id);
    if(!item||item.type==="document"){return}
    openDialog(referenceNames[item.type],
      '<div class="reference-success">'+badge(typeNames[item.type],"ok")+'“'+esc(item.name)+'”已加入创作参考。</div>',
      "进入创作",function(){location.href="奇境-创作-Agent-v1.html?reference="+encodeURIComponent(item.id)}
    );
  }
  function openSameStyle(id){
    var item=data.generated.find(function(entry){return entry.id===id});
    if(!item){return}
    openDialog("做同款",
      '<div class="dialog-form"><label class="qj-field is-full"><span class="qj-label">参考成品</span><input class="qj-input" value="'+esc(item.name)+'" readonly></label><label class="qj-field is-full"><span class="qj-label">提示词</span><textarea class="qj-textarea" id="sameStylePrompt">'+esc(item.prompt)+'</textarea><span class="field-error">请输入提示词</span><span class="qj-help">将复用原任务的模型与主要参数。</span></label></div>',
      "进入创作",function(){
        var prompt=document.getElementById("sameStylePrompt").value.trim();
        if(!prompt){showFieldError("sameStylePrompt","请输入提示词");return}
        location.href="奇境-创作-Agent-v1.html?remix="+encodeURIComponent(item.taskId);
      }
    );
  }
  function taskDetailFact(label,value){
    return '<div class="task-detail-fact"><dt>'+esc(label)+'</dt><dd>'+esc(value)+'</dd></div>';
  }
  function taskDetailReferenceIds(item){
    return ({"g-1":["m-1"],"g-2":["m-1"],"g-4":["m-5"],"g-5":["m-2"]})[item.id]||[];
  }
  function taskDetailReferenceMarkup(item){
    var references=taskDetailReferenceIds(item).map(function(id){
      return data.materials.find(function(material){return material.id===id});
    }).filter(function(material){return material&&material.cover});
    if(!references.length){
      return '<section class="task-detail-section"><h4>参考素材</h4><p class="task-detail-reference-empty">本次创作未使用参考素材</p></section>';
    }
    return '<section class="task-detail-section"><h4>参考素材</h4><div class="task-detail-references">'+references.map(function(reference,index){
      var mediaClass=reference.type==="video"?" is-video":" is-image";
      return '<span class="task-detail-reference'+mediaClass+'" tabindex="0" aria-label="预览第 '+(index+1)+' 个'+typeNames[reference.type]+'参考素材"><img src="'+esc(reference.cover)+'" alt=""><span class="task-detail-reference-preview" aria-hidden="true"><img src="'+esc(reference.cover)+'" alt=""></span></span>';
    }).join("")+'</div></section>';
  }
  function taskDetailMode(item){
    if(item.type==="video"){return "图生视频"}
    if(item.type==="audio"){return "文本转语音"}
    return taskDetailReferenceIds(item).length?"图生图":"文生图";
  }
  function taskDetailSpec(item){
    if(item.type==="video"){
      var ratio=item.tags.indexOf("16:9")>-1?"16:9":"9:16";
      return ratio+" · 1080P · "+(item.duration||"00:15");
    }
    if(item.type==="audio"){return "中文 · 48 kHz · "+(item.duration||"00:10")}
    return "1:1 · 高清 2K · 1 张";
  }
  function taskDetailPoints(item){return item.type==="video"?"20":(item.type==="audio"?"2":"4")}
  function taskDetailReferenceLabel(item){return item.type==="video"?"做参考视频":(item.type==="audio"?"做参考音频":"做参考图")}
  function taskDetailMediaMarkup(item){
    if(item.type==="audio"){
      return '<section class="task-detail-visual" aria-label="音频创作结果预览"><div class="task-detail-stage"><div class="task-detail-audio-card tone-'+esc(item.tone)+'" role="img" aria-label="音频结果预览"><span class="task-detail-audio-wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></span><span class="task-detail-duration">'+esc(item.duration||"00:00")+'</span></div></div></section>';
    }
    return '<section class="task-detail-visual" aria-label="'+typeNames[item.type]+'创作结果预览"><div class="task-detail-stage '+(item.type==="video"?"is-video":"is-image")+'"><img src="'+esc(item.cover||"")+'" alt="'+esc(item.name)+'">'+(item.type==="video"?'<span class="task-detail-duration">'+esc(item.duration||"00:00")+'</span>':"")+'</div></section>';
  }
  function copyTaskText(text){
    if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(text)}
    var input=document.createElement("textarea");
    input.value=text;input.setAttribute("readonly","");input.style.position="fixed";input.style.opacity="0";
    document.body.appendChild(input);input.select();
    try{document.execCommand("copy")}catch(error){}
    input.remove();
    return Promise.resolve();
  }
  function renderTaskDetail(){
    var item=data.generated.find(function(entry){return entry.id===taskDetailItemId});
    if(!item){closeTaskDetail(false);return}
    clearTimeout(taskDetailDeleteTimer);
    taskDetailTitle.textContent="创作详情 · "+item.taskId;
    var detailKindTitle=item.type==="audio"?"音频创作":(item.type==="video"?"视频创作":"图片创作");
    var facts=taskDetailFact("模型",item.model+" · "+taskDetailMode(item))+
      taskDetailFact("生成参数",taskDetailSpec(item))+
      taskDetailFact("任务 ID",item.taskId)+
      taskDetailFact("创建时间",item.time)+
      taskDetailFact("提交人","一琳")+
      taskDetailFact("消耗积分",taskDetailPoints(item)+" 积分");
    var downloadIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7.5 10.5 4.5 4.5 4.5-4.5"></path><path d="M5 20h14"></path></svg>';
    var deleteIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="m7 7 1 13h8l1-13"></path><path d="M10 11v5M14 11v5"></path></svg>';
    var actions='<div class="task-detail-actions"><button class="qj-btn qj-btn-primary task-detail-reference-action" type="button" data-detail-action="reference">'+taskDetailReferenceLabel(item)+'</button><button class="qj-btn task-detail-icon-action" type="button" data-detail-action="download" data-tooltip="下载结果" aria-label="下载结果">'+downloadIcon+'</button><button class="qj-btn task-detail-icon-action task-detail-delete" type="button" data-detail-action="delete" data-tooltip="删除任务" aria-label="删除任务">'+deleteIcon+'</button><span class="task-detail-delete-hint" data-detail-delete-hint hidden>再次点击删除图标确认，删除后无法恢复</span></div>';
    var info='<aside class="task-detail-info"><div class="task-detail-info-scroll"><div class="task-detail-summary"><div class="task-detail-summary-top"><h3>'+detailKindTitle+'</h3><span class="task-status">成功</span></div></div>'+taskDetailReferenceMarkup(item)+'<section class="task-detail-section"><div class="task-detail-section-head"><h4>提示词</h4><button class="qj-btn qj-btn-ghost task-detail-copy-action" type="button" data-detail-action="copy">复制提示词</button></div><p class="task-detail-prompt">'+esc(item.prompt)+'</p></section><section class="task-detail-section"><h4>基本信息</h4><dl class="task-detail-facts">'+facts+'</dl></section></div>'+actions+'</aside>';
    taskDetailContent.innerHTML=taskDetailMediaMarkup(item)+info;
  }
  function openTask(id,trigger){
    var item=data.generated.find(function(entry){return entry.id===id});
    if(!item){return}
    document.querySelectorAll(".more-menu.is-open").forEach(function(menu){menu.classList.remove("is-open")});
    taskDetailItemId=id;
    taskDetailReturnFocus=trigger||document.activeElement;
    renderTaskDetail();
    taskDetailOverlay.hidden=false;
    document.documentElement.classList.add("task-detail-lock");
    document.body.classList.add("task-detail-lock");
    requestAnimationFrame(function(){taskDetailClose.focus()});
  }
  function closeTaskDetail(restoreFocus){
    if(taskDetailOverlay.hidden){return}
    clearTimeout(taskDetailDeleteTimer);
    taskDetailOverlay.hidden=true;
    taskDetailContent.innerHTML="";
    taskDetailItemId="";
    document.documentElement.classList.remove("task-detail-lock");
    document.body.classList.remove("task-detail-lock");
    var focusTarget=taskDetailReturnFocus;
    taskDetailReturnFocus=null;
    if(restoreFocus!==false&&focusTarget&&document.contains(focusTarget)){focusTarget.focus()}
  }

  document.querySelectorAll("[data-view]").forEach(function(tab){
    tab.addEventListener("click",function(){setView(tab.getAttribute("data-view"))});
  });
  assetUploadButton.addEventListener("click",openUploadMaterial);
  document.querySelector('[data-view="'+state.view+'"]').classList.add("is-active");
  document.querySelectorAll("[data-view]").forEach(function(tab){
    var active=tab.getAttribute("data-view")===state.view;
    tab.classList.toggle("is-active",active);
    tab.setAttribute("aria-selected",active?"true":"false");
  });

  app.addEventListener("click",function(event){
    var actionElement=event.target.closest("[data-action]");
    if(!actionElement){return}
    var action=actionElement.getAttribute("data-action");
    var id=actionElement.getAttribute("data-id");
    var kind=actionElement.getAttribute("data-kind");
    if(action==="select-brand"){state.selectedBrand=id;state.selectedProject=null;render()}
    if(action==="select-project"){state.selectedProject=id==="all"?null:id;render()}
    if(action==="select-library"){state.library=id;render()}
    if(action==="edit-plan-definition"){openPlanDefinitionEditor()}
    if(action==="edit-plan-visual"){openPlanVisualEditor()}
    if(action==="edit-plan-words"){openPlanWordsEditor()}
    if(action==="analyze-products"){analyzeProductsFromKnowledge(actionElement)}
    if(action==="upload-product-info"){openUploadProductInfo()}
    if(action==="edit-product"){openProductEditor(id)}
    if(action==="delete-product"){openDeleteProduct(id)}
    if(action==="reanalyze-plan"){reanalyzeBrandPlan(actionElement)}
    if(action==="new-brand"){openNewBrand()}
    if(action==="edit-brand"){openEditBrand()}
    if(action==="delete-brand"){openDeleteBrand()}
    if(action==="edit-brand-list"){openEditBrand(id)}
    if(action==="delete-brand-list"){openDeleteBrand(id)}
    if(action==="brand-info"){openBrandInfo()}
    if(action==="manage-projects"){openProjectManager()}
    if(action==="new-project"){openProjectForm(null)}
    if(action==="edit-project"){openProjectForm(currentBrand().projects.find(function(item){return item.id===id}))}
    if(action==="delete-project"){openDeleteProject(id)}
    if(action==="upload-brand-asset"){openUploadBrandAsset()}
    if(action==="link-brand-asset"){openLinkBrandAsset()}
    if(action==="open-brand-asset"){openBrandAssetFile(id,actionElement)}
    if(action==="reference-brand-asset"){
      var referenceAsset=data.brandAssets.find(function(item){return item.id===id});
      var referenceType=referenceAsset?previewResourceKind(referenceAsset):"";
      if(referenceAsset&&referenceNames[referenceType]){toast("已设为"+referenceNames[referenceType].replace("做",""))}
    }
    if(action==="download-brand-asset"){downloadBrandAsset(id)}
    if(action==="delete-brand-asset"){openDeleteBrandAsset(id)}
    if(action==="upload-material"){openUploadMaterial()}
    if(action==="select-collection-group"){
      var groupConfig=collectionConfig(kind);state[groupConfig.groupKey]=id;render();
    }
    if(action==="edit-collection-group"){openEditCollectionGroup(kind,id)}
    if(action==="delete-collection-group"){openDeleteCollectionGroup(kind,id)}
    if(action==="filter-type"){
      var config=collectionConfig(kind);state[config.typeKey]=id;render();
    }
    if(action==="toggle-tag-filters"){
      var filterConfig=collectionConfig(kind);state[filterConfig.expandedKey]=!state[filterConfig.expandedKey];render();
    }
    if(action==="filter-tag"){
      var tagConfig=collectionConfig(kind);var selectedTags=state[tagConfig.tagKey];if(selectedTags.has(id)){selectedTags.delete(id)}else{selectedTags.add(id)}render();
    }
    if(action==="clear-filters"){
      var clearConfig=collectionConfig(kind);state[clearConfig.typeKey]="all";state[clearConfig.groupKey]="all";state[clearConfig.searchKey]="";state[clearConfig.tagKey].clear();if(kind==="generated"){state.generatedDate="all"}render();
    }
    if(action==="cancel-selection"){collectionConfig(kind).selected.clear();render()}
    if(action==="create-group"){openCreateGroup(kind)}
    if(action==="batch-group"){openBatchGroup(kind)}
    if(action==="batch-delete"){openBatchDelete(kind)}
    if(action==="toggle-more"){
      event.stopPropagation();
      var menu=actionElement.parentElement.querySelector(".more-menu");
      document.querySelectorAll(".more-menu.is-open").forEach(function(item){if(item!==menu){item.classList.remove("is-open")}});
      menu.classList.toggle("is-open");
    }
    if(action==="download"){downloadItem(kind,id)}
    if(action==="open-document"){openMaterialDocument(kind,id,actionElement)}
    if(action==="preview-media"){openMediaPreview(kind,id,actionElement)}
    if(action==="delete-item"){openDeleteItem(kind,id)}
    if(action==="reference"){openReference(kind,id)}
    if(action==="same-style"){openSameStyle(id)}
    if(action==="view-task"){openTask(id,actionElement)}
    if(action==="retry-demo"){clearDemo();render()}
    if(action==="empty-action"){
      clearDemo();render();
      if(state.view==="brand"){openNewBrand()}
      if(state.view==="materials"){openUploadMaterial()}
      if(state.view==="generated"){location.href="奇境-创作-Agent-v1.html"}
    }
  });
  app.addEventListener("keydown",function(event){
    var preview=event.target.closest('[data-action="preview-media"],[data-action="open-document"],[data-action="open-brand-asset"]');
    if(!preview||(event.key!=="Enter"&&event.key!==" ")){return}
    event.preventDefault();
    if(preview.getAttribute("data-action")==="open-document"){
      openMaterialDocument(preview.getAttribute("data-kind"),preview.getAttribute("data-id"),preview);
      return;
    }
    if(preview.getAttribute("data-action")==="open-brand-asset"){
      openBrandAssetFile(preview.getAttribute("data-id"),preview);
      return;
    }
    openMediaPreview(preview.getAttribute("data-kind"),preview.getAttribute("data-id"),preview);
  });
  app.addEventListener("change",function(event){
    var action=event.target.getAttribute("data-action");
    var kind=event.target.getAttribute("data-kind");
    if(action==="filter-group"){
      var config=collectionConfig(kind);state[config.groupKey]=event.target.value;render();
    }
    if(action==="filter-date"){state.generatedDate=event.target.value;render()}
    if(action==="toggle-select"){
      var selectConfig=collectionConfig(kind);
      if(event.target.checked){selectConfig.selected.add(event.target.getAttribute("data-id"))}
      else{selectConfig.selected.delete(event.target.getAttribute("data-id"))}
      render();
    }
    if(action==="select-all"){
      var allConfig=collectionConfig(kind);
      filteredItems(kind).forEach(function(item){if(event.target.checked){allConfig.selected.add(item.id)}else{allConfig.selected.delete(item.id)}});
      render();
    }
  });
  app.addEventListener("input",function(event){
    if(event.target.getAttribute("data-action")==="search-brand"){
      state.brandSearch=event.target.value;
      render();
      var brandInput=app.querySelector('[data-action="search-brand"]');
      if(brandInput){brandInput.focus();brandInput.setSelectionRange(state.brandSearch.length,state.brandSearch.length)}
      return;
    }
    if(event.target.getAttribute("data-action")!=="search"){return}
    var kind=event.target.getAttribute("data-kind");
    var config=collectionConfig(kind);
    state[config.searchKey]=event.target.value;
    var grid=document.getElementById("mediaGrid");
    var items=filteredItems(kind);
    grid.classList.toggle("is-empty",items.length===0);
    grid.innerHTML=items.length?items.map(function(item){return renderMediaCard(item,kind,config.selected.has(item.id))}).join(""):renderAssetEmpty("没有找到匹配的素材","请调整筛选条件后重试。",'<button class="qj-btn qj-btn-secondary qj-btn-sm" type="button" data-action="clear-filters" data-kind="'+kind+'">清除筛选</button>');
  });
  app.addEventListener("click",function(event){
    if(!event.target.closest(".media-actions")){document.querySelectorAll(".more-menu.is-open").forEach(function(menu){menu.classList.remove("is-open")})}
  });
  overlay.addEventListener("click",function(event){if(event.target===overlay){closeDialog()}});
  dialogClose.addEventListener("click",closeDialog);
  mediaLightbox.addEventListener("click",function(event){if(event.target===mediaLightbox||event.target===mediaLightboxStage){closeMediaPreview()}});
  mediaLightboxClose.addEventListener("click",closeMediaPreview);
  mediaLightboxStage.addEventListener("click",function(event){
    var button=event.target.closest("[data-preview-download]");
    if(!button){return}
    event.stopPropagation();
    var scope=button.getAttribute("data-preview-download");
    var id=button.getAttribute("data-id");
    if(scope==="brand"){downloadBrandAsset(id)}else{downloadItem(scope,id)}
  });
  taskDetailClose.addEventListener("click",function(){closeTaskDetail()});
  taskDetailOverlay.addEventListener("click",function(event){if(event.target===taskDetailOverlay){closeTaskDetail()}});
  taskDetailContent.addEventListener("click",function(event){
    var actionButton=event.target.closest("[data-detail-action]");
    if(!actionButton){return}
    var item=data.generated.find(function(entry){return entry.id===taskDetailItemId});
    if(!item){return}
    var action=actionButton.getAttribute("data-detail-action");
    if(action==="download"){downloadItem("generated",item.id);return}
    if(action==="reference"){toast("已设为"+taskDetailReferenceLabel(item));return}
    if(action==="copy"){
      copyTaskText(item.prompt).then(function(){toast("提示词已复制")}).catch(function(){toast("复制失败，请重试","err")});
      return;
    }
    if(action==="delete"){
      if(actionButton.getAttribute("data-confirming")!=="true"){
        actionButton.setAttribute("data-confirming","true");
        actionButton.classList.add("is-confirming");
        actionButton.setAttribute("data-tooltip","再次点击确认删除");
        actionButton.setAttribute("aria-label","再次点击确认删除任务");
        var hint=taskDetailContent.querySelector("[data-detail-delete-hint]");
        if(hint){hint.hidden=false}
        clearTimeout(taskDetailDeleteTimer);
        taskDetailDeleteTimer=setTimeout(function(){if(!taskDetailOverlay.hidden){renderTaskDetail()}},5000);
        return;
      }
      data.generated=data.generated.filter(function(entry){return entry.id!==item.id});
      state.selectedGenerated.delete(item.id);
      closeTaskDetail(false);
      render();
      toast("创作任务已删除");
    }
  });
  dialogBody.addEventListener("click",function(event){
    var brandInfoControl=event.target.closest("[data-brand-info-action]");
    if(brandInfoControl){
      var key=brandInfoControl.getAttribute("data-key");
      var brandInfoAction=brandInfoControl.getAttribute("data-brand-info-action");
      if(brandInfoAction==="edit"){openBrandInfo(key)}
      if(brandInfoAction==="save"){saveBrandInfoInline(key)}
      if(brandInfoAction==="cancel"){openBrandInfo()}
      if(brandInfoAction==="source"){openBrandInfoSource(key)}
      return;
    }
    var control=event.target.closest("[data-project-action]");
    if(!control){return}
    var project=currentBrand().projects.find(function(item){return item.id===control.getAttribute("data-id")});
    if(!project){return}
    if(control.getAttribute("data-project-action")==="edit"){openProjectForm(project)}
    if(control.getAttribute("data-project-action")==="delete"){openDeleteProject(project.id)}
  });
  dialogBody.addEventListener("input",clearFieldError);
  dialogBody.addEventListener("change",clearFieldError);
  document.addEventListener("click",function(event){
    document.querySelectorAll(".project-multi-select.is-open").forEach(function(root){
      if(!root.contains(event.target)){closeProjectMultiSelect(root)}
    });
  });
  document.addEventListener("keydown",function(event){
    if(!taskDetailOverlay.hidden){
      if(event.key==="Escape"){event.preventDefault();closeTaskDetail();return}
      if(event.key==="Tab"){
        var focusable=Array.from(taskDetailOverlay.querySelectorAll('button:not([disabled]),[href],[tabindex]:not([tabindex="-1"])')).filter(function(item){return !item.hidden&&item.offsetParent!==null});
        if(!focusable.length){return}
        var first=focusable[0];
        var last=focusable[focusable.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}
      }
      return;
    }
    if(event.key!=="Escape"){return}
    var openProjectSelect=document.querySelector(".project-multi-select.is-open");
    if(openProjectSelect){closeProjectMultiSelect(openProjectSelect);openProjectSelect.querySelector(".project-multi-trigger").focus();return}
    if(!mediaLightbox.hidden){closeMediaPreview();return}
    if(!overlay.hidden){closeDialog()}
  });

  render();
})();
</script>
