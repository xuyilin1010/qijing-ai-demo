  function reviews(){const rows=state.reviewItems;const statusName={pending:'待审核',approved:'已通过',rejected:'已驳回',exempt:'免人工审核'};view.innerHTML=`<div class="tool-row"><select class="filter-select" id="reviewFilter"><option value="all">全部审核状态</option><option value="pending">待审核</option><option value="approved">已通过</option><option value="rejected">已驳回</option><option value="exempt">免人工审核</option></select><input class="search" id="reviewSearch" placeholder="搜索内容或提交人" aria-label="搜索审核内容"><span class="spacer"></span><button class="small-btn" id="reviewInfo">审核规则</button></div><div class="section-card"><div class="table-head"><span>内容版本</span><span>提交人</span><span>自动合规</span><span>审核状态</span><span>提交时间</span><span>操作</span></div><div id="reviewRows">${rows.map(r=>`<div class="review-row" data-review="${r.id}"><div class="content-main"><span class="thumb ${r.thumb}"></span><span><b>${esc(r.title)}</b><span>${r.type} · ${r.version} · ${r.platform}</span></span></div><div>${esc(r.user)}<span class="sub">${r.needsReview?'需要人工审核':'免人工审核'}</span></div><div><span class="risk ${r.risk}">${r.risk==='pass'?'通过':r.risk==='warn'?'需确认':'阻断'}</span></div><div><span class="pill ${r.status}">${statusName[r.status]}</span></div><div>${r.time}</div><div class="review-actions">${r.status==='pending'?`<button class="small-btn" data-open-review="${r.id}">审核</button>`:r.status==='approved'?`<button class="small-btn" data-publish-review="${r.id}">去发布</button>`:`<button class="small-btn" data-open-review="${r.id}">查看</button>`}</div></div>`).join('')}</div></div>`;bindBase();const applyFilter=()=>{const f=$('#reviewFilter').value,q=$('#reviewSearch').value.trim().toLowerCase();document.querySelectorAll('.review-row').forEach(row=>{const r=state.reviewItems.find(x=>x.id===row.dataset.review);row.hidden=!( (f==='all'||r.status===f) && (!q||[r.title,r.user].join(' ').toLowerCase().includes(q)) )})};$('#reviewFilter').onchange=applyFilter;$('#reviewSearch').oninput=applyFilter;$('#reviewInfo').onclic   function calendar(){const today=new Date();const ds=[0,1,2,3,4,5,6].map(i=>{const d=new Date(today);d.setDate(d.getDate()+i);return d});view.innerHTML=`<div class="tool-row"><button class="primary-btn" id="newSchedule" ${state.readOnly?'disabled':''}>+ 新建发布</button><span class="spacer"></span><button class="small-btn" id="calendarToday">本周</button></div><div class="calendar"><aside class="calendar-side"><h3>待发布内容</h3><p class="sub" style="font-size:11px;color:var(--ink3);margin:5px 0 12px">选择内容后可拖入日期，或直接新建发布。</p><div class="queue-item" data-quick-content="夏日出行清单：空间与续航都刚刚好"><b>夏日出行清单：空间与续航都刚刚好</b><span>视频 · 已审核通过 · 3 个可用账号</span></div><div class="queue-item" data-quick-content="下班路上，给自己留一段安静的路"><b>下班路上，给自己留一段安静的路</b><span>视频 · 待人工审核</span></div><div class="queue-item" data-quick-content="城市通勤的松弛感"><b>城市通勤的松弛感</b><span>图文 · 自动合规需确认</span></div></aside><div class="calendar-body"><div class="calendar-head"><h3>发布日历</h3><span style="font-size:11px;color:var(--ink3)">时区：Asia/Shanghai（UTC+8）</span></div><div class="week">${ds.map((d,i)=>`<div class="day ${i===0?'today':''}"><span class="date">${i===0?'今天 ':''}${d.getMonth()+1}/${d.getDate()} · ${['日','一','二','三','四','五','六'][d.getDay()]}</span>${state.events.filter(e=>e.date===i).map(e=>`<button class="calendar-event ${e.status==='partial'?'fail':''}" data-event="${e.id}">${e.time} · ${esc(e.title)}<br>${e.accounts} 个账号 · ${e.status==='partial'?'部分失败':'已排期'}</button>`).join('')}<button class="text-btn" style="margin-top:12px" data-date="${i}">＋排期</button></div>`).join('')}</div></div></div>`;bindBase();$('#newSchedule').onclick=()=>openPublishModal();document.querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>openPublishModal(null,+b.dataset.date));document.querySelectorAll('[data-quick-content]').forEach(b=>b.onclick=()=>openPublishModal({title:b.dataset.quickContent,status:b.textContent.includes('待人工审核')?'pending':'approved'}));document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>eventDetail(b.datas   function distribute(){view.innerHTML=`<div class="distribution"><section class="distribute-pane"><h3>定向转发</h3><p class="sub">将已生成内容发送给员工或代理商；本原型以站内链接模拟访问方式。</p><div class="content-select"><b>夏日出行清单：空间与续航都刚刚好</b><br><span style="color:var(--ink4);font-size:11px">视频 · V2 · 已审核通过 · 自动合规通过</span></div><div class="modal-section"><h3>接收对象</h3>${[['m1','李安','品牌员工 · 小红书内容组','安'],['m2','周舟','品牌员工 · 视频号运营','舟'],['m3','启星创意','代理商 · 华东地区','启'],['m4','青橙传媒','代理商 · 短视频组','青'],['m5','谢可','品牌员工 · 项目协调','可']].map((x,i)=>`<label class="recipient"><input type="checkbox" class="recipient-check" value="${x[0]}" ${i<3?'checked':''}><span class="recipient-avatar">${x[3]}</span><span><b>${x[1]}</b><span>${x[2]}</span></span></label>`).join('')}</div></section><section class="distribute-pane"><h3>发送确认</h3><p class="sub">接收者仅能查看本项目范围内的内容；链接 7 天内有效。</p><div class="send-summary" id="sendSummary">将发送给 <b>3</b> 位成员<br>访问方式：站内内容链接 · 需要登录</div><button class="primary-btn" id="sendContent" ${state.readOnly?'disabled':''}>发送内容</button><div class="logs"><h3 style="font-size:13px;margin-bottom:6px">发送记录</h3><div id="sendLogs">${state.sendLogs.map(l=>`<div class="log"><b>${l.result}</b> · ${l.target}<br>${l.content} · ${l.time}</div>`).join('')}</div></div></section></div>`;bindBase();const update=()=>{$('#sendSummary').innerHTML=`将发送给 <b>${document.querySelectorAll('.recipient-check:checked').length}</b> 位成员<br>访问方式：站内内容链接 · 需要登录`};document.querySelectorAll('.recipient-check').forEach(x=>x.onchange=update);$('#sendContent').onclick=()=>{const n=document.querySelectorAll('.recipient-check:checked').length;if(!n){toast('请至少选择一位接收对象','err');return}state.sendLogs.unshift({time:'刚刚',content:'夏日出行清单：空间与续航都刚刚好',target:`${n} 位成员`,result:'发送成功'});toast('内容已定向发送');render()}}

  function reauthorize(id){const a=state.accounts.find(x=>x.id===id);openModal('重新授权',`将重新连接 ${a.platform} 账号 ${a.handle}`,`<div class="notice" style="margin:0"><strong>模拟授权</strong><span>原型不会连接真实平台。确认后将把账号状态更新为“已授权”，并记录一次同步时间。</span></div>`, '<button class="small-btn" data-close-modal>取消</button><button class="primary-btn" id="confirmAuth">确认重新授权</button>');$('#confirmAuth').onclick=()=>{a.auth='ok';a.sync='刚刚';closeModal();toast(`${a.name} 已重新授权`);render()}}
  function openReview(id){const r=state.reviewItems.find(x=>x.id===id);const title=r.status==='pending'?'审核内容':'审核记录';const actions=r.status==='pending'?'<button class="danger-btn" id="rejectReview">驳回</button><button class="primary-btn" id="approveReview">批准</button>':'<button class="small-btn" data-close-modal>关闭</button>';openModal(title,`${r.type} · ${r.version} · 提交人：${r.user}`,`<div class="content-select"><b>${esc(r.title)}</b><br><span style="color:var(--ink4);font-size:11px">目标：${r.platform} · 提交时间：${r.time}</span></div><div class="gate ${r.risk==='pass'?'ok':r.risk==='warn'?'warn':'bad'}">自动合规：${r.risk==='pass'?'通过，可进入审核。':r.risk==='warn'?'存在风险提示，审核时请确认。':'已阻断，不能批准或发布。'}</div><div class="modal-section"><h3>审核历史</h3><div style="font-size:12px;color:var(--ink3);line-height:1.8">${r.status==='pending'?'一琳 · 提交审核 · 刚刚':r.status==='approved'?'审核员 周明 · 审核通过 · 昨天 12:20':'暂无人工审核记录'}</div></div><div class="form-field full" id="rejectField" style="margin-top:14px;display:none"><label>驳回原因 <em style="color:var(--pub-red);font-style:normal">*</em></label><textarea id="rejectReason" placeholder="请说明需修改的具体原因"></textarea><span class="field-error">请填写驳回原因</span></div>`,actions);if(r.status!=='pending')return;$('#approveReview').onclick=()=>{if(r.risk==='block'){toast('自动合规已阻断，无法批准','err');return}r.status='approved';closeModal();toast('审核已通过，可进入发布');render()};$('#rejectReview').onclick=()=>{const f=$('#rejectField');if(f.style.display==='none'){f.style.display='grid';$('#rejectReview').textContent='确认驳回';return}if(!$('#rejectReason').value.trim()){f.classList.add('invalid');return}r.status='rejected';r.reason=$('#rejectReason').value.trim();closeModal();toast('内容已驳回并通知提交人');render()}}

    $('#backFromReschedule').onclick=()=>eventDetail(eventId);
    $('#saveDeliverySchedule').onclick=()=>{const value=$('#deliveryScheduleTime').value;if(!value||new Date(value)<minDate){toast('发布时间需至少晚于当前时间 10 分钟','err');$('#deliveryScheduleTime').focus();return}const date=value.slice(0,10),time=value.slice(11,16),deliveries=ensureEventDeliveries(event);
      if(account&&deliveries.length>1){event.deliveries=deliveries.filter(item=>item.accountId!==accountId);syncEventAggregate(event);const newId=`e${Date.now()}`;state.events.push({id:newId,date,time,title:event.title,accounts:1,accountIds:[accountId],status:'scheduled',deliveries:[{...delivery,status:'pending',error:'',taskId:`${newId.toUpperCase()}-${accountId.toUpperCase()}`} ]});}
      else{event.date=date;event.time=time;(account?[delivery]:deliveries.filter(item=>item.status==='pending')).forEach(item=>{item.status='pending';item.error=''});syncEventAggregate(event)}
      state.calendarYear=+date.slice(0,4);state.calendarMonth=+date.slice(5,7);closeModal();toast(account?'已拆分并更新该账号的排期':'全部待发布内容已更新排期');render();
    };
  }
  function confirmCancelDelivery(eventId,accountId=null){
    const event=state.events.find(item=>item.id===eventId);if(!event)return;const delivery=accountId?ensureEventDeliveries(event).find(item=>item.accountId===accountId):null,account=delivery?state.accounts.find(item=>item.id===accountId):null;
    openModal(account?'取消此账号的发布任务':'取消全部待发布任务',account?`${account.platform} · ${account.handle}`:`${ensureEventDeliveries(event).filter(item=>item.status==='pending').length} 条待发布内容`, `<div class="gate warn">${account?'仅取消当前账号；同批次其他账号不受影响。':'本次排期中的待发布内容都将被取消。'}</div><p style="margin-top:12px;color:var(--ink3);font-size:11px;line-height:1.7">已编辑的文案和媒体素材仍保留在内容资产中，取消操作不会删除素材。</p>`, '<button class="small-btn" id="backFromCancel" type="button">返回</button><button class="danger-btn" id="confirmCancelDelivery" type="button">确认取消</button>');
    $('#backFromCancel').onclick=()=>eventDetail(eventId);
    $('#confirmCancelDelivery').onclick=()=>{if(account){event.deliveries=ensureEventDeliveries(event).filter(item=>item.accountId!==accountId);if(!event.deliveries.length)state.events=state.events.filter(item=>item.id!==eventId);else syncEventAggregate(event)}else state.events=state.events.filter(item=>item.id!==eventId);closeModal();toast(account?'已取消当前账号的发布任务':'已取消全部待发布任务');render();if(account&&state.events.some(item=>item.id===eventId))eventDetail(eventId)};
  }
  function createRepeatEvent(event,accountId=null,mode='retry'){
    const source=ensureEventDeliveries(event).filter(item=>(!accountId||item.accountId===accountId)&&(mode==='retry'?item.status==='failed':item.status==='published'));
    if(!source.length){toast(mode==='retry'?'没有需要重试的失败账号':'没有可再次发布的成功内容','err');return}
    const runAt=new Date(Date.now()+15*60000),date=`${runAt.getFullYear()}-${String(runAt.getMonth()+1).padStart(2,'0')}-${String(runAt.getDate()).padStart(2,'0')}`,time=`${String(runAt.getHours()).padStart(2,'0')}:${String(runAt.getMinutes()).padStart(2,'0')}`,newId=`e${Date.now()}`;
    const deliveries=source.map(item=>({...item,status:'pending',error:'',attempts:(item.attempts||1)+1,taskId:`${newId.toUpperCase()}-${item.accountId.toUpperCase()}`}));
    state.events.push({id:newId,date,time,title:event.title,accounts:deliveries.length,accountIds:deliveries.map(item=>item.accountId),status:'scheduled',deliveries});state.calendarYear=runAt.getFullYear();state.calendarMonth=runAt.getMonth()+1;closeModal();toast(mode==='retry'?'已为失败账号创建独立重试任务':'已创建新的发布任务');render();
  }
  function eventDetail(id){
    const event=state.events.find(item=>item.id===id);if(!event)return;
    const deliveries=ensureEventDeliveries(event),failedCount=deliveries.filter(item=>item.status==='failed').length,pendingCount=deliveries.filter(item=>item.status==='pending').length;
    const footer=failedCount
      ?'<button class="small-btn" data-close-modal>关闭</button>'
      :pendingCount
        ?'<button class="small-btn" data-close-modal>关闭</button><button class="small-btn" id="rescheduleEvent">调整全部时间</button><button class="danger-btn" id="cancelEvent">取消全部任务</button>'
        :'<button class="small-btn" data-close-modal>关闭</button>';
    openModal('发布详情','', `<div class="delivery-list">${deliveries.map(delivery=>deliveryCardMarkup(event,delivery)).join('')}</div>`,footer);
    modal.querySelector('.modal').classList.add('event-detail-modal');
    document.querySelectorAll('[data-edit-delivery]').forEach(button=>button.onclick=()=>openDeliveryEditor(id,button.dataset.editDelivery));
    document.querySelectorAll('[data-retry-delivery]').forEach(button=>button.onclick=()=>createRepeatEvent(event,button.dataset.retryDelivery,'retry'));
    document.querySelectorAll('[data-reschedule-delivery]').forEach(button=>button.onclick=()=>openDeliveryReschedule(id,button.dataset.rescheduleDelivery));
    document.querySelectorAll('[data-cancel-delivery]').forEach(button=>button.onclick=()=>confirmCancelDelivery(id,button.dataset.cancelDelivery));
    if(!failedCount&&pendingCount){$('#rescheduleEvent').onclick=()=>openDeliveryReschedule(id);$('#cancelEvent').onclick=()=>confirmCancelDelivery(id)}
  }
  const incomingPublishDraft=window.qj?.takePublishDraft?.();
  render();
  if(incomingPublishDraft)requestAnimationFrame(()=>openPublishModal(incomingPublishDraft));
})();
</script>
</body>
</html>
