<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创作 Agent · 奇境AI</title>
<link rel="stylesheet" href="奇境-字体.css">
<link rel="stylesheet" href="qj-shell.css">
<style>
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
button{color:inherit}
.page{overflow:hidden}
.inner{width:100%;max-width:none;height:100%;padding:14px clamp(14px,2vw,34px) 20px}
.agent-page{height:100%;display:grid;grid-template-rows:minmax(0,1fr)}
.agent-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding:4px 2px 0}
.agent-title{display:grid;gap:5px}
.agent-title h1{font-family:var(--serif);font-size:clamp(25px,2vw,34px);font-weight:var(--weight-semibold);letter-spacing:-.035em;line-height:1.18}
.agent-title p{font-size:12px;color:var(--ink3)}

.agent-workbench{min-height:0;display:grid;grid-template-columns:220px minmax(0,1fr);border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow-2);overflow:hidden}
.session-rail{min-width:0;min-height:0;display:flex;flex-direction:column;padding:14px 12px;border-right:1px solid var(--line);background:var(--card-2)}
.new-creation{width:100%;min-height:42px;justify-content:center}
.theme-search{position:relative;margin-top:13px}
.theme-search svg{position:absolute;left:10px;top:50%;width:15px;height:15px;transform:translateY(-50%);color:var(--ink4);pointer-events:none}
.theme-search input{width:100%;height:38px;padding:0 10px 0 32px;border:1px solid var(--line);border-radius:10px;outline:0;background:var(--card);font-size:12px;color:var(--ink)}
.theme-search input:focus{border-color:var(--gold-line);box-shadow:var(--ring)}
.theme-group{min-height:0;display:flex;flex-direction:column;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}
.theme-group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 3px 8px}
.theme-group-head span{font-size:11px;font-weight:var(--weight-semibold);color:var(--ink3)}
.history-list{min-height:0;display:grid;align-content:start;gap:5px;overflow-y:auto}
.history-item{display:grid;gap:5px;width:100%;padding:10px;border:1px solid transparent;border-radius:11px;background:transparent;text-align:left;cursor:pointer}
.history-item:hover,.history-item:focus-visible{border-color:var(--line);background:var(--card)}
.history-item.is-active{border-color:var(--gold-line);background:var(--gold-soft)}
.history-item b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:var(--weight-semibold)}
.history-item-meta{display:flex;align-items:center;justify-content:space-between;gap:7px;font-size:10px;color:var(--ink4)}
.history-item-meta em{font-style:normal;padding:2px 5px;border-radius:5px;background:var(--card);color:var(--ink3)}
.history-empty{display:grid;justify-items:center;gap:6px;padding:25px 8px;text-align:center;color:var(--ink4)}
.history-empty svg{width:20px;height:20px}
.history-empty b{font-size:11px;color:var(--ink3)}
.history-empty span{font-size:10px;line-height:1.5}

.workspace{min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr);background:var(--card)}
.workspace-canvas{min-height:0;padding:18px;overflow-y:auto;background-color:var(--bg-top);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:19px 19px}
.workspace-canvas.is-setup{display:flex;align-items:center;justify-content:center}
.flow-card{width:min(1180px,100%);margin:0 auto;overflow:hidden}
.flow-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;padding:18px 20px;border-bottom:1px solid var(--line)}
.flow-head h2{font-family:var(--serif);font-size:22px;font-weight:var(--weight-semibold);letter-spacing:-.02em}
.flow-head p{max-width:670px;margin-top:5px;font-size:12px;line-height:1.65;color:var(--ink3)}
.flow-head-actions{display:flex;align-items:center;gap:8px;flex:none}
.flow-body{display:grid;gap:17px;padding:18px 20px}
.flow-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;border-top:1px solid var(--line);background:var(--card-2);flex-wrap:wrap}
.footer-note{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink3)}
.footer-note svg{width:15px;height:15px;color:var(--ok)}
.button-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qj-btn[disabled]{opacity:.48;cursor:not-allowed}
.text-button{min-height:34px;padding:0 10px;border:0;border-radius:9px;background:transparent;color:var(--ink3);font-size:11px;cursor:pointer}
.text-button:hover{background:var(--card-2);color:var(--ink)}

.setup-home{width:min(clamp(940px,57vw,1240px),100%);margin:auto;padding:clamp(8px,2vh,24px) 0}
.setup-hero{display:grid;justify-items:center;gap:8px;text-align:center}
.setup-hero-mark{width:48px;height:48px;display:grid;place-items:center;border-radius:16px;background:var(--grad-navy);color:var(--gold-on-navy);box-shadow:var(--shadow-2)}
.setup-hero-mark svg{width:21px;height:21px;fill:currentColor;stroke:none}
.setup-hero h2{font-family:var(--serif);font-size:clamp(27px,2.1vw,34px);font-weight:var(--weight-semibold);letter-spacing:-.035em}
.setup-hero p{max-width:760px;font-size:13px;line-height:1.7;color:var(--ink3)}
.creation-composer{margin-top:24px;border:1px solid var(--line2);border-radius:18px;background:var(--card);box-shadow:var(--shadow-2);overflow:hidden}
.composer-inputs{padding:5px 22px 0}
.composer-field{display:grid;gap:7px;padding:17px 2px 15px;border-bottom:1px solid var(--line)}
.composer-field:last-child{border-bottom:0}
.composer-field-label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:var(--weight-semibold);color:var(--ink2)}
.composer-field-label em{font-style:normal;font-size:10px;font-weight:var(--weight-regular);color:var(--ink4)}
.composer-field-label .required-mark{color:var(--gold-deep)}
.composer-textarea{width:100%;min-height:62px;padding:4px 0;border:0;outline:0;resize:none;background:transparent;font-size:16px;line-height:1.65;color:var(--ink)}
.composer-textarea::placeholder{color:var(--ink4)}
.composer-field:focus-within .composer-field-label{color:var(--gold-deep)}
.composer-field:focus-within{box-shadow:inset 0 -1px 0 var(--gold-line)}
.composer-field.is-error{box-shadow:inset 0 -2px 0 var(--err)}
.composer-field.is-error .composer-field-label{color:var(--err)}
.composer-field-compact{gap:4px;padding-top:13px;padding-bottom:12px}
.composer-persona-row{display:flex;align-items:center;gap:12px;min-width:0}
.composer-persona-input{min-width:0;flex:1;height:36px;padding:0;border:0;outline:0;background:transparent;font-size:14px;color:var(--ink)}
.composer-persona-input::placeholder{color:var(--ink4)}
.composer-persona-status{flex:none;padding:4px 7px;border-radius:999px;background:var(--gold-soft);font-size:9px;color:var(--gold-deep);white-space:nowrap}
.composer-toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;padding:14px 16px;border-top:1px solid var(--line);background:var(--card-2)}
.composer-filters{min-width:0;flex:1;display:grid;grid-template-columns:minmax(380px,1.1fr) minmax(300px,.9fr);gap:16px}
.composer-option-group{min-width:0;display:grid;gap:8px}
.composer-option-label{font-size:11px;font-weight:var(--weight-semibold);color:var(--ink3)}
.composer-option-list{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.composer-filter-option{min-height:36px;justify-content:center;white-space:nowrap;cursor:pointer}
.composer-filter-option:hover,.composer-filter-option:focus-visible{border-color:var(--gold-line);background:var(--gold-soft);color:var(--gold-deep);outline:0;box-shadow:var(--ring)}
.composer-filter-option.is-active{border-color:var(--gold-line);background:var(--gold-soft);color:var(--gold-deep);box-shadow:inset 0 0 0 1px var(--gold-line)}
.composer-filter-option.is-active:hover,.composer-filter-option.is-active:focus-visible{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}
.composer-submit{min-height:44px;flex:none;white-space:nowrap}
.creation-composer :focus-visible{outline:0}

.form-section{display:grid;gap:9px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-title h3{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:var(--weight-semibold)}
.section-number{width:22px;height:22px;display:grid;place-items:center;border-radius:7px;background:var(--gold-soft);font-family:var(--mono);font-size:10px;color:var(--gold-deep)}
.section-title span{font-size:10px;color:var(--ink4)}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:grid;gap:7px}
.field label{font-size:11px;font-weight:var(--weight-medium);color:var(--ink2)}
.field label small{margin-left:4px;color:var(--err)}
.field select,.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;outline:0;background:var(--card-2);color:var(--ink);font-size:12px}
.field select,.field input{height:42px;padding:0 11px}
.field textarea{min-height:82px;padding:11px;resize:vertical;line-height:1.6}
.field select:focus,.field input:focus,.field textarea:focus{border-color:var(--gold);box-shadow:var(--ring);background:var(--card)}
.field select.is-error,.field input.is-error,.field textarea.is-error{border-color:var(--err)}
.field-error{font-size:10px;color:var(--err)}
.choice-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.choice-card{position:relative;display:grid;grid-template-columns:30px minmax(0,1fr);grid-template-rows:auto auto;align-content:center;column-gap:9px;row-gap:2px;min-height:62px;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--card);text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s}
.choice-card:hover{transform:translateY(-1px);border-color:var(--gold-line);box-shadow:var(--shadow-1)}
.choice-card.is-active{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold-line)}
.choice-card b{grid-column:2;font-size:12px;line-height:1.3}
.choice-card p{grid-column:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:1.45;color:var(--ink3)}
.choice-icon{grid-column:1;grid-row:1/3;width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--card-2);color:var(--gold-deep)}
.choice-card.is-active .choice-icon{background:var(--card)}
.choice-icon svg{width:15px;height:15px}
.choice-tag{position:absolute;right:9px;top:9px;padding:3px 6px;border-radius:999px;background:var(--ink);color:#fff;font-size:9px}
.platform-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.content-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.platform-dot{grid-column:1;grid-row:1/3;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;color:#fff;font-size:10px;font-weight:700}
.platform-dot.xhs{background:#ff2442}.platform-dot.wechat{background:#1aad19}.platform-dot.douyin{background:#121212;text-shadow:1px 0 #ff2d71,-1px 0 #25f4ee}
.setup-summary{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px dashed var(--gold-line);border-radius:11px;background:var(--gold-soft)}
.setup-summary svg{width:18px;height:18px;color:var(--gold-deep)}
.setup-summary p{font-size:11px;line-height:1.6;color:var(--ink2)}

.direction-context{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card-2)}
.direction-primary{display:grid;gap:3px;min-width:0}.direction-primary span{font-size:9px;color:var(--ink4)}.direction-primary b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.direction-pills{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap}
.context-pill{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:10px;color:var(--ink3)}
.directions-page{min-height:0;display:block}
.directions-page>.flow-body{display:grid;gap:16px;align-content:start}
.directions-page .flow-footer{position:sticky;z-index:5;bottom:0;justify-content:space-between;flex-wrap:nowrap;box-shadow:var(--shadow-1)}
.direction-selection-summary{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.direction-selection-summary b{font-size:14px;color:var(--gold-deep)}
.direction-footer-controls{min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-left:auto}
.direction-footer-settings{flex:none;border:0;border-radius:0;background:transparent}
.direction-footer-settings .compact-settings-inline{gap:8px;padding:0}
.direction-footer-settings .settings-inline-label{height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-1);color:var(--ink2);font-size:14px;font-weight:var(--weight-medium);white-space:nowrap}
.direction-footer-settings .settings-inline-label .icon{width:16px;height:16px;color:var(--ink2)}
.direction-footer-settings .parameter-row{gap:7px;flex-wrap:nowrap}
.direction-footer-settings .parameter-select{width:clamp(164px,12vw,180px);min-width:0}
.direction-footer-settings .parameter-select.is-spec{width:auto;min-width:154px}
.direction-footer-settings .parameter-select.is-count{width:82px;min-width:82px}
.direction-footer-settings .parameter-select-trigger{height:46px;padding:0 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow-1);font-size:14px}
.direction-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.directions-page .direction-list{height:auto;align-items:stretch}
.direction-card{position:relative;display:flex;flex-direction:column;gap:8px;height:auto;min-height:0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-align:left;cursor:pointer;transition:transform .16s,border-color .16s,box-shadow .16s}
.direction-card:hover{transform:translateY(-2px);border-color:var(--gold-line);box-shadow:var(--shadow-1)}
.direction-card.is-active{border-color:var(--gold);background:linear-gradient(180deg,var(--gold-soft),var(--card));box-shadow:inset 0 0 0 1px var(--gold-line),var(--shadow-1)}
.direction-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.direction-top .qj-badge{padding:6px 9px;font-size:11px}
.direction-number{width:31px;height:31px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;background:var(--card-2);font-family:var(--mono);font-size:10px;color:var(--ink4)}
.direction-card.is-active .direction-number{border-color:var(--gold);background:var(--gold);color:var(--on-gold)}
.direction-card h3{min-height:50px;padding-bottom:8px;border-bottom:1px solid var(--line2);font-family:var(--serif);font-size:16px;line-height:1.45}
.direction-idea{min-height:60px;display:grid;align-content:start;gap:4px}
.direction-idea span{font-size:12px;color:var(--gold-deep)}
.direction-idea p{font-size:12px;line-height:1.6;color:var(--ink3)}
.direction-hook{min-height:68px;margin-top:auto;padding:10px 12px;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;background:var(--gold-soft);font-size:14px;font-weight:var(--weight-semibold);line-height:1.5;color:var(--ink)}
.direction-hook span{display:block;margin-bottom:5px;font-size:12px;font-weight:var(--weight-regular);color:var(--gold-deep)}
.review-layout{display:grid;grid-template-columns:minmax(260px,.68fr) minmax(0,1.32fr);gap:18px;align-items:start}
.review-stack{display:grid;gap:14px}
.batch-review-list{display:grid;gap:14px}
.settings-card,.draft-card,.compliance-card{border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.subcard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card-2)}
.subcard-head b{font-size:13px}.subcard-head p{margin-top:3px;font-size:10px;color:var(--ink4)}
.settings-body{display:grid;gap:15px;padding:15px}
.segmented{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.segmented button{min-height:34px;padding:5px 7px;border:1px solid var(--line);border-radius:9px;background:var(--card);font-size:10px;cursor:pointer}
.segmented button:hover{border-color:var(--gold-line)}
.segmented button.is-active{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep);font-weight:var(--weight-semibold)}
.credit-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:11px;background:var(--grad-navy);color:#fff}
.credit-box span{font-size:10px;color:rgba(255,255,255,.66)}
.credit-box b{font-family:var(--mono);font-size:19px;color:var(--gold-on-navy)}
.credit-box small{font-size:9px;color:rgba(255,255,255,.58)}
.draft-body{display:grid;gap:14px;padding:15px}
.draft-preview{position:relative;display:grid;grid-template-columns:180px 1fr;gap:15px;align-items:stretch}
.video-draft-preview{grid-template-columns:220px minmax(0,1fr);align-items:start}
.video-draft-preview .media-cover{width:100%;min-height:0;aspect-ratio:9/16}
.media-cover{position:relative;min-height:250px;display:flex;align-items:flex-end;padding:18px;border-radius:13px;overflow:hidden;color:#fff;background:linear-gradient(155deg,#1f2757 0%,#566694 46%,#d6b165 100%)}
.media-cover.brand-shalan{background:linear-gradient(155deg,#2c221c,#83634e 50%,#d7b58a)}
.media-cover.brand-chengye{background:linear-gradient(155deg,#172b28,#416a5b 52%,#c69b51)}
.media-cover:before{content:"";position:absolute;width:150px;height:150px;right:-35px;top:-30px;border:1px solid rgba(255,255,255,.28);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.06),0 0 0 58px rgba(255,255,255,.04)}
.media-cover:after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,rgba(7,10,28,.88))}
.cover-copy{position:relative;z-index:1;display:grid;gap:7px}
.cover-copy small{font-size:9px;letter-spacing:.12em;color:var(--gold-on-navy)}
.cover-copy b{font-family:var(--serif);font-size:19px;line-height:1.35}
.cover-copy span{font-size:10px;color:rgba(255,255,255,.72)}
.play-button{position:absolute;z-index:2;left:50%;top:50%;width:48px;height:48px;display:grid;place-items:center;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(7,10,28,.44);backdrop-filter:blur(8px);font-size:16px}
.draft-copy{display:grid;align-content:start;gap:14px}
.copy-block{display:grid;gap:5px}
.copy-block span{font-size:10px;letter-spacing:.06em;color:var(--ink4)}
.copy-block h3{font-family:var(--serif);font-size:22px;line-height:1.42}
.copy-block p{font-size:13px;line-height:1.8;color:var(--ink2)}
.editable-block{position:relative;margin:-7px;padding:7px;border:1px dashed transparent;border-radius:9px;transition:border-color .15s,background .15s}
.editable-block:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.editable-block [contenteditable="true"]{outline:0}
.editable-block [contenteditable="true"]:focus{border-radius:5px;background:var(--card);box-shadow:0 0 0 4px var(--card),var(--ring)}
.editable-block .editable-body{display:-webkit-box;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;white-space:normal;cursor:text}
.editable-block .editable-body:focus{display:block;max-height:none;overflow:visible;-webkit-line-clamp:unset;line-clamp:unset;white-space:pre-line}
.edit-hint{position:absolute;right:7px;top:6px;padding:3px 6px;border-radius:999px;background:var(--card);opacity:0;transform:translateY(2px);transition:opacity .15s,transform .15s;font-size:8px!important;color:var(--gold-deep)!important;pointer-events:none}
.editable-block:hover .edit-hint,.editable-block:focus-within .edit-hint{opacity:1;transform:translateY(0)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:5px 8px;border-radius:999px;background:var(--gold-soft);font-size:10px;color:var(--gold-deep)}
.storyboard-list{margin-top:2px;overflow:hidden;border:1px solid var(--line);border-radius:11px;background:var(--card)}
.storyboard-head,.storyboard-row{display:grid;grid-template-columns:66px minmax(82px,.55fr) minmax(180px,1.35fr) minmax(200px,1.55fr);align-items:start}
.storyboard-head{background:var(--card-2);color:var(--ink4);font-size:10px;font-weight:var(--weight-semibold);letter-spacing:.04em}
.storyboard-head span,.storyboard-row>*{min-width:0;padding:11px 12px}
.storyboard-row{border-top:1px solid var(--line);font-size:11px;line-height:1.6;color:var(--ink3);transition:background .16s}
.storyboard-row:hover{background:rgba(198,146,56,.045)}
.storyboard-time{font-family:var(--mono);font-size:10px;font-weight:var(--weight-semibold);color:var(--gold-deep);white-space:nowrap}
.storyboard-shot{font-size:12px;color:var(--ink)}
.storyboard-visual,.storyboard-voice{overflow-wrap:anywhere}
.storyboard-voice{position:relative;border:1px dashed transparent;border-radius:7px;cursor:text;transition:border-color .16s,background .16s,box-shadow .16s}
.storyboard-voice:hover{border-color:var(--gold-line);background:var(--gold-soft)}
.storyboard-voice:focus{outline:0;border-color:var(--gold);background:var(--card);box-shadow:var(--ring)}
.storyboard-voice:after{content:'点击修改';position:absolute;right:6px;top:4px;padding:2px 5px;border-radius:999px;background:var(--card);box-shadow:var(--shadow-1);opacity:0;transform:translateY(2px);color:var(--gold-deep);font-size:8px;font-weight:var(--weight-semibold);line-height:1.4;pointer-events:none;transition:opacity .16s,transform .16s}
.storyboard-voice:hover:after,.storyboard-voice:focus:after{opacity:1;transform:none}
.compliance-card{grid-column:1/-1}
.compliance-body{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;padding:15px}
.check-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.check-item{display:grid;grid-template-columns:25px 1fr;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card-2)}
.check-icon{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:var(--card);font-size:11px;color:var(--ink4)}
.check-item b{display:block;font-size:10px}.check-item span{display:block;margin-top:2px;font-size:9px;color:var(--ink4)}
.check-item.is-passed{border-color:rgba(38,132,92,.22);background:var(--ok-soft)}
.check-item.is-passed .check-icon{color:var(--ok)}
.check-item.is-blocked{border-color:rgba(190,66,57,.22);background:var(--err-soft)}
.check-item.is-blocked .check-icon{color:var(--err)}
.compliance-action{display:grid;justify-items:end;gap:6px}
.compliance-action span{font-size:9px;color:var(--ink4)}
.compliance-passed{display:inline-flex;align-items:center;gap:6px;padding:8px 10px;border-radius:9px;background:var(--ok-soft);font-size:10px!important;font-weight:var(--weight-semibold);color:var(--ok)!important}
.scan-line{position:relative;overflow:hidden}
.scan-line:after{content:"";position:absolute;inset:0 auto 0 -30%;width:25%;background:linear-gradient(90deg,transparent,rgba(198,146,56,.22),transparent);animation:scan 1s infinite}
@keyframes scan{to{left:110%}}

.compact-settings{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:visible}
.compact-settings-inline{display:flex;align-items:center;gap:14px;padding:12px 16px}
.settings-inline-label{flex:none;font-size:12px;font-weight:var(--weight-semibold);color:var(--ink2)}
.parameter-row{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.parameter-select{position:relative;min-width:190px}
.parameter-select.is-spec{min-width:210px}.parameter-select.is-count{min-width:108px}
.parameter-select-trigger{width:100%;height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border:1px solid var(--line);border-radius:12px;outline:0;background:var(--card-2);color:var(--ink2);font-size:12px;font-weight:var(--weight-medium);text-align:left;cursor:pointer;transition:border-color .16s,background .16s,box-shadow .16s}
.parameter-select-trigger:hover,.parameter-select-trigger:focus-visible{border-color:var(--gold-line);background:var(--card);box-shadow:var(--ring)}
.parameter-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.parameter-caret{width:8px;height:8px;flex:none;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);transition:transform .16s}
.parameter-select.is-open .parameter-select-trigger{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 3px var(--gold-soft2)}
.parameter-select.is-open .parameter-caret{transform:rotate(225deg)}
.parameter-menu{position:absolute;left:0;bottom:calc(100% + 8px);z-index:18;width:max-content;min-width:100%;max-width:min(320px,calc(100vw - 48px));display:grid;gap:4px;padding:8px;border:1px solid var(--gold-line);border-radius:14px;background:var(--card);box-shadow:var(--shadow-2);opacity:0;visibility:hidden;transform:translateY(6px);pointer-events:none;transition:opacity .16s,transform .16s,visibility .16s}
.parameter-select.is-open .parameter-menu{opacity:1;visibility:visible;transform:none;pointer-events:auto}
.parameter-option{min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 11px;border:0;border-radius:9px;background:transparent;color:var(--ink);font-size:12px;font-weight:var(--weight-medium);text-align:left;white-space:nowrap;cursor:pointer}
.parameter-option:hover,.parameter-option:focus-visible{outline:0;background:var(--gold-soft)}
.parameter-option.is-active{background:var(--gold-soft);color:var(--gold-deep)}
.parameter-check{width:14px;color:var(--gold-deep);text-align:center}
.parameter-select.is-video-spec{min-width:285px}
.video-spec-panel{width:min(460px,calc(100vw - 48px));max-width:calc(100vw - 48px);gap:12px;padding:14px}
.video-spec-group{display:grid;gap:7px}.video-spec-group>b{font-size:11px;color:var(--ink2)}
.video-spec-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:4px;border-radius:11px;background:var(--card-2)}
.video-spec-option{min-height:38px;padding:5px 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink2);font-size:11px;cursor:pointer}
.video-spec-option:hover,.video-spec-option:focus-visible{outline:0;background:var(--gold-soft)}
.video-spec-option.is-active{border-color:var(--gold-line);background:var(--card);box-shadow:var(--shadow-1);color:var(--ink);font-weight:var(--weight-semibold)}
.subcard-head-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex:none}
.review-generation-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:0;border:0;background:transparent}
.video-generation-settings{min-width:0;flex:1;border:0;border-radius:0;background:transparent}
.video-generation-settings .compact-settings-inline{gap:0;padding:0}
.video-generation-settings .settings-inline-label{display:none}
.video-generation-settings .parameter-row{gap:8px;flex-wrap:nowrap}
.video-generation-settings .parameter-select{width:150px;min-width:0}
.video-generation-settings .parameter-select.is-video-spec{width:240px}
.video-generation-settings .parameter-select.is-count{width:86px}
.video-generation-settings .parameter-select-trigger{height:44px;background:var(--card-2)}
.video-generation-submit{min-width:176px;flex:none}
.generation-submit.qj-btn{min-height:48px;padding:0 17px;border:0;border-radius:999px;background:var(--grad-gold);box-shadow:0 8px 18px var(--gold-soft2);color:var(--on-gold);font-size:14px;font-weight:var(--weight-semibold);transition:transform .16s,box-shadow .16s,filter .16s}
.generation-submit.qj-btn:hover:not(:disabled),.generation-submit.qj-btn:focus-visible:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 22px var(--gold-soft2);filter:saturate(1.05);outline:none}
.generation-submit-content{display:flex;align-items:center;gap:8px;white-space:nowrap}
.generation-submit-points{font-family:var(--mono);font-size:15px;font-weight:var(--weight-semibold)}
.generation-submit-divider{width:1px;height:16px;background:rgba(34,24,42,.2)}
.generation-submit-label{font-size:14px}
.direction-generate-submit{min-width:184px}

.loading-state,.system-state{min-height:430px;display:grid;place-content:center;justify-items:center;gap:13px;text-align:center;padding:30px}
.generating-page{min-height:100%;display:grid;place-items:center}
.generating-page .loading-state{width:min(660px,100%);min-height:0}
.generation-cancel-button{min-width:132px;min-height:40px;border-color:var(--line);background:var(--card-2);box-shadow:none;color:var(--ink3)}
.generation-cancel-button:hover,.generation-cancel-button:focus-visible{border-color:var(--gold-line);background:var(--gold-soft);color:var(--ink);outline:0;box-shadow:var(--ring)}
.loading-orb,.state-orb{width:76px;height:76px;display:grid;place-items:center;border-radius:24px;background:var(--grad-navy);color:var(--gold-on-navy);box-shadow:var(--shadow-2)}
.loading-orb svg,.state-orb svg{width:30px;height:30px}
.loading-orb svg{animation:pulse 1.25s infinite}
@keyframes pulse{50%{transform:scale(1.13);opacity:.62}}
.loading-state h2,.system-state h2{font-family:var(--serif);font-size:21px}
.loading-state p,.system-state p{max-width:470px;font-size:11px;line-height:1.7;color:var(--ink3)}
.skeleton-lines{width:min(390px,80vw);display:grid;gap:7px}
.skeleton-lines i{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--line),var(--card-2),var(--line));background-size:200% 100%;animation:shimmer 1.2s infinite}
.skeleton-lines i:nth-child(2){width:78%}.skeleton-lines i:nth-child(3){width:58%}
@keyframes shimmer{to{background-position:-200% 0}}
.progress-track{width:min(430px,78vw);height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.progress-fill{height:100%;border-radius:inherit;background:var(--grad-gold);transition:width .35s}
.state-badge{padding:5px 9px;border-radius:999px;background:var(--gold-soft);font-size:10px;color:var(--gold-deep)}
.error-note{padding:9px 12px;border-radius:9px;background:var(--err-soft);font-size:10px;color:var(--err)}

.result-card{width:min(1120px,100%)}
.result-layout{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:28px;align-items:start}
.result-card.is-video-result .result-layout{grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:28px}
.result-media{width:100%;max-width:330px}
.result-card.is-video-result .result-media{max-width:300px}
.result-media-stage{position:relative;width:100%}
.media-cover.result-cover{width:100%;min-height:0;aspect-ratio:9/16;border-radius:16px;background-color:#171a1e;background-image:linear-gradient(180deg,rgba(10,12,16,.04) 35%,rgba(8,10,14,.9) 100%),url("assets/agent-video-cover-v1.png");background-position:center;background-size:cover;box-shadow:var(--shadow-2)}
.media-cover.result-cover:before{display:none}
.media-cover.result-cover:after{height:62%;background:linear-gradient(transparent,rgba(7,9,13,.9))}
.result-cover .cover-copy b{font-size:28px}
.result-note-cover{width:100%;min-height:0;aspect-ratio:3/4;display:grid;grid-template-rows:1.16fr .84fr;border-radius:16px;overflow:hidden;background:#f4eee3;box-shadow:var(--shadow-2)}
.note-photo-art{position:relative;min-height:0;overflow:hidden;background:linear-gradient(145deg,#d7c0a1 0%,#efe4d2 44%,#a2b7a8 100%)}
.result-note-cover.preview-1 .note-photo-art{background:linear-gradient(145deg,#6877a1 0%,#d9c28f 48%,#26365d 100%)}
.result-note-cover.preview-2 .note-photo-art{background:linear-gradient(145deg,#b1c6b8 0%,#f2dfbd 46%,#36564b 100%)}
.note-photo-art:before{content:"";position:absolute;left:-8%;bottom:-15%;width:72%;height:56%;border-radius:50%;background:linear-gradient(150deg,#758f7d,#304f45);transform:rotate(-8deg);box-shadow:0 -18px 45px rgba(45,73,63,.18)}
.note-photo-art:after{content:"";position:absolute;right:8%;top:12%;width:42%;height:64%;border-radius:80px 80px 28px 28px;background:linear-gradient(160deg,#fffdf7,#d8c5a6);box-shadow:0 20px 36px rgba(68,55,38,.18);transform:rotate(6deg)}
.note-product-mark{position:absolute;z-index:3;right:15%;top:31%;width:29%;display:grid;gap:5px;text-align:center;transform:rotate(6deg);color:#5c4a35}
.note-product-mark b{font-family:var(--serif);font-size:15px;line-height:1.25}.note-product-mark span{font-size:8px;letter-spacing:.08em}
.note-cover-copy{display:grid;align-content:center;gap:9px;padding:24px;background:linear-gradient(150deg,#fffaf1,#f0e6d5)}
.note-cover-copy small{font-size:9px;font-weight:var(--weight-semibold);letter-spacing:.1em;color:var(--gold-deep)}
.note-cover-copy b{font-family:var(--serif);font-size:25px;line-height:1.35;color:var(--ink)}
.note-cover-copy span{font-size:10px;color:var(--ink3)}
.result-media-download{position:absolute;z-index:6;right:12px;top:12px;width:38px;height:38px;display:grid;place-items:center;padding:0;border:1px solid rgba(255,255,255,.5);border-radius:11px;background:rgba(20,20,22,.58);box-shadow:0 8px 22px rgba(15,18,38,.2);backdrop-filter:blur(8px);opacity:0;transform:translateY(-4px);color:#fff;cursor:pointer;transition:opacity .16s,transform .16s,background .16s}
.result-media-download svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.result-media-stage:hover .result-media-download,.result-media-stage:focus-within .result-media-download{opacity:1;transform:none}
.result-media-download:hover,.result-media-download:focus-visible{outline:0;background:rgba(20,20,22,.82);box-shadow:0 0 0 3px rgba(255,255,255,.32),0 8px 22px rgba(15,18,38,.25)}
.result-carousel-dots{position:absolute;z-index:5;left:50%;bottom:12px;display:flex;align-items:center;gap:7px;padding:6px 8px;transform:translateX(-50%);border:1px solid rgba(255,255,255,.45);border-radius:999px;background:rgba(20,20,22,.3);backdrop-filter:blur(7px)}
.result-carousel-dot{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.62);cursor:pointer;transition:width .16s,background .16s,box-shadow .16s}
.result-carousel-dot.is-active{width:18px;border-radius:999px;background:#fff}
.result-carousel-dot:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(255,255,255,.45)}
.result-info{display:grid;gap:14px}
.result-title{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.result-title h2{min-width:0;flex:1;font-family:var(--serif);font-size:25px;line-height:1.4}
.result-copy-button{flex:none;margin-top:3px;padding:4px 6px;border:0;border-radius:7px;background:transparent;color:var(--gold-deep);font-size:11px;font-weight:var(--weight-semibold);cursor:pointer}
.result-copy-button:hover,.result-copy-button:focus-visible{outline:0;background:var(--gold-soft);box-shadow:var(--ring)}
.result-copy{display:grid;gap:6px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.result-copy span{font-size:9px;color:var(--ink4)}.result-copy p{font-size:11px;line-height:1.8;color:var(--ink2)}
.result-copy-tags{margin-top:5px;padding-top:11px;border-top:1px solid var(--line)}
.result-tags{display:flex;gap:7px;flex-wrap:wrap}
.result-tags .tag{border:1px solid #f0d6d5;background:#fbefef;color:#a54848}
.result-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding-top:2px}

.result-card.is-batch-result{width:min(1280px,100%)}
.result-card.is-batch-result>.flow-head{padding-bottom:12px;border-bottom:0}
.result-card.is-batch-result>.flow-body{padding-top:0}
.batch-result-list{display:grid;gap:18px}
.batch-result-item{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shadow-1)}
.batch-result-item-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-bottom:16px}
.batch-result-meta,.batch-result-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.batch-result-status,.batch-result-strategy{padding:5px 8px;border-radius:8px;font-size:10px}
.batch-result-status{background:var(--ok-soft);color:var(--ok);font-weight:var(--weight-semibold)}
.batch-result-strategy{background:var(--card-2);color:var(--ink3)}
.batch-result-spec{font-size:11px;color:var(--ink3)}
.batch-result-autosave{font-size:10px;color:var(--ink4)}
.batch-result-delete{min-height:36px;padding:0 8px;border:0;border-radius:8px;background:transparent;color:var(--gold-deep);font-size:11px;cursor:pointer}
.batch-result-delete:hover,.batch-result-delete:focus-visible{background:var(--gold-soft);box-shadow:var(--ring)}
.batch-result-layout{display:grid;grid-template-columns:minmax(250px,320px) minmax(0,1fr);gap:28px;align-items:stretch}
.batch-result-gallery{min-width:0}
.batch-result-main{position:relative;width:100%;aspect-ratio:3/4;overflow:hidden;border-radius:14px;background:var(--card-2)}
.batch-result-item.is-video .batch-result-gallery{width:min(240px,100%)}
.batch-result-item.is-video .batch-result-main{aspect-ratio:9/16}
.batch-result-main img{width:100%;height:100%;display:block;object-fit:cover}
.batch-result-image-actions{position:absolute;z-index:7;right:12px;top:12px;display:flex;align-items:center;gap:7px;opacity:0;transform:translateY(-4px);transition:opacity .16s,transform .16s}
.batch-result-main:hover .batch-result-image-actions,.batch-result-main:focus-within .batch-result-image-actions{opacity:1;transform:none}
.batch-result-main:hover>.result-media-download,.batch-result-main:focus-within>.result-media-download{opacity:1;transform:none}
.batch-result-image-edit{min-height:38px;padding:0 14px;border:1px solid var(--line2);border-radius:11px;background:var(--card);box-shadow:var(--shadow-2);color:var(--ink2);font-size:11px;font-weight:var(--weight-semibold);cursor:pointer}
.batch-result-image-edit:hover,.batch-result-image-edit:focus-visible{outline:0;border-color:var(--gold-line);color:var(--gold-deep);box-shadow:var(--ring)}
.batch-result-image-actions .result-media-download{position:static;opacity:1;transform:none}
.batch-result-main-caption{position:absolute;inset:auto 0 0;display:grid;gap:5px;padding:42px 16px 16px;background:linear-gradient(transparent,var(--navy-deep));color:var(--night-ink)}
.batch-result-main-caption b{font-family:var(--serif);font-size:18px;line-height:1.4}.batch-result-main-caption span{font-size:9px;color:var(--night-ink2)}
.batch-result-thumbnails{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:8px}
.batch-result-thumbnail{aspect-ratio:3/4;padding:0;border:2px solid transparent;border-radius:10px;background:var(--card-2);overflow:hidden;cursor:pointer}
.batch-result-thumbnail img{width:100%;height:100%;display:block;object-fit:cover}
.batch-result-thumbnail:hover,.batch-result-thumbnail:focus-visible{border-color:var(--gold-line);outline:0;box-shadow:var(--ring)}
.batch-result-thumbnail.is-active{border-color:var(--gold)}
.batch-result-content{min-width:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:18px}
.batch-result-field{display:grid;align-content:start;gap:9px}
.batch-result-field>span{font-size:11px;font-weight:var(--weight-semibold);color:var(--ink2)}
.batch-result-field h3{padding:5px 8px;margin-left:-8px;border-radius:8px;font-family:var(--serif);font-size:24px;line-height:1.45;outline:0}
.batch-result-field p{min-height:190px;padding:8px;margin-left:-8px;border-radius:8px;font-size:12px;line-height:1.85;color:var(--ink2);white-space:pre-line;outline:0}
.batch-result-field [contenteditable="true"]:hover{background:var(--gold-soft)}
.batch-result-field [contenteditable="true"]:focus{background:var(--card-2);box-shadow:var(--ring)}
.batch-result-tags{display:flex;gap:7px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.batch-result-tags .tag{padding:7px 10px;border-radius:999px;background:var(--gold-soft);font-size:10px;color:var(--gold-deep)}
.batch-result-footer{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.batch-ai-editor{display:grid;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.batch-ai-editor-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.batch-ai-editor-head b{font-size:11px;color:var(--ink2)}.batch-ai-editor-head span{font-size:9px;color:var(--ink4)}
.batch-ai-editor textarea{width:100%;min-height:92px;padding:13px 14px;border:1px solid var(--gold-line);border-radius:12px;background:var(--card-2);box-shadow:inset 0 0 0 2px var(--gold-soft);resize:vertical;font:inherit;font-size:11px;line-height:1.7;color:var(--ink);outline:0}
.batch-ai-editor textarea:focus{background:var(--card);box-shadow:var(--ring)}
.batch-ai-editor-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.batch-ai-editor.is-image-editor .batch-ai-editor-head span{color:var(--gold-deep)}

.prototype-control{position:fixed;right:18px;bottom:16px;z-index:120;width:238px;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-2)}
.prototype-control summary{padding:9px 12px;cursor:pointer;font-size:10px;color:var(--ink3)}
.prototype-menu{display:grid;gap:9px;padding:0 11px 11px}.prototype-menu p{font-size:9px;line-height:1.5;color:var(--ink4)}
.prototype-options{display:flex;gap:5px;flex-wrap:wrap}.prototype-options button{padding:5px 7px;border:1px solid var(--line);border-radius:7px;background:var(--card-2);font-size:9px;cursor:pointer}
.prototype-options button.is-active{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-deep)}

  function copyResultText(value, label) {
    function copied() { qj.toast(label + '已复制'); }
    function fallback() {
      var textarea = document.createElement('textarea');
      textarea.value = value;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      var success = false;
      try { success = document.execCommand('copy'); } catch (error) { success = false; }
      textarea.remove();
      if (success) copied(); else qj.toast('复制失败，请手动复制', 'err');
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(value).then(copied).catch(fallback);
    } else {
      fallback();
    }
  }

  function drawDownloadText(context, text, x, y, maxWidth, lineHeight, maxLines) {
    var chars = Array.from(text);
    var line = '';
    var lines = [];
    chars.forEach(function (char) {
      var next = line + char;
      if (context.measureText(next).width > maxWidth && line) {
        lines.push(line);
        line = char;
      } else {
        line = next;
      }
    });
    if (line) lines.push(line);
    lines.slice(0, maxLines).forEach(function (entry, index) { context.fillText(entry, x, y + index * lineHeight); });
  }

  function downloadResultMedia() {
    if (state.contentType === 'short') {
      qj.toast('视频下载任务已创建（原型演示）');

      ['#6877a1','#d9c28f','#26365d','#f7f1e7'],
      ['#24423b','#8ab097','#132a27','#f2eee3']

    output.width = 1080;
    output.height = 1440;
    var context = output.getContext('2d');
    var gradient = context.createLinearGradient(0,0,1080,900);
    gradient.addColorStop(0, colors[0]);
    gradient.addColorStop(1, colors[1]);
    context.fillStyle = gradient;
    context.fillRect(0,0,1080,900);
    context.fillStyle = colors[2];
    context.beginPath();
    context.ellipse(245,765,430,260,-.16,0,Math.PI * 2);
    context.fill();
    context.fillStyle = 'rgba(255,250,238,.88)';
    context.fillRect(630,175,300,480);
    context.fillStyle = '#5c4a35';
    context.textAlign = 'center';
    context.font = '500 28px "Microsoft YaHei",sans-serif';
    context.fillText(brand().name,780,350);
    context.font = '700 48px "Microsoft YaHei",sans-serif';
    context.fillText(state.product,780,420);
    context.fillStyle = colors[3];
    context.fillRect(0,900,1080,540);
    context.textAlign = 'left';
    context.fillStyle = '#9a6a1e';
    context.font = '600 28px "Microsoft YaHei",sans-serif';
    context.fillText('小红书 · 图文笔记',70,1010);

  function startGeneration(retry) {
    var batchCount = Math.max(1, selectedDirectionIndexes().length);

    closeComplianceModal();
    clearTimers();
    state.stage = 'generating';

    render();
    later(function () {

      state.generation.progress = 42;

      render();

      else selectedIndexes.push(directionIndex);
      selectedIndexes.sort(function (a, b) { return a - b; });
      state.selectedDirections = selectedIndexes;

      delete state.resultPreviews[deletedDirection];
      delete state.resultEdits[deletedDirection];
      if (state.activeResultEditor && Number(state.activeResultEditor.direction) === deletedDirection) state.activeResultEditor = null;
      state.selectedDirection = state.selectedDirections[0];

        if (!state.resultEdits[aiContentDirection]) state.resultEdits[aiContentDirection] = {};

  document.addEventListener('keydown', function (event) {

      return;
    }
    var composerOption = event.target.closest('.composer-filter-option');
    if (composerOption && ['ArrowDown','ArrowUp','Home','End'].indexOf(event.key) > -1) {
      event.preventDefault();
      var composerOptions = Array.prototype.slice.call(composerOption.parentElement.querySelectorAll('.composer-filter-option'));
      var composerIndex = composerOptions.indexOf(composerOption);
      if (event.key === 'Home') composerIndex = 0;
      if (event.key === 'End') composerIndex = composerOptions.length - 1;
      if (event.key === 'ArrowDown') composerIndex = (composerIndex + 1) % composerOptions.length;
      if (event.key === 'ArrowUp') composerIndex = (composerIndex - 1 + composerOptions.length) % composerOptions.length;
      composerOptions[composerIndex].focus();
      return;
    }
    var parameterTrigger = event.target.closest('[data-parameter-toggle]');
    if (parameterTrigger && (event.key === 'ArrowDown' || event.key === 'ArrowUp')) {
      event.preventDefault();
      var parameterDropdown = parameterTrigger.closest('[data-parameter-dropdown]');
      openParameterDropdown(parameterDropdown);
      var parameterOptions = parameterDropdown.querySelectorAll('.parameter-option');
      var activeOption = parameterDropdown.querySelector('.parameter-option.is-active');
      var focusOption = event.key === 'ArrowUp' ? parameterOptions[parameterOptions.length - 1] : (activeOption || parameterOptions[0]);
      if (focusOption) focusOption.focus();
      return;
    }
    var parameterOption = event.target.closest('.parameter-option');
    if (parameterOption && ['ArrowDown','ArrowUp','Home','End'].indexOf(event.key) > -1) {
      event.preventDefault();
      var optionList = Array.prototype.slice.call(parameterOption.parentElement.querySelectorAll('.parameter-option'));
      var optionIndex = optionList.indexOf(parameterOption);
      if (event.key === 'Home') optionIndex = 0;
      if (event.key === 'End') optionIndex = optionList.length - 1;
      if (event.key === 'ArrowDown') optionIndex = (optionIndex + 1) % optionList.length;
      if (event.key === 'ArrowUp') optionIndex = (optionIndex - 1 + optionList.length) % optionList.length;
      optionList[optionIndex].focus();
      return;
    }
    if (event.key !== 'Escape') return;
    if (document.querySelector('.composer-filter-panel:not([hidden])')) {
      closeComposerFilterMenus(true);
      return;
    }
    if (document.querySelector('[data-parameter-dropdown].is-open')) {
      closeParameterDropdowns(true);
      return;
    }
    if (!document.getElementById('matrixModal').hidden) closeMatrix();
    if (!document.getElementById('complianceModal').hidden) closeComplianceModal();
  });

  syncDemo();
  render();
})();
</script>
</body>
</html>
