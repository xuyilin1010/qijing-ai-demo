<?xml version="1.0" encoding="UTF-8"?>
<!--
  三感切换 SVG 交互组件（公众号兼容版）
  交互：点击 观感/口感/情感 圆形按钮，切换下方内容卡片。
  技术：SVG SMIL <set>，不依赖 JS。
  用法：
    1. 替换图片 URL（目前为占位，需上传公众号素材库后替换）；
    2. 将整个 SVG 粘贴到公众号编辑器的 SVG 代码模式；
    3. 外层包裹 section，设置 line-height: 0。
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 750 1150" width="100%" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05080d" stop-opacity="1"/>
      <stop offset="45%" stop-color="#05080d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#05080d" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- 深色底 -->
  <rect width="750" height="1150" fill="#05080d"/>

  <!-- 装饰：底部金色/蓝色光带 -->
  <path d="M-50,1000 C150,950 300,1100 450,1030 S750,930 800,1000" fill="none" stroke="#d4a855" stroke-width="2.5" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.75;0.45" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M-50,1080 C200,1030 350,1180 500,1110 S800,980 850,1080" fill="none" stroke="#4fb8e8" stroke-width="1.5" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- 标题 -->
  <text x="375" y="75" text-anchor="middle" font-size="23" fill="#d4a855" font-weight="bold" letter-spacing="3">一度三感 · 味觉新境</text>
  <text x="375" y="115" text-anchor="middle" font-size="15" fill="#ffffff" opacity="0.8">点击切换，体验三重境界</text>

  <!-- 三个切换按钮 -->
  <g id="btn-guan" transform="translate(160,230)" cursor="pointer">
    <circle r="66" fill="rgba(0,0,0,0.45)" stroke="#d4a855" stroke-width="3.5"/>
    <text y="7" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">观感</text>
  </g>
  <g id="btn-kou" transform="translate(375,230)" cursor="pointer">
    <circle r="66" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <text y="7" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">口感</text>
  </g>
  <g id="btn-qing" transform="translate(590,230)" cursor="pointer">
    <circle r="66" fill="rgba(0,0,0,0.45)" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
    <text y="7" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">情感</text>
  </g>

  <!-- 按钮高亮状态：被点击时金色描边，其他按钮变灰 -->
  <!-- 观感按钮 -->
  <set href="#btn-guan circle" attributeName="stroke" to="#d4a855" begin="btn-guan.click" fill="freeze"/>
  <set href="#btn-guan circle" attributeName="stroke-width" to="3.5" begin="btn-guan.click" fill="freeze"/>
  <set href="#btn-guan circle" attributeName="stroke" to="rgba(255,255,255,0.35)" begin="btn-kou.click; btn-qing.click" fill="freeze"/>
  <set href="#btn-guan circle" attributeName="stroke-width" to="2" begin="btn-kou.click; btn-qing.click" fill="freeze"/>

  <!-- 口感按钮 -->
  <set href="#btn-kou circle" attributeName="stroke" to="#d4a855" begin="btn-kou.click" fill="freeze"/>
  <set href="#btn-kou circle" attributeName="stroke-width" to="3.5" begin="btn-kou.click" fill="freeze"/>
  <set href="#btn-kou circle" attributeName="stroke" to="rgba(255,255,255,0.35)" begin="btn-guan.click; btn-qing.click" fill="freeze"/>
  <set href="#btn-kou circle" attributeName="stroke-width" to="2" begin="btn-guan.click; btn-qing.click" fill="freeze"/>

  <!-- 情感按钮 -->
  <set href="#btn-qing circle" attributeName="stroke" to="#d4a855" begin="btn-qing.click" fill="freeze"/>
  <set href="#btn-qing circle" attributeName="stroke-width" to="3.5" begin="btn-qing.click" fill="freeze"/>
  <set href="#btn-qing circle" attributeName="stroke" to="rgba(255,255,255,0.35)" begin="btn-guan.click; btn-kou.click" fill="freeze"/>
  <set href="#btn-qing circle" attributeName="stroke-width" to="2" begin="btn-guan.click; btn-kou.click" fill="freeze"/>

  <!-- 内容卡片：观感（默认显示） -->
  <g id="card-guan" transform="translate(0,340)">
    <image href="https://your-cdn.com/hi_p09.jpg" x="30" y="0" width="690" height="800" preserveAspectRatio="xMidYMid slice"/>
    <rect x="30" y="0" width="690" height="800" rx="16" fill="url(#topFade)"/>
    <text x="375" y="540" text-anchor="middle" font-size="14" fill="#d4a855" letter-spacing="4">观感</text>
    <text x="375" y="590" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="bold">先锋设计</text>
    <text x="375" y="640" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">承袭行者经典黄黑配色</text>
    <text x="375" y="675" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">植绒视窗 · 日照金山</text>
    <text x="375" y="710" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">每一次注目，都是不凡</text>
  </g>

  <!-- 内容卡片：口感（默认隐藏） -->
  <g id="card-kou" transform="translate(0,340)" display="none">
    <set href="#card-kou" attributeName="display" to="block" begin="btn-kou.click" fill="freeze"/>
    <set href="#card-kou" attributeName="display" to="none" begin="btn-guan.click; btn-qing.click" fill="freeze"/>
    <image href="https://your-cdn.com/hi_p12.jpg" x="30" y="0" width="690" height="800" preserveAspectRatio="xMidYMid slice"/>
    <rect x="30" y="0" width="690" height="800" rx="16" fill="url(#topFade)"/>
    <text x="375" y="540" text-anchor="middle" font-size="14" fill="#d4a855" letter-spacing="4">口感</text>
    <text x="375" y="590" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="bold">冰咖爆珠</text>
    <text x="375" y="640" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">3.5mm 大径爆珠</text>
    <text x="375" y="675" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">薄荷精粹与咖啡醇厚交织</text>
    <text x="375" y="710" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">一捏即享冰爽醇香</text>
  </g>

  <!-- 内容卡片：情感（默认隐藏） -->
  <g id="card-qing" transform="translate(0,340)" display="none">
    <set href="#card-qing" attributeName="display" to="block" begin="btn-qing.click" fill="freeze"/>
    <set href="#card-qing" attributeName="display" to="none" begin="btn-guan.click; btn-kou.click" fill="freeze"/>
    <image href="https://your-cdn.com/hi_p14.jpg" x="30" y="0" width="690" height="800" preserveAspectRatio="xMidYMid slice"/>
    <rect x="30" y="0" width="690" height="800" rx="16" fill="url(#topFade)"/>
    <text x="375" y="540" text-anchor="middle" font-size="14" fill="#d4a855" letter-spacing="4">情感</text>
    <text x="375" y="590" text-anchor="middle" font-size="34" fill="#ffffff" font-weight="bold">行者共鸣</text>
    <text x="375" y="640" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">行者之名，焕新再启</text>
    <text x="375" y="675" text-anchor="middle" font-size="18" fill="#ffffff" opacity="0.92">追逐梦想、敢于探索、向往自由</text>
  </g>
</svg>
