<?xml version="1.0" encoding="UTF-8"?>
<!--
  封面上下箭头提示 SVG（公众号兼容版）
  用法：覆盖在封面底图上，pointer-events: none
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 80" width="48" height="80" style="display:block;pointer-events:none;">
  <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 上方箭头向上 -->
    <g>
      <path d="M24 52 L24 28">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M18 34 L24 28 L30 34">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,-8; 0,0" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </g>
    <!-- 下方箭头向下 -->
    <g>
      <path d="M24 28 L24 52">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <path d="M18 46 L24 52 L30 46">
        <animateTransform attributeName="transform" type="translate" values="0,0; 0,8; 0,0" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <animate attributeName="opacity" values="0.8;1;0.8" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
