<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>奇境.ai · 排期</title>
<!-- 内容日历 · 奇境皮 · 套 qj-shell · 待排期池(localStorage qijing_topic_pool,与选题页共享)
     排到日子 → chip → 去制作/移回 · 真实节点叠加 -->
<link rel="stylesheet" href="奇境-字体.css">
<link rel="stylesheet" href="qj-shell.css">
<style>
  .zone-h{display:flex;align-items:baseline;gap:14px;margin-bottom:16px}
  .zone-h h3{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.3px;display:flex;align-items:center;gap:10px;color:var(--ink)}
  .zone-h h3 .spark{width:14px;height:14px;fill:var(--gold);flex:none;transform:translateY(1px)}
  .zone-h .rule{flex:1;height:1px;background:var(--line)}
  .zone-h .more{font-size:12.5px;color:var(--ink3);font-weight:500}
  .zone-h .more:hover{color:var(--gold-deep)}

  .grid2{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}

  /* 待排期池 */
  .pool{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);overflow:hidden;position:sticky;top:14px}
  .pool-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--ink3);padding:13px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
  .pool-h b{color:var(--gold-deep)}
  .pool-list{max-height:62vh;overflow-y:auto}
  .pitem{padding:12px 15px;border-bottom:1px solid var(--line);border-left:2.5px solid transparent}
  .pitem:last-child{border-bottom:0}
  .pitem.cat-mc{border-left-color:var(--navy)} .pitem.cat-xy{border-left-color:#8a5a86} .pitem.cat-car{border-left-color:var(--gold)}
  .pitem .pn{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
  .pitem .pt{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--ink);line-height:1.4;margin:2px 0 7px}
  .pitem .sched-btn{height:28px;padding:0 12px;border:1px solid var(--gold-line);border-radius:8px;background:var(--gold-soft);color:var(--gold-deep);font-size:11.5px;font-weight:600;cursor:pointer}
  .pitem .sched-btn:hover{background:var(--gold-soft2)}
  .pool-empty{padding:40px 18px;text-align:center;color:var(--ink3);font-size:12.5px;line-height:1.7}
  .pool-empty a{color:var(--gold-deep);font-weight:600}

  /* 日历 · 账号泳道 */
  .cal{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-1);padding:16px 18px}
  .cal-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
  .cal-h .t{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--ink)}
  .cal-h .d{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .swim{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg-top)}
  .swim::-webkit-scrollbar{height:9px}.swim::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
  .swim-grid{display:grid;min-width:max-content}
  .sw-corner{position:sticky;left:0;top:0;z-index:4;background:var(--card-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line2)}
  .sw-dayh{position:sticky;top:0;z-index:1;background:var(--card-2);border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 8px;display:flex;align-items:baseline;gap:5px}
  .sw-dayh.today{background:var(--gold-soft)}
  .sw-dayh .dd{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink2)} .sw-dayh.today .dd{color:var(--gold-deep)}
  .sw-dayh .wd{font-family:var(--mono);font-size:9px;color:var(--ink4)}
  .sw-dayh .node{font-size:8.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:1px 4px;margin-left:auto;line-height:1.35}
  .sw-acct{position:sticky;left:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);border-right:1px solid var(--line2);padding:8px 9px;display:flex;align-items:center;gap:7px}
  .sw-acct .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .sw-acct.cat-mc .dot{background:var(--navy)} .sw-acct.cat-xy .dot{background:#6d4f76} .sw-acct.cat-car .dot{background:#2a6e6b}
  .sw-acct .an{font-family:var(--serif);font-size:12.5px;font-weight:600;color:var(--ink)}
  .sw-acct .ar{font-size:9px;color:var(--ink4)}
  .sw-cell{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:4px;min-height:58px}
  .sw-cell.today{background:var(--gold-soft)}
  .chip{font-size:10.5px;line-height:1.3;border-radius:6px;padding:4px 7px;cursor:pointer;color:#fff;position:relative}
  .chip.cat-mc{background:var(--navy)} .chip.cat-xy{background:#6d4f76} .chip.cat-car{background:linear-gradient(150deg,#c79a44,#a87f30)}
  .chip .ct{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 状态机：排进日历后的生命周期 */
  .chip .cst{display:block;font-size:8px;font-weight:700;letter-spacing:.3px;line-height:1.4;opacity:.95}
  .chip .cst::before{content:'●';margin-right:3px;font-size:7px;vertical-align:1px}
  .chip.st-todo .cst{color:rgba(255,255,255,.7)}
  .chip.st-doing .cst{color:#ffe2a0}
  .chip.st-ready .cst{color:#bfe0ff}
  .chip.st-done{opacity:.5} .chip.st-done .cst{color:#c4eecf} .chip.st-done .ct{text-decoration:line-through;text-decoration-thickness:.5px}
  /* 翻周：用共享 qj-pager，仅补本页定位 */
  .cal-h .qj-pager{margin-left:auto;align-self:center}
  /* chip 浮层里的状态切换 */
  .pop-status{display:flex;gap:5px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pop-status .ps{font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--ink2);background:var(--card)}
  .pop-status .ps:hover{border-color:var(--gold-line);color:var(--gold-deep)}
  .pop-status .ps.on{background:var(--navy);color:var(--night-ink);border-color:var(--navy);font-weight:600}
  .sw-cell .cadd{font-size:13px;color:var(--ink4);text-align:center;border:1px dashed var(--line2);border-radius:6px;cursor:pointer;line-height:18px;opacity:0;transition:opacity .12s}
  .sw-cell:hover .cadd{opacity:1}

  /* 浮层 */
  .pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-2);min-width:220px;overflow:hidden}
  .pop-h{padding:11px 14px;border-bottom:1px solid var(--line)}
  .pop-h .t{font-family:var(--serif);font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
  .pop-h .s{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-top:3px}
  .pop-item{padding:10px 14px;font-size:13px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px}
  .pop-item:hover{background:var(--card-2)}
  .pop-item.go{color:var(--gold-deep);font-weight:600}
  .pop-days{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 14px}
  .pop-days .pd{font-family:var(--mono);font-size:11px;text-align:center;padding:7px 0;border:1px solid var(--line);border-radius:7px;cursor:pointer;color:var(--ink2)}
  .pop-days .pd:hover{border-color:var(--gold-line);background:var(--gold-soft);color:var(--gold-deep)}

  .toast-host{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .toast{background:var(--navy);color:var(--night-ink);padding:10px 18px;border-radius:999px;font-size:13px;box-shadow:var(--shadow-2);display:inline-flex;align-items:center;gap:9px;animation:tin .25s}
  .toast .ck{width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  @keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body data-active="schedule">
<div class="layout">
  <main class="page"><div class="inner">

    <div class="zone-h">
      <h3><svg class="spark"><use href="#i-spark"/></svg>排期</h3>
      <span class="rule"></span>
      <a class="more" href="奇境-选题-v1.html">← 回选题加几条</a>
    </div>

    <div class="grid2">
      <aside class="pool">
        <div class="pool-h"><svg class="icon" style="width:14px;height:14px;color:var(--gold-deep)"><use href="#i-flame"/></svg>待排期 · <b id="poolN">0</b></div>
        <div class="pool-list" id="poolList"></div>
      </aside>
      <section class="cal">
        <div class="cal-h"><span class="t">内容日历</span>
          <span class="qj-pager"><button class="qj-pager-arrow" id="navPrev" aria-label="前一周">‹</button><button class="qj-pager-now" id="navToday" title="回到本周"><span id="calRange"></span></button><button class="qj-pager-arrow" id="navNext" aria-label="后一周">›</button></span></div>
        <div class="cal-grid" id="calGrid"></div>
      </section>
    </div>

  </div></main>
</div>
<div class="toast-host" id="toastHost"></div>

<script src="qj-shell.js"></script>
<script src="qj-accounts.js"></script>
<script>
const POOL_KEY='qijing_topic_pool';
const $=id=>document.getElementById(id);
const DAYS=14;
const WD=['日','一','二','三','四','五','六'];
const NODES = window.QJ_NODES || {};   // 节点来自共享数据 qj-accounts.js（与选题页同一份）
// 内容状态机：排进日历后的生命周期（待排期池里的还没进，不显状态）
const STATUSES=['待制作','制作中','待发','已发'];
const ST_CLS={'待制作':'st-todo','制作中':'st-doing','待发':'st-ready','已发':'st-done'};
let winStart=0;   // 日历窗口起点（相对今天的天数，按周翻；负=回看已发）
function toast(m){const e=document.createElement('div');e.className='toast';e.innerHTML='<span class="ck">✦</span>'+m;$('toastHost').appendChild(e);setTimeout(()=>{e.style.transition='opacity .25s';e.style.opacity='0';},2000);setTimeout(()=>e.remove(),2400);}
function loadPool(){try{return JSON.parse(localStorage.getItem(POOL_KEY)||'[]')}catch(e){return[]}}
function savePool(p){localStorage.setItem(POOL_KEY,JSON.stringify(p))}
// 首次为空 → 种几条真选题(真内容,非假数据),让日历可演示;选题页加入的也会并进来
function seedIfEmpty(){
  let p=loadPool();
  if(p.length)return p;
  p=[
    {key:'s1',cat:'mc',nm:'明川',who:'首席工程师',column:'答疑',title:'电车到底省不省钱？我把一年的账本摊开给你看',account:'对标·超哥超车',sched:null},
    {key:'s2',cat:'car',nm:'天工06',who:'家享派安心座驾',column:'家享安心',title:'"能试的都试了，越看越不想买"——15万家用SUV，一条帮你锁死',account:'对标·超哥超车',sched:null},
    {key:'s3',cat:'xy',nm:'星遥',who:'文化顾问',column:'纹样的故事',title:'端午的纹样，藏在一台车的灯里',account:'对标·水星逛博物馆',sched:4,status:'制作中'},
    {key:'s4',cat:'xy',nm:'星遥',who:'文化顾问',column:'审美课',title:'夏至，白昼最长的一天，古人怎么用"光"做美学？',account:'对标·意公子',sched:6,status:'待制作'},
    {key:'s5',cat:'mc',nm:'明川',who:'首席工程师',column:'明川说车',title:'辅助驾驶能串北京胡同了？工程师讲清它的能力边界',account:'对标·车哥测评',sched:1,status:'待发'},
    {key:'s6',cat:'car',nm:'天工05',who:'年轻派精致座驾',column:'好开好停',title:'新手最怕的侧方位，这台车一把进——好停到底什么体验',account:'对标·车哥测评',sched:null},
    {key:'s7',cat:'xy',nm:'星遥',who:'文化顾问',column:'审美课',title:'为什么老茶器的"残缺"，比完美更耐看？',account:'对标·意公子',sched:-2,status:'已发'}
  ];
  savePool(p);return p;
}
let pool=seedIfEmpty();
let pop=null;
function closePop(){if(pop){pop.remove();pop=null}}
document.addEventListener('click',closePop);

function dayDate(off){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);return d;}
function md(d){return (d.getMonth()+1)+'/'+d.getDate();}
function offLabel(off){if(off===0)return'今天';if(off===1)return'明天';const d=dayDate(off);return md(d)+' 周'+WD[d.getDay()];}

function render(){
  // 待排期
  const wait=pool.filter(p=>p.sched===null||p.sched===undefined);
  $('poolN').textContent=wait.length;
  $('poolList').innerHTML = wait.length? wait.map(p=>`<div class="pitem cat-${p.cat}">
     <div class="pn">${p.nm}${p.column?' · '+p.column:''}</div>
     <div class="pt">${p.title}</div>
     <button class="sched-btn" data-key="${p.key}">排期 ▾</button></div>`).join('')
   : '<div class="pool-empty">备用池空了。<br>去 <a href="奇境-选题-v1.html">选题</a> 加几条进来 →</div>';
  $('poolList').querySelectorAll('.sched-btn').forEach(b=>b.onclick=e=>{e.stopPropagation();openDayPicker(b.dataset.key,b);});
  // 日历 · 账号泳道（每个号一行 × 日期一列）
  const winEnd=winStart+DAYS-1;
  const r0=dayDate(winStart),r1=dayDate(winEnd);
  $('calRange').textContent=md(r0)+' – '+md(r1);
  const STD=[['明川','cat-mc','首席工程师'],['星遥','cat-xy','文化顾问'],['天工05','cat-car','年轻精致'],['天工06','cat-car','家享安心'],['天工08','cat-car','豪华旗舰'],['EH7','cat-car','安心驾享']];
  const nms=STD.map(r=>r[0]);
  pool.forEach(p=>{if(p.nm&&!nms.includes(p.nm)){nms.push(p.nm);STD.push([p.nm,'cat-'+(p.cat||'car'),p.who||'']);}});
  let h='<div class="swim"><div class="swim-grid" style="grid-template-columns:96px repeat('+DAYS+',132px)">';
  h+='<div class="sw-corner"></div>';
  for(let off=winStart;off<=winEnd;off++){const d=dayDate(off);const k=md(d);const node=NODES[k];
    h+='<div class="sw-dayh'+(off===0?' today':'')+'"><span class="dd">'+k+'</span><span class="wd">周'+WD[d.getDay()]+'</span>'+(node?'<span class="node">'+node+'</span>':'')+'</div>';}
  STD.forEach(row=>{
    const nm=row[0];
    h+='<div class="sw-acct '+row[1]+'"><span class="dot"></span><span><span class="an">'+nm+'</span><br><span class="ar">'+row[2]+'</span></span></div>';
    for(let off=winStart;off<=winEnd;off++){
      const chips=pool.filter(p=>p.nm===nm&&p.sched===off);
      h+='<div class="sw-cell'+(off===0?' today':'')+'">'
        +chips.map(c=>{const st=c.status||'待制作';return '<div class="chip cat-'+c.cat+' '+(ST_CLS[st]||'st-todo')+'" data-key="'+c.key+'"><span class="cst">'+st+'</span><span class="ct">'+c.title+'</span></div>';}).join('')
        +(off>=0?'<div class="cadd" data-off="'+off+'" data-nm="'+nm+'" title="给 '+nm+' 排一条到这天">＋</div>':'')+'</div>';
    }
  });
  h+='</div></div>';
  $('calGrid').innerHTML=h;
  $('calGrid').querySelectorAll('.chip').forEach(ch=>ch.onclick=e=>{e.stopPropagation();openChipPop(ch.dataset.key,ch);});
  $('calGrid').querySelectorAll('.cadd').forEach(c=>c.onclick=e=>{e.stopPropagation();openCellPicker(+c.dataset.off,c.dataset.nm,c);});
}

function place(el){closePop();document.body.appendChild(el);pop=el;const r=el._anchor.getBoundingClientRect();
  let top=r.bottom+6,left=r.left;if(left+el.offsetWidth>innerWidth-12)left=innerWidth-el.offsetWidth-12;
  if(top+el.offsetHeight>innerHeight-12)top=r.top-el.offsetHeight-6;el.style.top=top+'px';el.style.left=left+'px';}

function openDayPicker(key,anchor){
  closePop();const it=pool.find(p=>p.key===key);if(!it)return;
  const el=document.createElement('div');el.className='pop';el._anchor=anchor;
  let days='';for(let o=0;o<DAYS;o++)days+=`<div class="pd" data-off="${o}">${o===0?'今天':o===1?'明天':md(dayDate(o))}</div>`;
  el.innerHTML=`<div class="pop-h"><div class="t">${it.title}</div><div class="s">排到哪天？</div></div><div class="pop-days">${days}</div>`;
  el.onclick=e=>e.stopPropagation();
  el.querySelectorAll('.pd').forEach(d=>d.onclick=()=>{it.sched=+d.dataset.off;if(!it.status)it.status='待制作';savePool(pool);closePop();render();toast('已排到 '+offLabel(it.sched)+' · 待制作');});
  place(el);
}
function openCellPicker(off,nm,anchor){
  closePop();const wait=pool.filter(p=>p.sched===null&&p.nm===nm);
  const el=document.createElement('div');el.className='pop';el._anchor=anchor;
  el.innerHTML=`<div class="pop-h"><div class="t">给 ${nm} 排一条到 ${offLabel(off)}</div><div class="s">从 ${nm} 的待排期里选</div></div>`+
    (wait.length?'<div style="max-height:260px;overflow:auto">'+wait.map(p=>`<div class="pop-item" data-key="${p.key}"><span>${p.title}</span></div>`).join('')+'</div>'
     :'<div class="pop-item" style="color:var(--ink3)">'+nm+' 没有待排期的选题，去选题加</div>');
  el.onclick=e=>e.stopPropagation();
  el.querySelectorAll('.pop-item[data-key]').forEach(i=>i.onclick=()=>{const it=pool.find(p=>p.key===i.dataset.key);it.sched=off;if(!it.status)it.status='待制作';savePool(pool);closePop();render();toast('已把 '+nm+' 的这条排到 '+offLabel(off)+' · 待制作');});
  place(el);
}
function openChipPop(key,anchor){
  closePop();const it=pool.find(p=>p.key===key);if(!it)return;
  const el=document.createElement('div');el.className='pop';el._anchor=anchor;
  const url='奇境-创作-v1.html?t='+encodeURIComponent(it.title)+'&nm='+encodeURIComponent(it.nm);
  el.innerHTML=`<div class="pop-h"><div class="t">${it.title}</div><div class="s">${it.nm} · ${offLabel(it.sched)}${it.account?' · '+it.account:''}</div></div>
    <div class="pop-status">${STATUSES.map(s=>`<span class="ps${(it.status||'待制作')===s?' on':''}" data-st="${s}">${s}</span>`).join('')}</div>
    <a class="pop-item go" href="${url}">🎬 去制作 · 交给 AI 摄制组</a>
    <div class="pop-item" data-act="back">↩︎ 移回待排期</div>`;
  el.onclick=e=>e.stopPropagation();
  el.querySelectorAll('.ps').forEach(b=>b.onclick=()=>{it.status=b.dataset.st;savePool(pool);closePop();render();toast('状态 → '+it.status);});
  el.querySelector('[data-act="back"]').onclick=()=>{it.sched=null;savePool(pool);closePop();render();toast('已移回待排期');};
  place(el);
}
$('navPrev').onclick=()=>{winStart-=7;render();};
$('navNext').onclick=()=>{winStart+=7;render();};
$('navToday').onclick=()=>{winStart=0;render();};
render();
</script>
</body>
</html>
