<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手机尺寸预览</title><style>body{margin:20px;background:#152031;color:#c1cedd;font:13px/1.8 sans-serif}header{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}button,select,a{font:inherit;color:#d5c3a1;background:#0a1423;border:1px solid #657186;padding:6px 10px;text-decoration:none;cursor:pointer}iframe{border:1px solid #55667c;display:block;background:#071321}p{color:#8196ae}</style></head><body><header><button data-size="landscape">手机横屏 844 × 390</button><button data-size="rotate">手机竖屏 · 横屏沉浸</button><button data-size="portrait">手机竖屏 · 适应屏幕</button><select aria-label="检查章节" id="chapter"><option value="cover">竖屏封面</option value="0">文化核心</option><option value="1">产品定位</option><option value="2">产品介绍</option><option value="3">三组视频</option><option value="4">人物画像</option><option value="5">人物故事</option><option value="6">联系页</option></select><a href="index.html">打开正式预览</a></header><iframe title="手机尺寸中的交互预览" id="phone" width="844" height="390" src="index.html"></iframe><p id="size-label">844 × 390 / 这是浏览器尺寸模拟，并非手机微信验证。</p><script>let size='landscape';const frame=document.getElementById('phone');function update(){const chapter=document.getElementById('chapter').value;frame.width=size==='landscape'?844:390;frame.height=size==='landscape'?390:844;const mode=size==='portrait'?'adaptive':'immersive';frame.src='index.html'+(chapter==='cover'?'':'?preview=1&mode='+mode+'&chapter='+chapter);document.getElementById('size-label').textContent=frame.width+' × '+frame.height+' / 浏览器尺寸模拟';}document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{size=b.dataset.size;update();}));document.getElementById('chapter').addEventListener('change',update);</script></body></html>
